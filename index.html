 {"sets": 3, "lo": 8, "hi": 15, "unit": "nivel", "levels": ["Con apoyo de manos", "Sin manos", "Con mochila o peso al pecho"]}, "desc": "Fortalece piernas y glúteos con el movimiento más importante del día a día: pararse y sentarse."}, "fz_puente": {"n": "Puente de glúteos en el suelo, con progresión", "cat": "mmii", "t": ["fuerza", "glut", "lumbar"], "dose": "3×10–15, 3 veces por semana", "how": ["Acuéstate de espalda con las rodillas dobladas y los pies apoyados al ancho de las caderas.", "Aprieta los glúteos y sube la cadera hasta formar una línea de los hombros a las rodillas.", "Mantén 2 segundos arriba y baja lento."], "care": "Empuja con los talones. Si sientes el esfuerzo en la espalda baja y no en los glúteos, sube menos.", "contra": "Dolor lumbar agudo que aumenta al extender la cadera.", "prog": {"sets": 3, "lo": 10, "hi": 15, "unit": "nivel", "levels": ["Dos piernas", "Banda sobre las rodillas", "Una pierna"]}, "desc": "Fortalece glúteos y la parte posterior de los muslos, y protege la espalda baja."}, "sc_golpes": {"n": "Golpes al aire sentado (cardio)", "cat": "res", "t": ["sin_carga", "acond"], "dose": "4 bloques de 1 min, 3 a 5 veces/semana", "how": ["Siéntate firme: en la silla de ruedas con los frenos puestos, o en una silla con respaldo. La pierna operada queda apoyada como te indicaron, sin cargar peso.", "Lanza golpes suaves al frente alternando los brazos, a un ritmo en que todavía puedas conversar.", "Haz 1 minuto de golpes y 1 minuto de pausa; repite 4 veces."], "care": "El esfuerzo debe sentirse entre 4 y 6 de 10. Si te falta el aire, sientes el pecho apretado o te mareas, detente.", "contra": "Dolor de hombro con el movimiento o una restricción cardiológica para hacer ejercicio.", "desc": "Mantiene activos el corazón y los pulmones mientras no puedes caminar: es cardio que se hace solo con los brazos, sentado."}, "sc_pedalera_brazos": {"n": "Pedalear con los brazos en una pedalera", "cat": "res", "t": ["sin_carga", "acond"], "dose": "10–20 min suave, 3 a 5 veces/semana", "how": ["Pon una pedalera estática sobre una mesa firme, frente a ti, a la altura del pecho.", "Siéntate firme: en la silla de ruedas con los frenos puestos, o en una silla con respaldo. La pierna operada queda apoyada como te indicaron, sin cargar peso.", "Pedalea con las manos a un ritmo cómodo, con la espalda apoyada y los hombros relajados."], "care": "Parte con 5 minutos y suma 2 a 3 minutos por semana. Debes poder conversar mientras pedaleas.", "contra": "Dolor de hombro o de codo con el movimiento, o una restricción cardiológica para hacer ejercicio.", "desc": "Ejercicio aeróbico de brazos para cuidar tu condición física y la circulación mientras la pierna está en reposo."}, "sc_press_pecho": {"n": "Empuje de pecho con banda, sentado", "cat": "mmss", "t": ["sin_carga", "sup", "fuerza"], "dose": "3×10–15, 2 o 3 veces por semana", "how": ["Pasa una banda elástica por detrás del respaldo y toma un extremo con cada mano, a la altura del pecho.", "Siéntate firme: en la silla de ruedas con los frenos puestos, o en una silla con respaldo. La pierna operada queda apoyada como te indicaron, sin cargar peso.", "Empuja las manos al frente hasta estirar los brazos y vuelve lento."], "care": "No arquees la espalda ni subas los hombros. Revisa que la banda no se resbale del respaldo.", "contra": "Lesión o cirugía reciente de hombro, codo o muñeca sin autorización.", "prog": {"sets": 3, "lo": 10, "hi": 15, "unit": "banda", "levels": ["Amarilla (suave)", "Roja", "Verde", "Azul", "Negra (fuerte)"]}, "desc": "Fortalece pecho, hombros y tríceps, los músculos que empujan el andador o las muletas y te ayudan a levantarte."}, "sc_jalon": {"n": "Jalón con banda desde arriba, sentado", "cat": "mmss", "t": ["sin_carga", "sup", "fuerza"], "dose": "3×10–15, 2 o 3 veces por semana", "how": ["Fija una banda elástica en la parte alta de una puerta cerrada y siéntate frente a ella.", "Toma un extremo con cada mano, con los brazos estirados hacia arriba y adelante.", "Tira hacia abajo llevando los codos a los costados del cuerpo, junta los omóplatos y vuelve lento."], "care": "El tronco no se mueve: trabajan los brazos y la espalda. Revisa que la banda esté bien fijada antes de tirar.", "contra": "Dolor de hombro al levantar los brazos o cirugía reciente de hombro sin autorización.", "prog": {"sets": 3, "lo": 10, "hi": 15, "unit": "banda", "levels": ["Amarilla (suave)", "Roja", "Verde", "Azul", "Negra (fuerte)"]}, "desc": "Fortalece la espalda y los brazos para mantener una buena postura sentado y sostener tu peso en el andador o las muletas."}, "sc_descarga": {"n": "Elevarse con los brazos en la silla", "cat": "mmss", "t": ["sin_carga", "fuerza"], "dose": "3×5, 2 o 3 veces por semana", "how": ["Pon los frenos de la silla y apoya las manos en los apoyabrazos o en el borde del asiento.", "Empuja hacia abajo estirando los codos hasta despegar la cadera unos centímetros del asiento.", "Mantén lo que indique tu nivel y baja lento. El pie operado no se apoya."], "care": "Los hombros van lejos de las orejas. No aguantes la respiración. Además de fortalecer los brazos para el andador o las muletas, alivia la presión en los glúteos.", "contra": "Dolor o cirugía reciente de hombro, codo o muñeca, o una silla sin frenos.", "prog": {"sets": 3, "lo": 2, "hi": 5, "unit": "nivel", "rl": "s", "levels": ["Solo empujar, sin despegar", "Despegar la cadera", "Despegar y mantener arriba"]}, "desc": "Fortalece los brazos para pasarte de la silla a la cama o al baño, y alivia la presión sobre los glúteos para cuidar la piel."}, "sc_rotacion": {"n": "Rotación de tronco sentado con una pelota", "cat": "lum", "t": ["sin_carga", "lumbar", "core", "acond"], "dose": "2×10 por lado, 1 vez al día", "how": ["Siéntate firme: en la silla de ruedas con los frenos puestos, o en una silla con respaldo. La pierna operada queda apoyada como te indicaron, sin cargar peso.", "Toma una pelota o una botella con las dos manos frente al pecho, con los codos un poco doblados.", "Gira el tronco lento hacia un lado y luego hacia el otro, sin mover la cadera."], "care": "Gira solo hasta donde no duela. Si te mareas, hazlo más lento y con menos giro.", "contra": "Cirugía reciente de columna o de abdomen sin autorización.", "desc": "Mantiene la movilidad de la columna y activa el abdomen cuando pasas muchas horas sentado."}, "sc_inclinacion": {"n": "Inclinarse hacia atrás sentado (abdomen)", "cat": "lum", "t": ["sin_carga", "fuerza", "core", "acond"], "dose": "3×8 de 3 s, 2 o 3 veces por semana", "how": ["Siéntate en la mitad delantera de una silla firme con respaldo, con el pie sano apoyado y la pierna operada como te indicaron.", "Con la espalda recta, inclínate hacia atrás unos centímetros, sin tocar el respaldo, apretando el abdomen.", "Mantén 3 segundos botando el aire y vuelve derecho."], "care": "El respaldo queda detrás de ti por seguridad. Si duele la espalda baja, inclínate menos.", "contra": "Dolor lumbar agudo, hernia abdominal o cirugía abdominal reciente.", "prog": {"sets": 3, "lo": 5, "hi": 8, "unit": "nivel", "levels": ["Manos sobre los muslos", "Brazos cruzados al pecho", "Brazos estirados al frente"]}, "desc": "Fortalece el abdomen sin tener que acostarte y mejora el control del tronco al sentarte, pararte y caminar con apoyo."}, "sc_rodilla_sana": {"n": "Levantar la rodilla sana sentado", "cat": "mmii", "t": ["sin_carga", "fuerza"], "dose": "3×10–15, 2 o 3 veces por semana", "how": ["Siéntate firme: en la silla de ruedas con los frenos puestos, o en una silla con respaldo. La pierna operada queda apoyada como te indicaron, sin cargar peso.", "Afírmate de los apoyabrazos o del asiento.", "Levanta la rodilla de la pierna sana unos centímetros, mantén 2 segundos y bájala lento."], "care": "La espalda no se va hacia atrás. Trabaja solo la pierna que tienes autorizada.", "contra": "Indicación médica de no mover esa cadera.", "prog": {"sets": 3, "lo": 10, "hi": 15, "unit": "nivel", "levels": ["Sin peso", "Con tobillera o banda suave", "Con tobillera o banda firme"]}, "desc": "Mantiene la fuerza de la pierna sana, que hará todo el trabajo al pararte y al caminar sin apoyar la otra."}, "sc_marcha_sin_apoyo": {"n": "Marcha sin apoyo con andador o muletas", "cat": "res", "t": ["sin_carga", "muletas", "postop"], "dose": "Según indicación", "how": ["De pie, con la pierna operada en el aire y la rodilla un poco doblada, adelanta el andador (o las dos muletas) un paso corto.", "Apoya firme las manos, empuja hacia abajo con los brazos y avanza la pierna sana hasta la altura del andador.", "Detente, recupera el equilibrio y repite. El pie operado nunca toca el suelo."], "care": "Las primeras veces, con tu kinesiólogo o un acompañante al lado. Es un paso, no un salto. Para girar, da pasos cortos con la pierna sana.", "load": true, "contra": "Sin entrenamiento previo con un profesional, mareo sin evaluar o fuerza insuficiente en los brazos o en la pierna sana.", "desc": "Te permite moverte en distancias cortas respetando la indicación de no apoyar, mientras entrenas los brazos y la pierna sana."}, "ab_crunch": {"n": "Abdominal corto (encogimiento)", "cat": "lum", "t": ["core", "acond", "fuerza"], "dose": "3×10–15, 2 o 3 veces por semana", "how": ["Acuéstate de espalda con las rodillas dobladas y los pies apoyados.", "Bota el aire y despega solo la cabeza y los hombros del suelo, mirando hacia las rodillas.", "Baja lento. La espalda baja se queda apoyada todo el tiempo."], "care": "No tires del cuello con las manos: el mentón va un poco recogido, como sosteniendo una naranja. Si duele la espalda o el cuello, detente.", "contra": "Osteoporosis o fractura vertebral por fragilidad (doblar el tronco de forma repetida aumenta el riesgo), hernia abdominal o inguinal, diástasis abdominal, cirugía abdominal o de columna reciente, o embarazo.", "prog": {"sets": 3, "lo": 10, "hi": 15, "unit": "nivel", "levels": ["Brazos estirados hacia las rodillas", "Brazos cruzados al pecho", "Manos junto a las sienes"]}, "desc": "Fortalece el abdomen frontal con un movimiento corto, sin despegar la espalda baja del suelo."}, "ab_oblicuo": {"n": "Abdominal oblicuo cruzado", "cat": "lum", "t": ["core", "acond", "fuerza"], "dose": "3×8–12 por lado, 2 veces por semana", "how": ["Acuéstate de espalda con las rodillas dobladas, los pies apoyados y una mano junto a la sien.", "Bota el aire y lleva el hombro hacia la rodilla del lado contrario, despegando solo la parte alta de la espalda.", "Baja lento y repite; luego cambia de lado."], "care": "El giro sale del tronco, no del codo. La espalda baja no se despega del suelo.", "contra": "Osteoporosis o fractura vertebral por fragilidad (doblar el tronco de forma repetida aumenta el riesgo), hernia abdominal o inguinal, diástasis abdominal, cirugía abdominal o de columna reciente, o embarazo.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "nivel", "levels": ["Pies apoyados", "Pie del lado contrario sobre la rodilla", "Piernas en el aire con rodillas dobladas"]}, "desc": "Trabaja los costados del abdomen, que ayudan a girar y a estabilizar el tronco al caminar y al cargar cosas."}, "ab_talones": {"n": "Toques de talón acostado", "cat": "lum", "t": ["core", "acond"], "dose": "3×10–16 toques, 2 o 3 veces por semana", "how": ["Acuéstate de espalda con las rodillas dobladas, los pies apoyados un poco separados y los brazos estirados junto al cuerpo.", "Despega apenas los hombros del suelo.", "Inclina el tronco hacia un lado para tocar el talón con la mano y luego hacia el otro, sin apurarte."], "care": "Respira de forma continua. Si sientes el cuello cansado, apoya la cabeza entre series.", "contra": "Cirugía abdominal o de columna reciente, hernia abdominal o embarazo avanzado.", "desc": "Activa los costados del abdomen con un movimiento suave de lado a lado, sin flexionar mucho la columna."}, "ab_rodillas_silla": {"n": "Rodillas al pecho sentado en una silla", "cat": "lum", "t": ["core", "acond", "sin_carga"], "dose": "3×8–12, 2 o 3 veces por semana", "how": ["Siéntate en la mitad delantera de una silla firme apoyada contra la pared y afírmate de los costados del asiento.", "Inclina un poco el tronco hacia atrás, con la espalda recta y sin tocar el respaldo.", "Bota el aire y acerca las rodillas al pecho; baja los pies lento sin dejarlos caer."], "care": "Usa una silla que no se deslice. Si duele la espalda baja, haz el movimiento más corto o con una sola pierna.", "contra": "Dolor lumbar agudo, cirugía abdominal o de cadera reciente, o hernia abdominal.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "nivel", "levels": ["Una pierna a la vez", "Dos piernas, pies tocan el suelo", "Dos piernas sin tocar el suelo"]}, "desc": "Abdominal que se hace sentado: sirve para quien no puede o no quiere bajar al suelo."}, "ab_pallof": {"n": "Antirrotación con banda (press Pallof)", "cat": "lum", "t": ["core", "acond", "fuerza", "lumbar"], "dose": "3×10–12 por lado, 2 o 3 veces por semana", "how": ["Fija una banda elástica a la altura del pecho, en una manilla firme, y párate de lado a ella.", "Toma la banda con las dos manos frente al pecho, con los pies al ancho de los hombros.", "Estira los brazos al frente sin dejar que el tronco gire hacia la banda, mantén 2 segundos y vuelve."], "care": "El cuerpo no se mueve: solo los brazos. Si la banda te gira, aléjate menos o usa una más suave. También se puede hacer sentado.", "contra": "Dolor de hombro al estirar los brazos al frente.", "prog": {"sets": 3, "lo": 10, "hi": 12, "unit": "banda", "levels": ["Amarilla (suave)", "Roja", "Verde", "Azul", "Negra (fuerte)"]}, "desc": "Entrena el abdomen para resistir giros: protege la espalda al cargar bolsas, levantar cosas o cuidar a alguien."}, "ab_escaladores": {"n": "Escaladores lentos con apoyo", "cat": "res", "t": ["core", "acond", "comp"], "dose": "4 bloques de 30 s, 2 o 3 veces/semana", "how": ["Apoya las manos en un mesón firme o en el asiento de una silla contra la pared, con el cuerpo recto.", "Lleva una rodilla re": "La toalla no se debe caer: si se cae, el codo se despegó. El movimiento es solo del antebrazo; no gires el tronco. Detente si el dolor pasa de 3 en una escala de 0 a 10.", "contra": "Luxación de hombro reciente o cirugía de hombro con restricción de rotación externa, sin autorización de tu kinesiólogo.", "desc": "Activa el manguito rotador, los músculos que mantienen el hombro centrado, con el brazo en una posición cómoda y segura."}, "hom_empuje_toalla": {"n": "Empuje de toalla al frente, sentado", "cat": "mmss", "t": ["hombro", "sin_carga"], "dose": "2×10, 1 vez al día", "how": ["Siéntate derecho, sin apoyar la espalda, y toma una toalla enrollada con las dos manos frente al pecho.", "Estira los brazos hacia adelante, a la altura del pecho, y empuja la toalla lejos de ti: los omóplatos se adelantan un poco.", "Mantén 2 segundos y vuelve lento, juntando los omóplatos atrás sin encoger los hombros."], "care": "Los brazos quedan bajo la altura de los hombros. El tronco no se va hacia adelante: el movimiento sale de los omóplatos. Detente si el dolor pasa de 3 de 10.", "contra": "Cirugía de hombro reciente con restricción de elevación hacia adelante, sin autorización de tu kinesiólogo.", "desc": "Activa los músculos que mueven y sostienen el omóplato, la base sobre la que trabaja el hombro."}, "hom_desliz_pared": {"n": "Deslizar la mano por la pared con una toalla", "cat": "mmss", "t": ["hombro", "sin_carga"], "dose": "2×8 por lado, 1 vez al día", "how": ["Párate mirando a la pared, a un paso de ella, y apoya la mano sobre una toalla pequeña contra la pared, a la altura del pecho.", "Desliza la toalla hacia arriba por la pared, lento, hasta donde llegues sin dolor fuerte.", "Mantén 2 segundos arriba y baja deslizando lento. Haz todas las repeticiones y cambia de brazo."], "care": "No arquees la espalda ni te pares en puntas de pie para llegar más arriba. Sube solo hasta donde el dolor sea 3 de 10 o menos; con los días llegarás más alto.", "contra": "Cirugía de hombro con restricción de elevación, o luxación reciente, sin autorización de tu kinesiólogo.", "desc": "Recupera la elevación del hombro de forma asistida: la pared y la toalla quitan peso al brazo."}, "mmii_puente_cama": {"n": "Puente de glúteos en la cama", "cat": "mmii", "t": ["caidas", "sin_carga"], "dose": "2×10, 1 vez al día", "how": ["Acuéstate de espalda en la cama, con las rodillas dobladas y los pies apoyados al ancho de las caderas.", "Aprieta los glúteos y sube la cadera hasta formar una línea recta de los hombros a las rodillas.", "Mantén 2 segundos arriba y baja lento."], "care": "Empuja con los talones. Si la cama es muy blanda y te tambaleas, sube menos. Si sientes el esfuerzo en la espalda baja y no en los glúteos, sube menos. Al terminar, levántate girando de lado.", "contra": "Dolor lumbar agudo que aumenta al levantar la cadera.", "desc": "Fortalece los glúteos sin tener que bajar al suelo, para caminar, subir escaleras y pararte con más seguridad."}, "tob_inv_ev": {"n": "Mover el tobillo hacia adentro y hacia afuera", "cat": "tob", "t": ["tobillo", "caidas", "sin_carga"], "dose": "3×15 por pie, 3 veces por semana", "how": ["Siéntate derecho con la pierna un poco estirada y el talón apoyado en el suelo.", "Sin mover la rodilla, gira el pie hacia adentro, como si quisieras mostrar la planta al otro pie.", "Luego gíralo hacia afuera, levantando el borde de afuera del pie. Hazlo lento y cambia de pie."], "care": "Solo se mueve el tobillo: la rodilla y la pierna quedan quietas. Muévete hasta donde no duela.", "contra": "Esguince de tobillo reciente (primeros días) o fractura sin autorización de tu kinesiólogo.", "desc": "Mantiene el movimiento del tobillo hacia los lados y activa los músculos que lo estabilizan al caminar."}};

function totalXP(){let x=0;for(const d in S.done)for(const m in S.done[d])x+=S.done[d][m];for(const s of S.train.sessions)x+=s.xp||0;return x}
function stageIdx(xp){let i=0;XP_STEPS.forEach((v,k)=>{if(xp>=v)i=k});return i}
function scheduled(m,day){if(m.archived&&m.archived<=day)return false;if(m.created>day)return false;return m.days.includes(pdate(day).getDay())}
function dayMissions(day){return S.missions.filter(m=>scheduled(m,day)).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"))}
function streak(){let n=0,g=0,d=today();const has=x=>S.done[x]&&Object.keys(S.done[x]).length>0,first=S.created||today();if(!has(d))d=addDays(d,-1);for(let k=0;k<1500&&d>=first;k++){if(has(d))n++;else if(dayMissions(d).length===0){}else if(g<1+Math.floor(n/7))g++;else break;d=addDays(d,-1)}return n}
function memberState(){const m=M||{status:"SIN MEMBRESÍA",active:false},exp=m.expires_at?Date.parse(m.expires_at):0,now=Date.now()+skew,active=!!m.active&&exp>now;let status=m.status;if(status==="ACTIVO"&&!active)status="VENCIDO";return{status,active,exp,kind:m.kind||"",days:active?Math.ceil((exp-now)/DAY):0}}

function parqValid(){const t=S.train;return Array.isArray(t.parq)&&t.parq.length===PARQ.length&&(!t.parqAt||t.parqAt>=addDays(today(),-365))}
function parqKey(){const t=S.train;return t.parqTs?String(t.parqTs):(t.parqAt||null)}
function proClear(k){const c=(S.train.clearSrv||{})[k];if(!c)return null;if(k==="parq"&&String(c.key)!==String(parqKey()))return null;return c}
function clrSync(){if(!SH.ok||!S.onboard)return;const c={};for(const x of SH.mine)for(const y of (x.clear||[]))if(!c[y.kind]||String(y.at)>String(c[y.kind].at))c[y.kind]={key:y.key,at:y.at,by:y.by||x.email,note:y.note};const t=S.train,n=Object.keys(c).length?c:null,before=JSON.stringify([t.clearSrv||null,t.cleared||null,t.clearedBy||null,t.seniorOk||null]);t.clearSrv=n;if(t.cleared&&!t.clearedSrc&&!proClear("parq"))t.clearedSelf={at:t.cleared,by:t.clearedBy||null};const cp=proClear("parq"),cs=proClear("senior");t.cleared=cp?String(cp.at).slice(0,10):null;t.clearedBy=cp?cp.by:null;t.clearedSrc=cp?"pro":null;t.seniorOk=cs?{by:cs.by,at:String(cs.at).slice(0,10)}:null;if(before!==JSON.stringify([t.clearSrv||null,t.cleared||null,t.clearedBy||null,t.seniorOk||null]))save()}

function trainReady(){const t=S.train;if(!S.onboard?.health)return"consent";if(!parqValid())return"parq";if(parqFlags().length&&!proClear("parq"))return"paused";if(t.hold)return"hold";if(!t.plan)return"plan";return"ok"}
function strengthAt(stage){const t=S.train;return t.sessions.filter(s=>s.type==="fuerza"&&s.stage===stage&&(s.at||0)>=(t.stageAt||0))}
function sessionToday(){return S.train.sessions.find(s=>s.date===today())}
function walkUp(){const t=S.train;if(!t.plan||t.plan.walk>=30)return 0;const w=t.sessions.filter(s=>s.type==="caminata"&&(s.at||0)>=(t.walkAt||0)),days=[...new Set(w.map(s=>s.date))];return days.length>=NEED&&w.slice(0,NEED).every(s=>s.result==="completa"&&s.borg<=6&&s.pain<=2&&!s.alert)?t.plan.walk+5:0}
const LVMAX=3;
function doseAt(d,l){if(!l)return d;const m=String(d).match(/^(\d+)×(\d+)( s)?(.*)$/);if(!m)return d;return m[1]+"×"+(+m[2]+(m[3]?5:2)*l)+(m[3]||"")+m[4]}
function stepReady(){const t=S.train;if((t.lvl||0)>=LVMAX)return false;const last=t.sessions[0];if(last&&last.pain>=3)return false;const ss=strengthAt(t.stage).filter(s=>(s.at||0)>=(t.lvlAt||0)),days=[...new Set(ss.map(s=>s.date))];return days.length>=2&&ss.slice(0,2).every(s=>s.result==="completa"&&s.borg<=6&&s.pain<=2&&!s.alert)}
function seniorCap(){const t=S.train;return !!t.senior&&!proClear("senior")&&t.stage>=SCAP}
function progression(){const t=S.train,last=t.sessions[0],cur=strengthAt(t.stage),days=[...new Set(cur.map(s=>s.date))],n=days.length;
  if(last&&last.pain>=3)return{state:"hold",n};
  if(t.stage<6&&n>=NEED&&cur.slice(0,NEED).every(s=>s.result==="completa"&&s.borg<=6&&s.pain<=2&&!s.alert))return{state:seniorCap()?"cap":"advance",n};
  return{state:"keep",n}}

/* ===== Avisos con la app cerrada (Web Push) ===== */
let PUSH={state:"off",busy:false};
function b64u(x){const p="=".repeat((4-x.length%4)%4),b=atob((x+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function swReady(){return Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error("sw")),1500))])}
function pushSupported(){return"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window}
function isIOS(){return/iPhone|iPad|iPod/i.test(navigator.userAgent)}
function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true}
async function pushRegister(){const r=await swReady();const{data:key,error}=await sb.rpc("push_public_key");if(error||!key)throw new Error("key");
 let sub=await r.pushManager.getSubscription();
 if(sub){const cur=sub.options&&sub.options.applicationServerKey?btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""):null;if(cur&&cur!==key){await sub.unsubscribe();sub=null}}
 if(!sub){const opt={userVisibleOnly:true,applicationServerKey:b64u(key)};try{sub=await r.pushManager.subscribe(opt)}catch(e1){await new Promise(z=>setTimeout(z,1500));try{const old=await r.pushManager.getSubscription();if(old)await old.unsubscribe()}catch(e3){}sub=await r.pushManager.subscribe(opt)}}
 const j=sub.toJSON();let tz="America/Santiago";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
 const{error:e2}=await sb.rpc("push_subscribe",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_tz:tz});if(e2)throw new Error("save")}
async function pushEnable(){if(PUSH.busy)return;if(!pushSupported())return toast("Este navegador no admite avisos con la app cerrada.");PUSH.busy=true;render();
 try{const perm=await Notification.requestPermission();if(perm!=="granted"){PUSH.state=perm==="denied"?"denied":"off";toast("Sin permiso de notificaciones no puedo avisarte con la app cerrada.")}
  else{await pushRegister();AL.push=true;alSave();PUSH.state="on";PUSH.err="";toast("Listo: te avisaré aunque la app esté cerrada")}}
 catch(e){PUSH.state="off";PUSH.err=((e&&e.name)||"Error")+": "+String((e&&e.message)||e).slice(0,160);toast("No se pudo activar los avisos. El detalle quedó en pantalla.")}
 PUSH.busy=false;render()}
async function pushDisable(){if(!pushSupported())return;try{const r=await swReady(),sub=await r.pushManager.getSubscription();if(sub){if(session)await sb.rpc("push_set_enabled",{p_endpoint:sub.endpoint,p_value:false});await sub.unsubscribe()}}catch(e){}AL.push=false;alSave();PUSH.state="off"}
async function pushSync(){try{if(!pushSupported()){PUSH.state="nosup"}else if(Notification.permission==="denied"){PUSH.state="denied"}else if(AL.push&&session&&Notification.permission==="granted"){await pushRegister();PUSH.state="on"}else PUSH.state="off"}catch(e){PUSH.state="off"}if((tab==="ajustes"||tab==="dia"||tab==="misiones")&&session&&S.onboard&&!view.form)render()}
function vPush(){const st=PUSH.state,needInstall=isIOS()&&!isStandalone();
 return`<div class="card"><h3>Avisos con la app cerrada</h3><p class="mute">Te llega una notificación a la hora de cada misión aunque no tengas Ascenso abierta, con la opción de posponer 10 minutos.</p>
 <p>Estado en este dispositivo: <b>${st==="on"?"activados":st==="denied"?"bloqueados por el teléfono":st==="nosup"?"no disponibles en este navegador":"desactivados"}</b></p>
 ${needInstall?`<div class="banner warn">En iPhone primero instala Ascenso en tu pantalla de inicio (Compartir → Agregar a inicio) y ábrela desde el ícono. Recién ahí se pueden activar.</div>`:st==="nosup"?"":st==="denied"?`<p class="mute small">Para desbloquearlos, abre los ajustes del teléfono → Notificaciones → Ascenso y permítelas.</p>`:`<div class="row">${st==="on"?`<button class="btn" data-act="pushOff">Desactivar en este dispositivo</button>`:`<button class="btn pri" data-act="pushOn" ${PUSH.busy?"disabled":""}>${PUSH.busy?"Activando…":"Activar avisos"}</button>`}</div>`}
 ${PUSH.err?`<p class="small" style="color:var(--bad)">Último intento falló. Prueba apagando el wifi y usando datos móviles. Detalle técnico: ${esc(PUSH.err)}</p>`:""}<p class="mute small">El aviso usa el sonido de notificaciones de tu teléfono; el tono de alarma propio solo suena con la app abierta. Se activa por dispositivo: repítelo en cada teléfono que uses. Si el teléfono está en silencio o en modo «No molestar», no sonará.</p></div>`}
setTimeout(()=>{A.pushOn=()=>pushEnable();A.pushOff=async()=>{await pushDisable();render();toast("Avisos desactivados en este dispositivo")}},0);
</script>
<script>
(function(){
 if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
 var standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
 var mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
 var fromMail=/access_token|type=|error=|code=/.test(location.hash+location.search);
 var skip=false;try{skip=Date.now()-(+localStorage.getItem("ascenso.web")||0)<6048e5}catch(e){}
 if(standalone||!mobile||fromMail||skip)return;
 var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent),dp=null;
 var o=document.createElement("div");o.id="installGate";

 o.innerHTML='<div style="max-width:420px;text-align:center"><img src="icon-192.png" alt="" width="96" height="96" style="border-radius:22px"><h1 style="margin:18px 0 8px;font-size:28px">Instala Ascenso</h1><p style="opacity:.8;line-height:1.5;margin:0 0 20px">Ascenso funciona como aplicación en tu teléfono. Instálala y ábrela desde tu pantalla de inicio.</p><div id="igSteps" style="text-align:left;background:#141a26;border:1px solid #232b3b;border-radius:14px;padding:16px;line-height:1.6;font-size:16px"></div><button id="igBtn" style="display:none;margin-top:18px;width:100%;padding:16px;border:0;border-radius:12px;background:#ff9a3c;color:#16110a;font-size:18px;font-weight:700">Instalar aplicación</button><button id="igSkip" style="margin-top:14px;width:100%;min-height:48px;padding:12px;border:1px solid #6b7896;border-radius:12px;background:none;color:#e8ecf4;font-size:16px">Continuar sin instalar</button></div>';
 function mount(){document.body.appendChild(o);

  if(dp)bt.style.display="block";
  bt.onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;bt.style.display="none"})};
  o.querySelector("#igSkip").onclick=function(e){e.preventDefault();try{localStorage.setItem("ascenso.web",String(Date.now()))}catch(x){}o.remove()};}
 window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;var b=document.getElementById("igBtn");if(b)b.style.display="block"});
 window.addEventListener("appinstalled",function(){var s=document.getElementById("igSteps");if(s)s.innerHTML="<b>Listo.</b> Abre Ascenso desde el ícono en tu pantalla de inicio."});

<script>
/* Ojo para mostrar u ocultar la contraseña en todos los campos de clave */
(function(){
  var OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SHUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function set(b,inp,show){inp.type=show?'text':'password';b.setAttribute('aria-pressed',show?'true':'false');b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.title=show?'Ocultar contraseña':'Mostrar contraseña';b.innerHTML=show?SHUT:OPEN}
  function enhance(root){
    (root.querySelectorAll?root:document).querySelectorAll('input[type=password]:not([data-pw])').forEach(function(inp){
      inp.setAttribute('data-pw','1');
      inp.setAttribute('autocapitalize','off');inp.setAttribute('spellcheck','false');
      var w=document.createElement('span');w.className='pw-wrap';
      inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
      var b=document.createElement('button');b.type='button';b.className='pw-eye';
      set(b,inp,false);
      b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var pos=inp.selectionStart;set(b,inp,inp.type==='password');inp.focus();try{inp.setSelectionRange(pos,pos)}catch(_){}});
      w.appendChild(b);
    });
  }
  // al enviar un formulario, la clave vuelve a ocultarse
  document.addEventListener('submit',function(e){e.target.querySelectorAll&&e.target.querySelectorAll('.pw-eye[aria-pressed="true"]').forEach(function(b){var i=b.parentNode.querySelector('input');if(i)set(b,i,false)})},true);
  new MutationObserver(function(){enhance(document)}).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState!=='loading')enhance(document);else document.addEventListener('DOMContentLoaded',function(){enhance(document)});
})();
</script>
<script>
/* Al volver desde Mercado Pago: revisa la membresía hasta que el pago aparezca aprobado */
function pagoRetorno(){
  var q=new URLSearchParams(location.search),st=q.get("pago");if(!st)return;
  try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
  if(st==="error"){toast("El pago no se completó. Puedes intentarlo de nuevo desde Planes.");return}
  if(st==="pendiente"){toast("Tu pago quedó pendiente. Cuando Mercado Pago lo apruebe, tu acceso se activa solo.")}
  else toast("Pago recibido. Estamos activando tu acceso…");
  var antes=(M&&M.expires_at)||"",n=0;
  (function revisar(){n++;refreshMember().then(function(){
    if(M&&M.expires_at&&M.expires_at!==antes&&M.active){render();toast("Listo: tu plan quedó activo por "+CFG.periodDays+" días más.");return}
    if(n<24)setTimeout(revisar,5000);else{render();toast("Tu pago aún se está procesando. Si en 15 minutos no se activa, escribe a kinerecupera@gmail.com.")}
  })})();
}
if(typeof session!=="undefined"&&session)pagoRetorno();
