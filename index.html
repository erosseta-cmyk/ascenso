/* Layout: una columna de trabajo, barra de pestañas deslizable arriba, tarjetas solo para lo que se opera. Tema oscuro único, heredado de la app original. */
:root{

}
*{box-sizing:border-box}
html.big body{zoom:1.2}

.brand b{font-family:var(--display);font-style:italic;font-weight:700;font-size:28px;letter-spacing:.5px;line-height:1}

.who{text-align:right;font-size:14px;color:var(--mute)}
.who b{display:block;color:var(--fg);font-size:15px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);padding-right:28px}
nav.tabs button{background:none;border:0;color:var(--mute);font:500 16px var(--body);padding:13px 12px;min-height:48px;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}

h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
h3{font-size:16px;margin:0;font-weight:600}

p{margin:0}
.mute{color:var(--mute)} .small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

.stack{display:flex;flex-direction:column;gap:14px}

:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;width:100%;min-width:0;min-height:46px}

.banner{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--panel2);font-size:15px}
.simple{display:flex;flex-direction:column;gap:14px}.sgreet{font-size:28px;font-weight:700;margin:0;line-height:1.15}.sdate{margin:2px 0 0;color:var(--mute);font-size:17px}
.shelp{margin:0;padding:10px 12px;border-radius:12px;background:var(--panel2);font-size:16px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.scard h2{margin:0 0 4px;font-size:22px}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--fg);text-align:left;margin-top:10px;font:inherit;font-size:18px;cursor:pointer}
.srow img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none}.srow b{display:block}.srow small{display:block;color:var(--mute);font-size:15px;margin-top:2px}

.s10{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}.s10 button{min-height:52px;font:inherit;font-size:22px;font-weight:800;border-radius:12px;border:3px solid transparent;color:#111;cursor:pointer}.s10 button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 3px var(--accent)}
.sximg{width:100%;max-width:420px;margin:0 auto;display:block;border-radius:16px;aspect-ratio:1;object-fit:cover;background:var(--panel2)}
.sdose{font-size:30px;font-weight:800;margin:4px 0;color:var(--accent)}.sxname{font-size:26px;margin:8px 0 0;line-height:1.2}
.fb3{display:grid;gap:12px;margin-top:12px}.fb3 button{min-height:72px;font:inherit;font-size:24px;font-weight:800;border-radius:16px;border:none;color:#111;cursor:pointer}
.sbtn{display:block;width:100%;min-height:56px;font-size:19px;margin:0}
.renew{border-width:2px}.renew.warn{border-color:var(--warn)}.renew.bad{border-color:var(--bad)}.renew h2{font-size:24px}.admchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.admu{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:8px}.admu .em{word-break:break-all;font-weight:600}
.banner.warn{border-color:var(--warn)} .banner.bad{border-color:var(--bad)} .banner.ok{border-color:var(--ok)}
.mission{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.mission.done{border-color:var(--ok)}
.mission .t{font-variant-numeric:tabular-nums;font-weight:600;width:52px;flex:none;color:var(--cool)}
.mission .n{flex:1;min-width:0}
.mission .n b{display:block;overflow-wrap:anywhere}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--line2);background:none;color:var(--fg);font-size:18px;cursor:pointer;flex:none}
.mission.done .check{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stat b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:14px;color:var(--mute)}
.stage{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.stage.cur{border-color:var(--accent)} .stage.lock .emblem{opacity:.6}
.emblem{aspect-ratio:1;border-radius:10px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;max-width:100%}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}

const LIB={"ves_x1h": {"n": "Mirada fija con giro de cabeza (lado a lado)", "cat": "ves", "t": ["vert"], "dose": "3×30 s, 3 veces al día", "how": ["Siéntate y sostén una tarjeta con una letra a la distancia de tu brazo, a la altura de los ojos.", "Mira la letra y gira la cabeza a un lado y al otro, sin dejar de verla nítida.", "Parte lento. Si la letra se ve borrosa, gira más despacio."], "care": "Es normal sentir un mareo leve que pasa en pocos minutos. Si dura más de 15 minutos, si vomitas o si aparece un síntoma nuevo, detente y avísale a tu kinesiólogo.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos.", "desc": "Entrena el reflejo que mantiene la vista estable cuando giras la cabeza, para que el mareo al moverte vaya disminuyendo."}, "ves_x1v": {"n": "Mirada fija con movimiento de cabeza (arriba y abajo)", "cat": "ves", "t": ["vert"], "dose": "3×30 s, 3 veces al día", "how": ["Siéntate y sostén una tarjeta con una letra a la distancia de tu brazo, a la altura de los ojos.", "Mira la letra y mueve la cabeza arriba y abajo, como diciendo que sí, sin dejar de verla nítida.", "Parte lento y aumenta la velocidad solo si la letra sigue nítida."], "care": "Es normal sentir un mareo leve que pasa en pocos minutos. Si dura más de 15 minutos, si vomitas o si aparece un síntoma nuevo, detente y avísale a tu kinesiólogo.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos.", "desc": "Lo mismo que el anterior, pero con el movimiento de \"sí\": ayuda a ver nítido al caminar, subir escaleras o agacharte."}, "ves_dos_puntos": {"n": "Mirada entre dos puntos", "cat": "ves", "t": ["vert"], "dose": "2×10, 2 veces al día", "how": ["Pega dos tarjetas en la pared a la altura de los ojos, separadas unos 30 cm, y siéntate a un metro.", "Mira una tarjeta con la cabeza de frente. Lleva primero los ojos a la otra tarjeta y después gira la cabeza hacia ella.", "Vuelve igual hacia la primera: primero los ojos, después la cabeza."], "care": "Hazlo sentado hasta que te lo indique tu kinesiólogo. Si el mareo dura más de 15 minutos, detente y avísale.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos.", "desc": "Coordina los ojos con la cabeza para que puedas mirar hacia un lado y girar sin marearte."}, "ves_seguimiento": {"n": "Seguimiento con la mirada", "cat": "ves", "t": ["vert"], "dose": "2×10, 2 veces al día", "how": ["Siéntate con la espalda apoyada y estira un brazo con el pulgar hacia arriba.", "Mueve el pulgar lentamente de lado a lado y síguelo solo con los ojos, sin mover la cabeza.", "Repite de arriba hacia abajo."], "care": "Si sientes mareo, baja la velocidad. Detente si aparece visión doble o dolor de cabeza intenso.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos. También visión doble o pérdida de visión nueva.", "desc": "Entrena el control de los ojos para seguir objetos que se mueven sin que aparezca mareo."}, "ves_giros_caminando": {"n": "Caminar girando la cabeza", "cat": "ves", "t": ["vert"], "dose": "2 pasadas de 5 metros, 2 veces al día", "how": ["Camina en línea recta por un pasillo despejado, junto a una pared o con alguien al lado.", "Cada dos o tres pasos gira la cabeza hacia un lado y hacia el otro, sin dejar de caminar.", "Al terminar el pasillo, detente, date vuelta despacio y repite."], "care": "Hazlo siempre con un apoyo al alcance o acompañado. Si te desequilibras, detente y apóyate en la pared.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos. No hacerlo sin alguien cerca si ya te has caído.", "desc": "Lleva el entrenamiento del mareo a la vida real: poder caminar y mirar a los lados, como en la calle o en el supermercado."}, "ves_brandt_daroff": {"n": "Ejercicio de Brandt-Daroff", "cat": "ves", "t": ["vert"], "dose": "5 por lado, 3 veces al día", "how": ["Siéntate en el centro del borde de la cama.", "Gira la cabeza 45° hacia un lado y acuéstate rápido sobre el lado contrario, con la cabeza mirando hacia arriba. Quédate 30 segundos o hasta que pase el mareo.", "Siéntate de nuevo, espera 30 segundos y repite hacia el otro lado."], "care": "Solo si tu médico o kinesiólogo confirmó que tienes vértigo posicional. Hazlo en la cama, nunca de pie, y no te levantes hasta que el mareo haya pasado del todo.", "contra": "Sin diagnóstico confirmado de vértigo posicional; problemas o cirugía de columna cervical; enfermedad de las arterias del cuello; desprendimiento de retina reciente; o mareo con síntomas neurológicos (habla traposa, visión doble, debilidad).", "desc": "Ayuda a que el vértigo posicional (el que aparece al acostarte o darte vuelta en la cama) se vuelva menos intenso."}, "eq_pies_juntos": {"n": "De pie con los pies juntos", "cat": "eq", "t": ["caidas"], "dose": "3×30 s, 1 vez al día", "how": ["Párate frente a un mesón firme, con las manos sobre él.", "Junta los pies y suelta las manos, dejándolas a un par de centímetros del mesón.", "Mantén la posición mirando un punto fijo al frente."], "care": "Ten siempre el mesón al alcance. Cuando lo hagas fácil, tu kinesiólogo puede indicarte cerrar los ojos.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Es el primer nivel del equilibrio de pie: base para caminar con más seguridad y prevenir caídas."}, "eq_semitandem": {"n": "De pie con un pie medio adelante", "cat": "eq", "t": ["caidas"], "dose": "3×30 s por lado, 1 vez al día", "how": ["Párate frente a un mesón firme, con las manos sobre él.", "Pon un pie adelante, con el talón a la altura de la mitad del otro pie.", "Suelta las manos y mantén la posición. Cambia el pie de adelante."], "care": "Ten siempre el mesón al alcance. Si te balanceas mucho, vuelve a apoyar las manos.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Achica tu base de apoyo para que el equilibrio trabaje más; es el paso siguiente a los pies juntos."}, "eq_tandem": {"n": "De pie con un pie delante del otro", "cat": "eq", "t": ["caidas"], "dose": "3×30 s por lado, 1 vez al día", "how": ["Párate frente a un mesón firme, con las manos sobre él.", "Pon un pie justo delante del otro, con el talón tocando la punta del pie de atrás.", "Suelta las manos y mantén la posición. Cambia el pie de adelante."], "care": "Ten siempre el mesón al alcance. Si no logras 10 segundos, quédate en el ejercicio anterior.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Equilibrio con base muy angosta, como al caminar por una vereda estrecha: un nivel más exigente para prevenir caídas."}, "eq_un_pie": {"n": "De pie en un pie", "cat": "eq", "t": ["caidas", "tobillo"], "dose": "3×10 s por lado, 1 vez al día", "how": ["Párate frente a un mesón firme, con las manos sobre él.", "Levanta un pie del suelo, doblando la rodilla.", "Suelta las manos si puedes y mantén la posición. Cambia de pierna."], "care": "Ten siempre el mesón al alcance. No te alejes de él aunque el ejercicio te resulte fácil.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance. Esguince o lesión de la pierna de apoyo sin alta para cargar.", "desc": "Entrena el equilibrio en una pierna, que necesitas en cada paso, al subir escaleras o al ponerte los pantalones."}, "eq_puntas": {"n": "Pararse en puntas con apoyo", "cat": "eq", "t": ["caidas"], "dose": "2×10, 3 veces por semana", "how": ["Párate frente a un mesón firme, con las manos apoyadas.", "Sube en puntas de pies lo más alto que puedas.", "Baja lento hasta apoyar los talones."], "care": "Apóyate en el mesón todo lo que necesites. Detente si sientes un calambre o dolor en la pantorrilla.", "contra": "Dolor agudo del tendón de Aquiles o de la planta del pie; mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Fortalece las pantorrillas, que te impulsan al caminar y te ayudan a recuperar el equilibrio cuando te tambaleas."}, "eq_talones": {"n": "Pararse en talones", "cat": "eq", "t": ["caidas", "tobillo"], "dose": "2×10, 3 veces por semana", "how": ["Párate frente a un mesón firme, con las manos apoyadas.", "Levanta las puntas de los pies, quedando apoyado en los talones.", "Baja lento hasta apoyar todo el pie."], "care": "Apóyate en el mesón todo lo que necesites. No eches la cadera hacia atrás.", "contra": "Dolor agudo en el talón o en la parte delantera de la pierna; mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Fortalece los músculos que levantan la punta del pie, para no tropezar ni arrastrar los pies."}, "eq_flexion_rodillas": {"n": "Flexión de rodillas afirmado", "cat": "eq", "t": ["caidas"], "dose": "2×10, 3 veces por semana", "how": ["Párate frente a un mesón firme, con los pies al ancho de las caderas y las manos apoyadas.", "Dobla las rodillas como para sentarte, solo hasta la mitad, sin despegar los talones.", "Vuelve a estirarlas por completo."], "care": "Las rodillas apuntan hacia los pies. Si te duelen, baja menos.", "contra": "Dolor de rodilla que aumenta al doblarla o cirugía reciente de rodilla o cadera con restricción de movimiento.", "desc": "Fortalece los muslos de forma segura, con apoyo, para pararte, sentarte y subir escaleras con más facilidad."}, "eq_lateral": {"n": "Caminar de lado", "cat": "eq", "t": ["caidas"], "dose": "4 pasadas de 10 pasos, 1 vez al día", "how": ["Párate de frente a un mesón largo, con las manos sobre él.", "Da 10 pasos hacia un lado, separando y juntando los pies, sin cruzarlos.", "Vuelve hacia el otro lado."], "care": "Usa zapatos firmes y despeja el camino. Mantén las manos cerca del mesón.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance. Cirugía de cadera con restricción de abrir la pierna.", "desc": "Entrena los pasos hacia el lado, los que usas para esquivar algo o reaccionar a un empujón, y fortalece la cadera."}, "eq_atras": {"n": "Caminar hacia atrás", "cat": "eq", "t": ["caidas"], "dose": "4 pasadas de 10 pasos, 1 vez al día", "how": ["Ponte junto a un mesón largo o una pared, con una mano apoyada.", "Camina 10 pasos hacia atrás, apoyando primero la punta del pie.", "Date vuelta despacio y repite."], "care": "Revisa antes que no haya nada atrás. Hazlo acompañado si tienes miedo de caerte.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance. Miedo a caer muy alto sin alguien que te acompañe.", "desc": "Entrena un movimiento que casi no practicamos y que ayuda a reaccionar si pierdes el equilibrio hacia atrás."}, "eq_tandem_marcha": {"n": "Caminar en línea", "cat": "eq", "t": ["caidas"], "dose": "4 pasadas de 10 pasos, 1 vez al día", "how": ["Ponte junto a un mesón largo o una pared, con una mano cerca.", "Camina poniendo el talón justo delante de la punta del otro pie, como sobre una cuerda.", "Mira al frente, no a los pies."], "care": "Hazlo siempre con un apoyo al alcance. Si pierdes el equilibrio, apóyate y vuelve a partir.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Desafía el equilibrio caminando con una base angosta; mejora la estabilidad al andar."}, "eq_alcances": {"n": "Alcances de pie", "cat": "eq", "t": ["caidas"], "dose": "2×10, 1 vez al día", "how": ["Párate junto a un mesón firme, con una mano apoyada.", "Estira el otro brazo hacia adelante, como para alcanzar algo, inclinando el cuerpo sin mover los pies.", "Vuelve al centro y repite hacia el lado."], "care": "Alcanza solo hasta donde te sientas seguro. No levantes los talones.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Te enseña a inclinarte para alcanzar cosas sin perder el equilibrio, como al sacar algo de un mueble."}, "eq_escalon": {"n": "Subir y bajar un escalón", "cat": "eq", "t": ["caidas"], "dose": "2×10 por pierna, 3 veces por semana", "how": ["Ponte frente al primer escalón de una escalera, afirmado de la baranda.", "Para subir, parte con la pierna buena y luego sube la otra.", "Para bajar, parte con la pierna débil o adolorida y luego baja la buena. Si las dos están bien, alterna la pierna que parte."], "care": "Usa siempre la baranda. Si te duele la rodilla, avísale a tu kinesiólogo.", "contra": "Dolor de rodilla al subir o bajar escaleras sin evaluación, o no tener baranda.", "desc": "Practica subir y bajar escaleras de forma segura y fortalece las piernas para hacerlo."}, "tob_abecedario": {"n": "Abecedario con el tobillo", "cat": "tob", "t": ["tobillo"], "dose": "1 abecedario completo, 2 veces al día", "how": ["Siéntate con la pierna estirada y el talón apoyado, o con la pierna colgando.", "Dibuja en el aire las letras del abecedario con la punta del pie.", "Mueve solo el tobillo, no la rodilla."], "care": "Puede tirar un poco; no debería doler. Si aumenta la hinchazón, avísale a tu kinesiólogo.", "contra": "Fractura o cirugía de tobillo con indicación de inmovilizarlo.", "desc": "Recupera el movimiento del tobillo en todas las direcciones después de un esguince o de estar inmovilizado."}, "tob_bombeo": {"n": "Bombeo de tobillo", "cat": "tob", "t": ["tobillo", "postop", "sin_carga"], "dose": "3×15, 3 veces al día", "how": ["Acuéstate o siéntate con la pierna estirada y el pie en alto si está hinchado.", "Lleva la punta del pie hacia ti lo más que puedas.", "Luego estírala hacia abajo, como apretando un acelerador."], "care": "Muévelo hasta donde no duela. Sirve también para bajar la hinchazón.", "contra": "Sospecha de coágulo (pantorrilla hinchada, roja, caliente y dolorosa): consulta de inmediato antes de hacer ejercicio.", "desc": "Mueve la sangre de la pierna para bajar la hinchazón y prevenir coágulos cuando estás en cama o con poca actividad."}, "tob_toalla": {"n": "Recoger la toalla con los dedos", "cat": "tob", "t": ["tobillo"], "dose": "3×10, 1 vez al día", "how": ["Siéntate con el pie descalzo sobre una toalla extendida en el suelo.", "Arruga la toalla hacia ti usando solo los dedos del pie.", "Estírala de nuevo y repite."], "care": "Mantén el talón apoyado. Detente si se acalambra la planta del pie.", "contra": "Herida o cirugía reciente del pie sin cicatrizar.", "desc": "Fortalece los músculos de la planta del pie, que dan estabilidad al tobillo y al arco."}, "tob_banda": {"n": "Banda elástica en cuatro direcciones", "cat": "tob", "t": ["tobillo"], "dose": "2×15 por dirección, día por medio", "how": ["Siéntate con la pierna estirada y pasa una banda elástica por la planta del pie, con un extremo en cada mano.", "Empuja el pie hacia abajo contra la banda, como apretando un acelerador, y vuelve lento.", "Para las otras direcciones, amarra la banda a la pata de un mueble firme y lleva el pie hacia ti, hacia adentro y hacia afuera, siempre contra la banda."], "care": "Mueve solo el tobillo y de forma lenta. Usa la banda que te indicó tu kinesiólogo.", "contra": "Esguince agudo en los primeros días, fractura o cirugía de tobillo sin alta para fortalecer.", "desc": "Fortalece los músculos que sostienen el tobillo en todas las direcciones para evitar que se vuelva a doblar."}, "tob_puntas_una": {"n": "Pararse en puntas en una pierna", "cat": "tob", "t": ["tobillo", "aquiles"], "dose": "3×10, día por medio", "how": ["Párate frente a un mesón firme, con las manos apoyadas.", "Levanta un pie y sube en puntas con el otro lo más alto que puedas.", "Baja lento hasta apoyar el talón. Cambia de pierna."], "care": "Usa el mesón solo para el equilibrio. Si no logras subir bien, vuelve a hacerlo con las dos piernas.", "contra": "Dolor agudo del tendón de Aquiles o esguince reciente sin alta para cargar en una pierna.", "desc": "Fortalece la pantorrilla de cada pierna por separado, necesaria para caminar, correr y saltar sin dolor."}, "tob_un_pie_cojin": {"n": "Equilibrio en un pie sobre un cojín", "cat": "tob", "t": ["tobillo"], "dose": "3×30 s por lado, 1 vez al día", "how": ["Pon un cojín firme en el suelo junto a un mesón.", "Párate con un pie sobre el cojín y la rodilla levemente doblada.", "Mantén la posición con las manos cerca del mesón. Cambia de pierna."], "care": "Ten siempre el mesón al alcance. Si no logras 10 segundos, hazlo en el suelo firme.", "contra": "Esguince reciente sin alta para cargar en una pierna, o mal equilibrio sin apoyo al alcance.", "desc": "Entrena los reflejos del tobillo sobre una superficie inestable, clave para no volver a doblarlo."}, "tob_rodilla_pared": {"n": "Rodilla a la pared", "cat": "tob", "t": ["tobillo", "aquiles"], "dose": "3×10, 2 veces al día", "how": ["Párate frente a una pared con un pie adelante, a unos 10 cm de ella.", "Lleva la rodilla de adelante hacia la pared sin despegar el talón del suelo.", "Vuelve atrás. Si tocas fácil, aleja un poco el pie."], "care": "El talón no se levanta. Debe sentirse un estiramiento, no un dolor punzante adelante del tobillo.", "contra": "Fractura de tobillo sin consolidar o dolor agudo en la parte delantera del tobillo.", "desc": "Mejora cuánto se dobla el tobillo hacia adelante, necesario para bajar escaleras y agacharte."}, "tob_estrella": {"n": "Alcances en estrella", "cat": "tob", "t": ["tobillo"], "dose": "2×5 por dirección, 1 vez al día", "how": ["Párate en una pierna junto a un mesón, con la rodilla levemente doblada.", "Con la punta del otro pie toca el suelo lo más lejos que puedas: adelante, al lado y atrás.", "Vuelve al centro entre cada toque. Cambia de pierna."], "care": "Es un ejercicio avanzado. Hazlo solo cuando tu kinesiólogo lo indique y con el mesón al alcance.", "contra": "Esguince o lesión reciente sin alta, o no lograr 30 segundos en un pie con estabilidad.", "desc": "Equilibrio avanzado en una pierna: combina fuerza, control y alcance para volver al deporte o a terrenos irregulares."}, "atx_dedo_nariz": {"n": "Dedo a la nariz", "cat": "coord", "t": ["ataxia"], "dose": "2×10 por brazo, 1 vez al día", "how": ["Siéntate con la espalda apoyada y estira un brazo hacia el lado.", "Lleva lentamente la punta del dedo índice a tu nariz.", "Vuelve a estirar el brazo. Hazlo despacio y con precisión, no rápido."], "care": "Si te cuesta, hazlo primero con los ojos abiertos y mirando tu dedo.", "contra": "Dolor o lesión de hombro que impida estirar el brazo.", "desc": "Mejora la precisión y el control de los movimientos del brazo cuando la coordinación está alterada."}, "atx_talon_rodilla": {"n": "Talón a la rodilla", "cat": "coord", "t": ["ataxia"], "dose": "2×10 por pierna, 1 vez al día", "how": ["Acuéstate de espalda con las piernas estiradas.", "Lleva lentamente el talón de una pierna hasta la rodilla de la otra.", "Deslízalo por la canilla hasta el tobillo y vuelve a estirar la pierna."], "care": "Hazlo lento, mirando el movimiento. Para descansar, deja ambas piernas apoyadas.", "contra": "Cirugía reciente de cadera o rodilla con restricción de movimiento.", "desc": "Mejora la precisión y el control de los movimientos de la pierna cuando la coordinación está alterada."}, "atx_frenkel": {"n": "Pie a las marcas del suelo", "cat": "coord", "t": ["ataxia"], "dose": "2×10 por pierna, 1 vez al día", "how": ["Siéntate en una silla firme y pega en el suelo tres marcas con cinta: adelante, al lado y atrás de cada pie.", "Lleva un pie hasta una marca, apóyalo justo encima y vuelve al centro.", "Sigue con las otras marcas y luego cambia de pierna."], "care": "Hazlo lento y mirando las marcas. La precisión importa más que la velocidad.", "contra": "No poder sentarte de forma estable en una silla sin respaldo.", "desc": "Entrena a poner el pie justo donde quieres, para caminar con pasos más precisos y seguros."}, "atx_alcances_sentado": {"n": "Alcances sentado sin respaldo", "cat": "coord", "t": ["ataxia"], "dose": "2×10, 1 vez al día", "how": ["Siéntate en el borde de una cama o silla firme, sin apoyar la espalda y con los pies apoyados.", "Estira un brazo hacia adelante o hacia el lado para tocar un objeto o la mano de alguien.", "Vuelve al centro con la espalda recta y repite hacia otro lado."], "care": "Ten alguien cerca o una superficie a los lados. Alcanza solo hasta donde no pierdas el equilibrio.", "contra": "No poder mantenerte sentado sin apoyo; hazlo solo con alguien al lado.", "desc": "Mejora el control del tronco sentado, base para pararte, caminar y hacer tus actividades sin perder el equilibrio."}, "atx_cuadrupedia": {"n": "Cuadrupedia con brazo y pierna", "cat": "lum", "t": ["ataxia", "lumbar", "core", "acond"], "dose": "2×8 por lado, 1 vez al día", "how": ["Ponte en cuatro apoyos sobre una colchoneta, manos bajo los hombros y rodillas bajo las caderas.", "Estira lentamente un brazo hacia adelante y la pierna contraria hacia atrás.", "Mantén 3 segundos sin que la cadera se ladee y vuelve. Cambia de lado."], "care": "Si te desequilibras, estira solo el brazo o solo la pierna. Detente si te duele la espalda.", "contra": "Dolor de muñeca o de rodilla que impida apoyarse, o dolor lumbar agudo.", "desc": "Entrena la estabilidad del tronco y la coordinación entre brazos y piernas, y protege la espalda baja."}, "atx_marcha_marcas": {"n": "Caminar pisando marcas", "cat": "coord", "t": ["ataxia"], "dose": "4 pasadas, 1 vez al día", "how": ["Pega en el suelo de un pasillo marcas con cinta, separadas a la distancia de un paso.", "Camina pisando cada marca, despacio y mirando dónde pones el pie.", "Al terminar, date vuelta despacio y repite."], "care": "Hazlo junto a una pared o con alguien al lado. Usa zapatos firmes.", "contra": "Caídas frecuentes recientes sin evaluación o no tener a alguien al lado.", "desc": "Ayuda a caminar con pasos más regulares y precisos, usando la vista para guiar los pies."}, "atx_marcha_lugar": {"n": "Marcha en el lugar afirmado", "cat": "coord", "t": ["ataxia"], "dose": "3×30 s, 1 vez al día", "how": ["Párate frente a un mesón firme, con las manos apoyadas.", "Levanta una rodilla y después la otra, como marchando en el lugar.", "Lleva un ritmo parejo y apoya bien cada pie."], "care": "Usa el mesón todo lo que necesites. Si te mareas o te cansas, siéntate.", "contra": "Mareo al ponerse de pie sin evaluar o no poder estar de pie con apoyo.", "desc": "Entrena el ritmo y la coordinación de la marcha con apoyo, antes de caminar en espacios abiertos."}, "aq_isometrico": {"n": "Sostener en puntas", "cat": "tob", "t": ["aquiles"], "dose": "5×45 s, 1 o 2 veces al día", "how": ["Párate frente a un mesón, con las manos apoyadas solo para el equilibrio.", "Sube en puntas de pies hasta la mitad de la altura que alcanzas.", "Mantén la posición sin moverte el tiempo indicado y baja lento."], "care": "Puede molestar un poco mientras lo haces. Si a la mañana siguiente el tendón está más adolorido o rígido que de costumbre, avísale a tu kinesiólogo antes de seguir.", "contra": "Rotura del tendón de Aquiles (o sospecha: dolor súbito \"como una patada\" en el talón) sin tratamiento.", "desc": "Calma el dolor del tendón de Aquiles y empieza a cargarlo de forma segura, sin movimiento."}, "aq_excentrico_recto": {"n": "Bajar el talón desde un escalón, rodilla estirada", "cat": "tob", "t": ["aquiles"], "dose": "3×15, 2 veces al día", "how": ["Párate en el borde de un escalón con la parte delantera de los pies, afirmado de la baranda.", "Sube en puntas con las dos piernas.", "Pasa el peso a la pierna afectada y baja el talón lentamente, en 3 segundos, con la rodilla estirada. Vuelve a subir con las dos."], "care": "Puede molestar un poco mientras lo haces. Si el dolor es en el talón, donde se inserta el tendón, no bajes más allá del nivel del escalón. Si a la mañana siguiente estás peor, avísale a tu kinesiólogo.", "contra": "Rotura o sospecha de rotura del tendón; dolor que no te deja caminar; cirugía del tendón sin alta para carga.", "desc": "Fortalece el tendón de Aquiles y la pantorrilla con un descenso lento, uno de los ejercicios con mejor respaldo para el dolor del tendón."}, "aq_excentrico_flexo": {"n": "Bajar el talón desde un escalón, rodilla doblada", "cat": "tob", "t": ["aquiles"], "dose": "3×15, 2 veces al día", "how": ["Párate en el borde de un escalón con la parte delantera de los pies, afirmado de la baranda.", "Sube en puntas con las dos piernas y dobla un poco las rodillas.", "Pasa el peso a la pierna afectada y baja el talón lentamente, en 3 segundos, manteniendo la rodilla doblada. Vuelve a subir con las dos."], "care": "Puede molestar un poco mientras lo haces. Si el dolor es en el talón, no bajes más allá del nivel del escalón. Si a la mañana siguiente estás peor, avísale a tu kinesiólogo.", "contra": "Rotura o sospecha de rotura del tendón; dolor que no te deja caminar; cirugía del tendón sin alta para carga.", "desc": "Igual al anterior, pero con la rodilla doblada para trabajar el músculo profundo de la pantorrilla (sóleo)."}, "aq_sentado": {"n": "Pararse en puntas sentado", "cat": "tob", "t": ["aquiles"], "dose": "3×15, día por medio", "how": ["Siéntate en una silla con los pies apoyados y las rodillas dobladas en ángulo recto.", "Pon un peso sobre los muslos, cerca de las rodillas: una mochila o bolsas con agua.", "Levanta los talones lo más alto que puedas y bájalos lento."], "care": "Usa el peso que te indicó tu kinesiólogo. Detente si aparece un dolor punzante.", "contra": "Rotura o sospecha de rotura del tendón de Aquiles sin tratamiento.", "desc": "Fortalece el sóleo, el músculo profundo de la pantorrilla, que soporta mucha carga al caminar y correr."}, "aq_elongacion": {"n": "Elongación de pantorrilla en la pared", "cat": "tob", "t": ["aquiles"], "dose": "3×30 s por lado, 2 veces al día", "how": ["Párate frente a una pared con las manos apoyadas y un pie atrás.", "Con el talón de atrás apoyado y la rodilla estirada, lleva la cadera hacia la pared hasta sentir que tira la pantorrilla.", "Mantén sin rebotes. Repite con la rodilla de atrás un poco doblada."], "care": "Debe sentirse un estiramiento suave, no dolor. Si el dolor es en el talón, consúltalo antes con tu kinesiólogo.", "contra": "Rotura o cirugía reciente del tendón de Aquiles sin autorización para elongar.", "desc": "Mejora la flexibilidad de la pantorrilla y disminuye la tensión sobre el tendón de Aquiles."}, "aq_saltitos": {"n": "Saltitos en el lugar", "cat": "tob", "t": ["aquiles"], "dose": "3×20, 2 o 3 veces por semana", "how": ["Párate con los pies al ancho de las caderas, cerca de un mesón.", "Da saltitos cortos y rápidos en puntas de pies, apenas despegando del suelo.", "Aterriza suave, en puntas, sin apoyar los talones de golpe."], "care": "Es una etapa avanzada. Hazlo solo cuando tu kinesiólogo lo indique, y nunca si el tendón duele al caminar.", "contra": "Dolor del tendón o del tobillo al caminar, esguince o lesión reciente sin alta para saltar, osteoporosis avanzada o prótesis de cadera o rodilla.", "desc": "Prepara el tendón para volver a correr y saltar, entrenando su capacidad de rebote."}, "otr_respiracion": {"n": "Respiración diafragmática", "cat": "tor", "t": ["postop", "lumbar", "sin_carga"], "dose": "3×10 respiraciones, 3 veces al día", "how": ["Acuéstate o siéntate cómodo, con una mano en el pecho y otra en el abdomen.", "Toma aire por la nariz, lento, inflando el abdomen sin mover casi el pecho.", "Bota el aire por la boca, despacio, como apagando una vela lejana."], "care": "Si te mareas, respira más lento y descansa entre series.", "contra": "Ninguna habitual. Si tienes una enfermedad pulmonar, sigue la técnica que te enseñó tu kinesiólogo.", "desc": "Mejora la ventilación de los pulmones, ayuda a relajarte y es base para activar el abdomen profundo."}, "otr_retraccion_cervical": {"n": "Retracción del mentón", "cat": "cerv", "t": ["cervical"], "dose": "2×10, 3 veces al día", "how": ["Siéntate derecho, mirando al frente.", "Lleva el mentón hacia atrás, como haciendo papada, sin bajar ni subir la cabeza.", "Mantén 3 segundos y relaja."], "care": "Es un movimiento corto. Si aparece dolor u hormigueo que baja al brazo, detente y avísale a tu kinesiólogo.", "contra": "Dolor de cuello después de un golpe o caída reciente sin evaluación, hormigueo o debilidad que aumenta en brazos o piernas, o mareo y visión doble al mover el cuello.", "desc": "Corrige la postura de la cabeza adelantada y alivia la tensión del cuello."}, "otr_pendular": {"n": "Péndulo de hombro", "cat": "mmss", "t": ["hombro", "postop"], "dose": "3×30 s, 3 veces al día", "how": ["Apoya la mano sana en una mesa e inclina el tronco hacia adelante.", "Deja colgar relajado el brazo afectado.", "Balancea el cuerpo suavemente para que el brazo se mueva en pequeños círculos, sin usar la fuerza del hombro."], "care": "El brazo cuelga suelto; el movimiento viene del cuerpo. No debería doler.", "contra": "Cirugía de hombro con indicación de no mover el brazo, o fractura de hombro sin autorización.", "desc": "Mueve el hombro suavemente, sin esfuerzo, para disminuir el dolor y la rigidez después de una lesión o cirugía."}, "otr_cuadriceps": {"n": "Apretar el muslo con toalla bajo la rodilla", "cat": "mmii", "t": ["postop", "muletas", "sin_carga"], "dose": "3×10 de 5 s, 3 veces al día", "how": ["Siéntate o acuéstate con la pierna estirada y una toalla enrollada bajo la rodilla.", "Aprieta la rodilla contra la toalla, tensando el muslo y llevando la punta del pie hacia ti.", "Mantén 5 segundos y relaja."], "care": "Debe sentirse trabajar el muslo, sin dolor en la rodilla.", "contra": "Cirugía con indicación de no contraer el muslo (poco frecuente): sigue la pauta de tu traumatólogo.", "desc": "Mantiene activo el músculo del muslo después de una cirugía o lesión, para que no pierda fuerza."}, "otr_pierna_estirada": {"n": "Levantar la pierna estirada", "cat": "mmii", "t": ["postop", "muletas", "sin_carga"], "dose": "3×10, 2 veces al día", "how": ["Acuéstate de espalda con una rodilla doblada y la otra pierna estirada.", "Aprieta el muslo de la pierna estirada y levántala hasta la altura de la otra rodilla.", "Baja lento sin dejarla caer."], "care": "La rodilla de la pierna que levantas no se dobla. Si te duele la espalda, levanta menos.", "contra": "Fractura de cadera o fémur sin autorización, prótesis de cadera sin autorización para levantar la pierna estirada, o dolor lumbar que aumenta al levantar la pierna.", "desc": "Fortalece el muslo sin doblar la rodilla, útil después de una cirugía o cuando doblarla duele."}, "eq_transfer_peso": {"n": "Pasar el peso de un pie al otro", "cat": "eq", "t": ["caidas"], "dose": "2×10, 2 veces al día", "how": ["Párate frente a un mesón firme, con los pies separados al ancho de las caderas y las manos apoyadas en él.", "Lleva lentamente el peso del cuerpo hacia el pie derecho, sin levantar el izquierdo, y mantén 2 segundos.", "Vuelve al centro y repite hacia el otro lado. Eso cuenta como una repetición."], "care": "Mueve la cadera, no el tronco: los hombros quedan sobre los pies. Si te mareas o pierdes el equilibrio, apóyate y descansa.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance. Cirugía con indicación de no cargar una pierna.", "desc": "Enseña a pasar el peso de un pie al otro con control, el primer paso para caminar con seguridad."}, "eq_giros": {"n": "Girar dando varios pasos", "cat": "eq", "t": ["caidas"], "dose": "4–6 giros por lado, 1 vez al día", "how": ["Párate en un espacio despejado, cerca de una pared o de otra persona.", "Para darte vuelta, da 4 o 5 pasos cortos describiendo un semicírculo, sin pivotear sobre un pie.", "Detente, respira y gira hacia el otro lado de la misma forma."], "care": "Nunca gires de golpe sobre un solo pie: es una causa frecuente de caídas. Si te mareas, espera de pie con apoyo hasta que pase.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Te enseña a darte vuelta de forma segura, uno de los momentos en que más caídas ocurren."}, "eq_doble_tarea": {"n": "Caminar nombrando objetos", "cat": "eq", "t": ["caidas", "vert"], "dose": "2 min, 1 vez al día", "how": ["Camina dentro de tu casa, por un pasillo despejado y a ritmo cómodo.", "Mientras caminas, nombra en voz alta los objetos que ves, o di palabras que empiecen con una letra.", "Si te cuesta, camina más lento; no te detengas a pensar en mitad del pasillo."], "care": "Hazlo solo donde no haya alfombras sueltas ni cables. Si pierdes el equilibrio o te detienes seguido, vuelve a caminar sin la tarea y avísale a tu kinesiólogo.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance. Caídas frecuentes recientes sin evaluación.", "desc": "Entrena a caminar mientras piensas o conversas, como en la vida diaria, para que el equilibrio no falle cuando te distraes."}, "ves_pelota_pared": {"n": "Pelota contra la pared siguiéndola con la vista", "cat": "ves", "t": ["vert"], "dose": "3×10 lanzamientos, 1 vez al día", "how": ["Párate frente a una pared, a un metro de distancia, con una pelota liviana.", "Lánzala contra la pared y atrápala, siguiéndola siempre con la mirada.", "Alterna: 10 con la mano derecha, 10 con la izquierda y 10 con ambas manos."], "care": "Si aparece mareo, haz los lanzamientos más lentos o sentado. Si el mareo dura más de 15 minutos, detente y avísale a tu kinesiólogo.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos.", "desc": "Combina vista, cabeza y movimiento para que el mareo moleste menos en actividades cotidianas."}, "mmii_ext_rodilla": {"n": "Extensión de rodilla sentado", "cat": "mmii", "t": ["caidas", "postop", "muletas", "sin_carga"], "dose": "2×10 por lado, 1 vez al día", "how": ["Siéntate derecho en una silla firme, con los pies apoyados.", "Estira una rodilla hasta dejar la pierna recta, con la punta del pie hacia ti.", "Mantén 2 segundos y baja lento. Haz todas las repeticiones y cambia de pierna."], "care": "No balancees la pierna. Si duele la rodilla, sube solo hasta donde no duela.", "contra": "Cirugía de rodilla con restricción de movimiento sin autorización, o dolor de rodilla que aumenta al estirarla.", "desc": "Fortalece el músculo del muslo, clave para pararte de una silla, subir escaleras y proteger la rodilla."}, "mmii_abd_cadera": {"n": "Abducción de cadera de pie con apoyo", "cat": "mmii", "t": ["caidas"], "dose": "2×10 por lado, 1 vez al día", "how": ["Párate de lado a un mesón firme y apóyate con una mano.", "Lleva la pierna de afuera hacia el costado, recta y con la punta del pie mirando al frente.", "Vuelve lento al centro. Haz todas las repeticiones y cambia de lado."], "care": "No inclines el tronco hacia el otro lado: el movimiento es corto. Si tienes prótesis de cadera, hazlo solo si tu kinesiólogo lo autorizó.", "contra": "Prótesis de cadera con restricción de abrir la pierna sin autorización; dolor en el costado de la cadera que aumenta con el ejercicio.", "desc": "Fortalece los músculos del costado de la cadera, que te mantienen estable al caminar y al pararte en un pie."}, "mmii_ext_cadera": {"n": "Extensión de cadera de pie con apoyo", "cat": "mmii", "t": ["caidas"], "dose": "2×10 por lado, 1 vez al día", "how": ["Párate frente a un mesón firme, con las dos manos apoyadas.", "Lleva una pierna recta hacia atrás, sin arquear la espalda.", "Mantén 1 segundo y vuelve lento. Haz todas las repeticiones y cambia de pierna."], "care": "El movimiento es pequeño; si la espalda se arquea, estás subiendo demasiado. Detente si duele la espalda baja.", "contra": "Dolor lumbar agudo que aumenta al llevar la pierna atrás; cirugía de cadera con restricción de extensión.", "desc": "Fortalece los glúteos, que te impulsan al caminar y al subir escaleras."}, "mmii_almeja": {"n": "Almeja acostado de lado", "cat": "mmii", "t": ["lumbar", "muletas"], "dose": "3×12 por lado, día por medio", "how": ["Acuéstate de lado, con las caderas y rodillas dobladas y los pies juntos.", "Sin separar los pies, abre la rodilla de arriba como una almeja.", "Baja lento. Haz todas las repeticiones y cambia de lado."], "care": "La pelvis no se va hacia atrás: abre solo hasta donde la mantengas quieta. Si te operaron la cadera, consulta antes de hacerlo.", "contra": "Prótesis de cadera por vía posterior en las primeras semanas sin autorización; dolor en el costado de la cadera al apoyarte.", "desc": "Fortalece el glúteo medio, que estabiliza la cadera y la rodilla y protege la espalda baja."}, "mmii_talon_cama": {"n": "Deslizar el talón en la cama", "cat": "mmii", "t": ["postop", "sin_carga"], "dose": "2×10 por lado, 2 veces al día", "how": ["Acuéstate de espalda en la cama, con las piernas estiradas.", "Desliza un talón hacia los glúteos, doblando cadera y rodilla, sin despegarlo del colchón.", "Vuelve a estirar la pierna lentamente y repite. Luego cambia de pierna."], "care": "Hazlo despacio y sin forzar el final del movimiento. Si tienes calambres, detente, estira la pierna y descansa.", "contra": "Cirugía con indicación de no doblar la rodilla o la cadera más allá de un ángulo.", "desc": "Recupera el movimiento de la cadera y la rodilla después de una cirugía o de estar mucho tiempo en cama."}, "mmii_basculacion": {"n": "Basculación pélvica sentado", "cat": "lum", "t": ["lumbar"], "dose": "2×10, 1 vez al día", "how": ["Siéntate en el borde de una silla firme, con los pies apoyados y las manos en los muslos.", "Arquea suavemente la espalda baja, llevando la pelvis hacia adelante.", "Luego redondea la espalda baja, llevando la pelvis hacia atrás. Eso es una repetición."], "care": "Es un movimiento pequeño y sin rebotes. Si aparece dolor que baja por la pierna, detente y avísale a tu kinesiólogo.", "contra": "Dolor lumbar con hormigueo o debilidad en las piernas sin evaluación, o pérdida de control de la orina o las deposiciones (urgencia médica).", "desc": "Mejora la movilidad de la espalda baja y la conciencia de la postura al estar sentado."}, "mmss_remo": {"n": "Remo con banda elástica", "cat": "mmss", "t": ["hombro", "muletas", "sin_carga"], "dose": "2×10, día por medio", "how": ["Siéntate derecho y fija la banda a una manilla firme frente a ti, a la altura del pecho.", "Toma un extremo con cada mano y tira hacia atrás, juntando los omóplatos y con los codos pegados al cuerpo.", "Mantén 2 segundos y vuelve lento."], "care": "Los hombros no suben hacia las orejas. Revisa que la banda esté bien fijada antes de tirar.", "contra": "Cirugía reciente de hombro sin autorización o dolor agudo de hombro.", "desc": "Fortalece la espalda alta y la parte posterior de los hombros para mejorar la postura y el control del hombro."}, "mmss_elev_escapular": {"n": "Elevar los brazos en diagonal sin carga", "cat": "mmss", "t": ["hombro", "sin_carga"], "dose": "2×10, 1 vez al día", "how": ["Siéntate o párate derecho, con los brazos a los costados y los pulgares hacia arriba.", "Sube los brazos hacia adelante y un poco hacia afuera, en diagonal, hasta la altura de los hombros.", "Baja lentamente."], "care": "No pases la altura de los hombros. Si duele más de 3 en una escala de 0 a 10, sube menos.", "contra": "Cirugía de hombro con restricción de elevación o luxación reciente.", "desc": "Recupera el movimiento del hombro y activa los músculos que lo estabilizan, sin carga."}, "mmss_rot_externa": {"n": "Rotación externa de hombro con banda", "cat": "mmss", "t": ["hombro", "muletas", "sin_carga"], "dose": "2×15, día por medio", "how": ["Siéntate o párate con el codo pegado al cuerpo y doblado en ángulo recto.", "Toma la banda con ambas manos, frente al abdomen.", "Abre los antebrazos hacia afuera sin despegar los codos, y vuelve lento."], "care": "Usa una banda suave. El movimiento sale del hombro, no del tronco: no te gires.", "contra": "Luxación de hombro reciente o cirugía con restricción de rotación externa.", "desc": "Fortalece el manguito rotador, los músculos que mantienen el hombro centrado y protegido."}, "mmss_brazos": {"n": "Bíceps y tríceps sentado con botellas", "cat": "mmss", "t": ["hombro", "muletas", "fuerza", "sin_carga"], "dose": "3×12, día por medio", "how": ["Siéntate derecho con una botella con agua en cada mano.", "Bíceps: con los codos pegados al cuerpo, sube las botellas hacia los hombros y baja lento.", "Tríceps: inclina el tronco hacia adelante con la espalda recta, deja el codo pegado al costado y doblado, y estira el codo llevando la botella hacia atrás. Vuelve lento."], "care": "Usa poco peso al comienzo (medio litro). Respira durante el movimiento y no balancees el tronco. No subas los brazos por sobre la cabeza.", "contra": "Dolor agudo o cirugía reciente de hombro, codo o muñeca sin autorización.", "desc": "Fortalece los brazos con elementos de la casa, útil para levantarte, cargar cosas y usar bastón o muletas."}, "res_caminata_bloques": {"n": "Caminata por bloques", "cat": "res", "t": ["caidas", "acond"], "dose": "Bloques 4–5 min + 2 min pausa, diario", "how": ["Camina a ritmo cómodo durante el tiempo indicado por tu kinesiólogo.", "Descansa 2 minutos, sentado o de pie con apoyo.", "Repite los bloques. Debes poder hablar mientras caminas."], "care": "Si el cansancio llega a 6 de 10, te falta el aire o te sientes mareado, detente y descansa. No alargues los bloques por tu cuenta.", "contra": "Dolor de pecho, falta de aire o desmayos sin evaluación médica; restricción cardiológica para hacer ejercicio.", "desc": "Mejora tu resistencia de forma gradual, caminando por tramos con pausas, sin agotarte."}, "res_bicicleta": {"n": "Bicicleta estática", "cat": "res", "t": ["postop", "acond"], "dose": "5–15 min suave, 1 vez al día", "how": ["Ajusta el asiento para que la rodilla quede apenas doblada con el pedal abajo.", "Pedalea a ritmo suave durante el tiempo indicado, con la resistencia en lo más bajo.", "Aumenta el tiempo o la resistencia solo cuando tu kinesiólogo lo indique."], "care": "Si no completas la vuelta del pedal sin dolor, haz balanceos cortos adelante y atrás. Detente si aumenta la hinchazón o el dolor.", "contra": "Cirugía de rodilla o cadera sin autorización para pedalear; restricción cardiológica para hacer ejercicio.", "desc": "Mejora la condición física y el movimiento de las rodillas con poco impacto en las articulaciones."}, "res_baston": {"n": "Marcha con bastón", "cat": "res", "t": ["postop", "caidas"], "dose": "5–10 min, 2 veces al día", "how": ["Lleva el bastón en la mano del lado contrario a la pierna afectada.", "Avanza el bastón y la pierna afectada al mismo tiempo.", "Luego avanza la pierna sana. Mira al frente, no a tus pies."], "care": "Apoya la pierna afectada solo con la carga que te autorizaron. Camina por lugares despejados y con calzado cerrado.", "load": true, "contra": "Sin indicación del profesional sobre cuánto peso apoyar, o mareo sin evaluar.", "desc": "Te enseña a usar bien el bastón para caminar con más seguridad y menos carga en la pierna afectada."}, "res_muletas": {"n": "Marcha en 3 puntos con muletas", "cat": "res", "t": ["postop", "muletas"], "dose": "Según indicación", "how": ["Adelanta las dos muletas a la vez, a un paso de distancia.", "Adelanta la pierna operada hasta la altura de las muletas, apoyando solo lo autorizado.", "Pasa la pierna sana, cargando el peso en las manos y no en las axilas."], "care": "Respeta siempre la carga autorizada por tu traumatólogo. Si sientes dolor nuevo, hormigueo o inestabilidad, detente y avisa.", "load": true, "contra": "Sin entrenamiento previo con un profesional, sin indicación de carga o con mareo sin evaluar.", "desc": "Te enseña a caminar con muletas descargando la pierna operada según lo que te autorizaron."}, "ves_x2h": {"n": "Mirada fija moviendo tarjeta y cabeza (VOR x2)", "cat": "ves", "t": ["vert"], "dose": "3×30 s, 3 veces al día", "how": ["Siéntate y sostén una tarjeta con una letra a la distancia de tu brazo, frente a tus ojos.", "Mueve la tarjeta hacia un lado y, al mismo tiempo, gira la cabeza hacia el lado contrario, sin dejar de ver la letra nítida.", "Vuelve igual hacia el otro lado. Parte lento: si la letra se pone borrosa, baja la velocidad."], "care": "Es más exigente que la mirada fija simple: hazlo solo cuando tu kinesiólogo lo indique. Es normal sentir un mareo leve que pasa en pocos minutos. Si dura más de 15 minutos, si vomitas o si aparece un síntoma nuevo, detente y avísale a tu kinesiólogo.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos. No hacerlo antes de dominar la mirada fija simple.", "desc": "Nivel más exigente del reflejo de la mirada: acelera la adaptación cuando el ejercicio simple ya no da mareo."}, "ves_x1_semitandem": {"n": "Mirada fija de pie, un pie medio adelante", "cat": "ves", "t": ["vert", "caidas"], "dose": "3×30 s, 2 veces al día", "how": ["Párate de lado junto a un mesón, con un pie medio adelantado: el talón de adelante junto al arco del otro pie.", "Mira una letra pegada en la pared frente a ti, a la altura de los ojos y a un metro.", "Gira la cabeza de lado a lado sin dejar de ver la letra nítida. Cambia el pie de adelante en cada serie."], "care": "Siempre con el mesón al alcance o una persona al lado. Si pierdes el equilibrio, vuelve a la versión sentada. Es normal sentir un mareo leve que pasa en pocos minutos. Si dura más de 15 minutos, si vomitas o si aparece un síntoma nuevo, detente y avísale a tu kinesiólogo.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos. Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance.", "desc": "Lleva el ejercicio de la mirada a la posición de pie, sumando equilibrio y control de la cabeza."}, "ves_ojos_cerrados": {"n": "Equilibrio con ojos cerrados, un pie medio adelante", "cat": "ves", "t": ["vert", "caidas"], "dose": "3×20 s, 1 vez al día", "how": ["Párate en una esquina de la casa o frente a un mesón, con un pie medio adelantado.", "Busca el equilibrio con los ojos abiertos y luego ciérralos.", "Mantén la posición el tiempo indicado. Abre los ojos si te tambaleas."], "care": "Hazlo solo con una pared, un mesón o una persona al alcance de la mano. Si te tambaleas mucho, hazlo con los pies juntos.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos. No hacerlo sin un apoyo o una persona al alcance.", "desc": "Entrena el equilibrio sin la vista, como en la oscuridad o al levantarte de noche."}, "ves_recoger": {"n": "Agacharse a recoger un objeto sentado", "cat": "ves", "t": ["vert"], "dose": "2×5, 2 veces al día", "how": ["Siéntate en una silla firme con un objeto liviano en el suelo, delante de tus pies.", "Inclínate, recógelo y vuelve a sentarte derecho, siguiendo el objeto con la mirada.", "Déjalo de nuevo en el suelo de la misma forma. Hazlo a ritmo lento."], "care": "Sirve para que el cerebro se acostumbre a los cambios de posición. Es normal sentir un mareo leve que pasa en pocos minutos. Si dura más de 15 minutos, si vomitas o si aparece un síntoma nuevo, detente y avísale a tu kinesiólogo.", "contra": "Vértigo o mareo sin evaluación profesional, mareo con síntomas nuevos (habla traposa, visión doble, debilidad o adormecimiento de un lado), o crisis aguda de vértigo con vómitos. Presión ocular alta (glaucoma) no controlada o desprendimiento de retina reciente.", "desc": "Acostumbra al cerebro a los cambios de posición de la cabeza, como al agacharte a recoger algo."}, "aq_talones_lentos": {"n": "Pararse en puntas lento (3 s arriba, 3 s abajo)", "cat": "tob", "t": ["aquiles"], "dose": "3×15, día por medio", "how": ["Párate frente a un mesón, con las manos apoyadas solo para el equilibrio.", "Sube en puntas con las dos piernas, contando 3 segundos.", "Baja contando 3 segundos hasta apoyar los talones."], "care": "Puede molestar un poco mientras lo haces; si a la mañana siguiente estás peor, avísale a tu kinesiólogo.", "contra": "Rotura o sospecha de rotura del tendón de Aquiles sin tratamiento.", "desc": "Es la base del fortalecimiento del tendón de Aquiles y de la pantorrilla, con un ritmo lento y controlado."}, "aq_talones_rapidos": {"n": "Pararse en puntas rápido en una pierna", "cat": "tob", "t": ["aquiles"], "dose": "3×15, día por medio", "how": ["Párate en una pierna frente a un mesón, con las manos apoyadas.", "Sube en puntas rápido, en un segundo.", "Baja controlado y repite sin pausa. Cambia de pierna."], "care": "Es una etapa avanzada, previa a los saltos. Hazlo solo cuando tu kinesiólogo lo indique y nunca si el tendón duele al caminar.", "contra": "Dolor del tendón al caminar o etapas previas sin completar.", "desc": "Prepara el tendón para movimientos rápidos, la etapa previa a correr y saltar."}, "aq_elong_toalla": {"n": "Elongación de pantorrilla sentado con toalla", "cat": "tob", "t": ["aquiles"], "dose": "3×30 s, 2 veces al día", "how": ["Siéntate en el suelo o en la cama con la pierna estirada.", "Pasa una toalla por la planta del pie y toma un extremo con cada mano.", "Tira suavemente de la toalla hacia ti hasta sentir que se estira la pantorrilla. Mantén sin rebotes."], "care": "Debe sentirse un estiramiento suave, no dolor. Si el dolor es en el talón, consúltalo antes con tu kinesiólogo.", "contra": "Rotura o cirugía reciente del tendón de Aquiles sin autorización para elongar.", "desc": "Elonga la pantorrilla sentado, una opción cómoda si te cuesta hacerlo de pie."}, "cerv_asentir": {"n": "Asentir acostado (flexión de cuello profunda)", "cat": "cerv", "t": ["cervical"], "dose": "10 de 10 s, 1 vez al día", "how": ["Acuéstate de espalda con las rodillas dobladas y la cabeza apoyada.", "Haz un 'sí' muy pequeño: lleva el mentón hacia el pecho sin despegar la cabeza.", "Mantén 10 segundos respirando normal y relaja."], "care": "El movimiento es pequeño y lento. No debería doler. Si aparece hormigueo en los brazos o mareo, detente y avísale a tu kinesiólogo.", "contra": "Dolor de cuello después de un golpe o caída reciente sin evaluación, hormigueo o debilidad que aumenta en brazos o piernas, o mareo y visión doble al mover el cuello.", "desc": "Fortalece los músculos profundos del cuello, que sostienen la cabeza y alivian el dolor cervical."}, "cerv_isometricos": {"n": "Isométricos de cuello con la mano", "cat": "cerv", "t": ["cervical"], "dose": "5 de 5 s por dirección, 2 veces al día", "how": ["Siéntate derecho y apoya la palma en un costado de la cabeza, sobre la sien.", "Empuja la cabeza contra la mano sin moverla, con poca fuerza, durante 5 segundos. La cabeza se queda derecha.", "Repite al otro lado, luego con la mano en la frente y con la mano en la nuca."], "care": "Usa poca fuerza, como un tercio de lo que podrías. No contengas la respiración. Detente si aumenta el dolor.", "contra": "Dolor de cuello después de un golpe o caída reciente sin evaluación, hormigueo o debilidad que aumenta en brazos o piernas, o mareo y visión doble al mover el cuello.", "desc": "Fortalece el cuello sin moverlo, una forma segura de trabajar cuando el movimiento duele."}, "tor_libro": {"n": "Apertura de tórax acostado de lado (libro abierto)", "cat": "tor", "t": ["lumbar", "cervical"], "dose": "2×10 por lado, 1 vez al día", "how": ["Acuéstate de lado con las rodillas dobladas y los brazos estirados al frente, una mano sobre la otra.", "Abre el brazo de arriba hacia el otro lado, siguiendo la mano con la mirada, como un libro que se abre.", "Vuelve lento a juntar las manos. Las rodillas se quedan juntas."], "care": "Abre solo hasta donde no duela. Si se duerme o se hormiguea el brazo, detente.", "contra": "Cirugía reciente de columna, hombro o tórax sin autorización, o dolor que baja por el brazo al girar.", "desc": "Mejora el giro de la espalda alta y abre el pecho, útil si pasas muchas horas sentado."}, "tor_extension_silla": {"n": "Extensión de espalda alta en la silla", "cat": "tor", "t": ["cervical", "sin_carga"], "dose": "2×10, 2 veces al día", "how": ["Siéntate en una silla de respaldo bajo y firme, con las manos detrás de la nuca.", "Apoya la parte alta de la espalda en el borde del respaldo.", "Lleva el pecho hacia el techo arqueando suavemente la espalda alta y vuelve."], "care": "El movimiento sale de la espalda alta, no del cuello ni de la espalda baja. Sin rebotes.", "contra": "Fractura vertebral reciente o cirugía de columna sin autorización.", "desc": "Mejora la movilidad de la espalda alta y contrarresta la postura encorvada."}, "lum_gato_perro": {"n": "Gato y perro en cuatro apoyos", "cat": "lum", "t": ["lumbar"], "dose": "2×10, 1 o 2 veces al día", "how": ["Ponte en cuatro apoyos sobre una colchoneta: manos bajo los hombros y rodillas bajo las caderas.", "Redondea la espalda hacia el techo, llevando el mentón al pecho.", "Luego húndela suavemente, mirando al frente. Alterna lento, siguiendo la respiración."], "care": "Mueve dentro de un rango cómodo. Si te duelen las muñecas o las rodillas, ponles una toalla doblada debajo.", "contra": "Dolor de muñeca o de rodilla que impida apoyarse, o dolor lumbar agudo con hormigueo o debilidad en las piernas.", "desc": "Moviliza toda la columna de forma suave y disminuye la rigidez de la espalda."}, "lum_bicho_muerto": {"n": "Bicho muerto", "cat": "lum", "t": ["lumbar", "fuerza", "core", "acond"], "dose": "2×8 por lado, día por medio", "how": ["Acuéstate de espalda con las caderas y rodillas dobladas en ángulo recto y los brazos estirados hacia el techo.", "Aprieta suavemente el abdomen para que la espalda baja no se despegue del suelo.", "Baja un brazo hacia atrás y la pierna contraria hacia adelante, lento. Vuelve y cambia de lado."], "care": "Si la espalda baja se arquea, baja menos el brazo y la pierna. Respira durante todo el ejercicio.", "contra": "Dolor lumbar agudo, cirugía abdominal reciente o diástasis abdominal sin evaluación.", "desc": "Fortalece el abdomen profundo coordinando brazos y piernas, sin cargar la espalda baja."}, "lum_activacion": {"n": "Activación abdominal profunda acostado", "cat": "lum", "t": ["lumbar", "postop", "muletas", "sin_carga", "core", "acond"], "dose": "10 de 10 s, 1 vez al día", "how": ["Acuéstate de espalda con las rodillas dobladas y los dedos sobre los huesos de la cadera, hacia adentro.", "Bota el aire y mete suavemente el ombligo hacia la espalda, sin mover la pelvis.", "Mantén 10 segundos respirando normal y relaja."], "care": "Es una contracción suave, no un apriete fuerte. Si contienes la respiración, estás apretando demasiado.", "contra": "Ninguna habitual. Después de una cirugía abdominal, espera la autorización de tu cirujano.", "desc": "Enseña a activar el abdomen profundo, que sostiene y protege la espalda baja."}, "lum_extension_prono": {"n": "Extensión de espalda boca abajo", "cat": "lum", "t": ["lumbar"], "dose": "2×10, 2 veces al día", "how": ["Acuéstate boca abajo con las manos apoyadas al lado de los hombros.", "Estira los brazos para levantar el pecho, dejando la cadera apoyada en el suelo y la espalda baja relajada.", "Mantén 1 segundo arriba y baja lento."], "care": "Sube solo hasta donde no duela. Si el dolor baja por la pierna o aumenta, detente y avísale a tu kinesiólogo.", "contra": "Estrechez del canal lumbar (estenosis) o espondilolistesis, que suelen empeorar al arquear la espalda; dolor que aumenta o baja más por la pierna al hacerlo; embarazo.", "desc": "Moviliza la espalda baja hacia atrás; en algunos dolores lumbares ayuda a disminuir el dolor que baja por la pierna."}, "tob_ojos_cerrados": {"n": "En un pie con ojos cerrados", "cat": "tob", "t": ["tobillo"], "dose": "3×20 s por lado, 1 vez al día", "how": ["Párate en un pie frente a un mesón, con la rodilla levemente doblada.", "Cuando tengas el equilibrio, cierra los ojos.", "Mantén la posición. Abre los ojos si te tambaleas. Cambia de pierna."], "care": "Ten siempre el mesón al alcance de la mano. Si no logras 10 segundos, vuelve a hacerlo con los ojos abiertos.", "contra": "Mareo al ponerse de pie sin evaluar, o no tener un apoyo firme al alcance. Esguince reciente sin alta para cargar en una pierna.", "desc": "Entrena los reflejos del tobillo sin ayuda de la vista, clave para evitar nuevos esguinces."}, "tob_un_pie_pelota": {"n": "En un pie lanzando una pelota", "cat": "tob", "t": ["tobillo"], "dose": "3×10 por pierna, 1 vez al día", "how": ["Párate en un pie a un metro de una pared, con la rodilla levemente doblada.", "Lanza una pelota liviana contra la pared y atrápala sin apoyar el otro pie.", "Varía la altura y el lado de los lanzamientos. Cambia de pierna."], "care": "Entrena los reflejos del tobillo. Hazlo en un lugar despejado y con calzado. Si apoyas seguido el otro pie, vuelve al equilibrio sin pelota.", "contra": "Esguince reciente sin alta para cargar en una pierna, o no lograr 30 segundos en un pie.", "desc": "Entrena el equilibrio en una pierna mientras la atención está en otra cosa, como pasa en el deporte."}, "tob_saltos_laterales": {"n": "Saltos laterales sobre una línea", "cat": "tob", "t": ["tobillo"], "dose": "3×10, 2 o 3 veces por semana", "how": ["Pon una cinta en el suelo y párate al lado, con los pies juntos.", "Salta hacia el otro lado de la línea y vuelve, con saltos cortos.", "Aterriza suave en la parte delantera de los pies, con las rodillas un poco dobladas."], "care": "Es una etapa avanzada. Hazlo solo cuando tu kinesiólogo lo indique y detente si el tobillo duele o se siente inestable.", "contra": "Dolor del tobillo al caminar, esguince o lesión reciente sin alta para saltar, osteoporosis avanzada o prótesis de cadera o rodilla.", "desc": "Prepara el tobillo para cambios de dirección rápidos, necesarios para volver al deporte."}, "tob_aterrizaje": {"n": "Saltar y caer en un pie", "cat": "tob", "t": ["tobillo"], "dose": "2×6 por pierna, 2 o 3 veces por semana", "how": ["Párate en dos pies sobre una superficie firme.", "Da un salto corto hacia adelante y cae sobre un solo pie, con la rodilla levemente doblada.", "Mantén el equilibrio 3 segundos antes de apoyar el otro pie."], "care": "Es el último paso antes de volver al deporte. Hazlo solo cuando tu kinesiólogo lo indique. La rodilla no debe irse hacia adentro al caer.", "contra": "Dolor del tobillo al caminar, esguince o lesión reciente sin alta para saltar, osteoporosis avanzada o prótesis de cadera o rodilla.", "desc": "Enseña a caer de un salto de forma segura, el último paso antes de volver al deporte."}, "tob_puntas_talones": {"n": "Caminar en puntas", "cat": "tob", "t": ["tobillo", "caidas"], "dose": "2 pasadas de 5 metros, 1 vez al día", "how": ["Camina por un pasillo en puntas de pies, con los talones elevados.", "Mantén el cuerpo derecho y da pasos cortos.", "Hazlo junto a una pared o un mesón."], "care": "Si pierdes el equilibrio, apóyate en la pared. Detente si duele el tobillo o el tendón de Aquiles.", "contra": "Dolor agudo del tendón de Aquiles o esguince reciente sin alta, o mal equilibrio sin apoyo.", "desc": "Fortalece la pantorrilla y entrena el equilibrio al caminar."}, "tob_caminar_talones": {"n": "Caminar en talones", "cat": "tob", "t": ["tobillo", "caidas"], "dose": "2 pasadas de 5 metros, 1 vez al día", "how": ["Camina por un pasillo solo sobre los talones, con la punta de los pies levantada.", "Mantén el cuerpo derecho, sin echar la cadera hacia atrás.", "Hazlo junto a una pared o un mesón."], "care": "Si pierdes el equilibrio, apóyate en la pared. Detente si duele el tobillo o la parte de adelante de la pierna.", "contra": "Dolor agudo del talón o de la parte delantera de la pierna, o mal equilibrio sin apoyo.", "desc": "Fortalece los músculos de adelante de la pierna, que evitan tropezar y arrastrar la punta del pie."}, "fz_hip_thrust": {"n": "Hip thrust con mancuerna o mochila", "cat": "mmii", "t": ["glut", "comp", "fuerza"], "dose": "3×8–12, 2 o 3 veces por semana", "how": ["Apoya la parte alta de la espalda en el borde de un sofá o una cama firme, con las rodillas dobladas y los pies al ancho de las caderas.", "Pon una mancuerna o una mochila con peso sobre la cadera y sujétala con las manos.", "Empuja con los talones y sube la cadera hasta alinear hombros, cadera y rodillas. Aprieta los glúteos 1 segundo y baja lento."], "care": "Mentón recogido y costillas abajo: el movimiento sale de la cadera, no de arquear la espalda. Pon una toalla doblada bajo el peso.", "contra": "Dolor lumbar agudo o que baja por la pierna; cirugía reciente de cadera, columna o abdomen; embarazo avanzado.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}, "desc": "Uno de los mejores ejercicios para fortalecer y aumentar el volumen de los glúteos."}, "fz_rdl": {"n": "Peso muerto rumano con mancuernas", "cat": "mmii", "t": ["glut", "comp", "fuerza"], "dose": "3×8–12, 2 o 3 veces por semana", "how": ["De pie, con los pies al ancho de las caderas y una mancuerna en cada mano frente a los muslos.", "Con las rodillas apenas dobladas, lleva la cadera hacia atrás y baja las mancuernas pegadas a las piernas, con la espalda recta.", "Baja hasta sentir tensión detrás de los muslos, más o menos bajo las rodillas, y sube apretando los glúteos."], "care": "La espalda no se redondea; si se redondea, baja menos. Las mancuernas van rozando las piernas todo el recorrido.", "contra": "Dolor lumbar con irradiación activa; osteoporosis con fracturas vertebrales; vértigo posicional (al bajar la cabeza).", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}, "desc": "Fortalece glúteos, la parte posterior de los muslos y la espalda, y enseña a agacharte correctamente."}, "fz_zancada_inversa": {"n": "Zancada hacia atrás", "cat": "mmii", "t": ["glut", "comp", "fuerza"], "dose": "3×8–12 por pierna, 2 veces por semana", "how": ["De pie cerca de un apoyo, sin peso al comienzo o con una mancuerna en cada mano.", "Da un paso largo hacia atrás y baja hasta que la rodilla de atrás quede cerca del suelo, con el tronco levemente inclinado.", "Empuja con el talón de adelante para volver. Haz todas las repeticiones y cambia de pierna."], "care": "La rodilla de adelante sigue la línea del pie, sin irse hacia adentro.", "contra": "Artrosis o dolor de rodilla que aumenta al doblarla; tobillo inestable sin rehabilitar; mal equilibrio sin supervisión.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}, "desc": "Fortalece piernas y glúteos de a una pierna, con menos carga en la rodilla que la zancada hacia adelante."}, "fz_bulgara": {"n": "Sentadilla búlgara", "cat": "mmii", "t": ["glut", "fuerza"], "dose": "3×8–12 por pierna, 2 veces por semana", "how": ["Párate a un paso largo delante de una silla firme y apoya el empeine del pie de atrás en el asiento.", "Baja doblando la rodilla de adelante hasta que el muslo quede casi horizontal, con el tronco algo inclinado.", "Sube empujando con el pie de adelante. Agrega mancuernas solo cuando domines el movimiento."], "care": "Ten una pared o un mesón al lado. Si duele la rodilla de adelante, baja menos o vuelve a la zancada hacia atrás.", "contra": "Dolor de rodilla en la parte delantera o artrosis sintomática; mal equilibrio; cirugía de rodilla o cadera sin alta para carga.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}, "desc": "Ejercicio exigente de pierna y glúteo que trabaja cada lado por separado y mejora el equilibrio."}, "fz_step_alto": {"n": "Subir a un escalón alto", "cat": "mmii", "t": ["glut", "fuerza"], "dose": "3×8–12 por pierna, 2 veces por semana", "how": ["Ponte frente a un cajón o escalón firme de 30 a 40 cm, con una mano en la baranda si la hay.", "Apoya todo el pie en el escalón y sube empujando solo con esa pierna, sin impulsarte con la de abajo.", "Baja lento y controlado. Haz todas las repeticiones con la misma pierna y cambia."], "care": "El cajón no debe moverse. Más alto trabaja más el glúteo, pero solo si la rodilla queda alineada con el pie.", "contra": "Dolor de rodilla al subir escaleras; mal equilibrio sin baranda; vértigo activo.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}, "desc": "Fortalece glúteo y muslo con un gesto funcional: subir."}, "fz_goblet": {"n": "Sentadilla goblet", "cat": "mmii", "t": ["glut", "comp", "fuerza"], "dose": "3×8–12, 2 o 3 veces por semana", "how": ["Sostén una mancuerna vertical frente al pecho, con los codos hacia abajo.", "Con los pies un poco más separados que las caderas, baja llevando la cadera atrás y abajo, con el pecho erguido.", "Baja hasta donde mantengas los talones apoyados y la espalda recta, y sube empujando el suelo."], "care": "Las rodillas siguen la dirección de los pies. Si te cuesta el equilibrio, hazla delante de una silla.", "contra": "Dolor de rodilla o cadera que aumenta al doblar mucho; prótesis de cadera con restricción de flexión.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}, "desc": "Sentadilla con peso al frente: fortalece piernas y glúteos y enseña una buena técnica de sentadilla."}, "fz_patada_banda": {"n": "Patada de glúteo con banda en cuatro apoyos", "cat": "mmii", "t": ["glut", "fuerza"], "dose": "3×12–20 por lado, 2 o 3 veces/semana", "how": ["Ponte en cuatro apoyos, con una banda elástica pasada por la planta de un pie y sujeta bajo las manos.", "Estira esa pierna hacia atrás y arriba hasta la altura de la cadera, apretando el glúteo, sin arquear la espalda.", "Vuelve lento y completa las repeticiones antes de cambiar d mas hacia arriba.", "Baja lento, en 2 a 3 segundos, sin balancear el tronco."], "care": "Si tienes que balancearte para subir, el peso es demasiado.", "contra": "Epicondilitis o tendinopatía del bíceps con dolor.", "prog": {"sets": 3, "lo": 10, "hi": 15, "unit": "kg"}, "desc": "Fortalece los bíceps, que usas para cargar bolsas, levantar cosas y tirar."}, "fz_triceps_banda": {"n": "Tríceps con banda, codo abajo", "cat": "mmss", "t": ["sup", "muletas", "fuerza", "sin_carga"], "dose": "3×10–15, 2 veces por semana", "how": ["Fija una banda elástica en la parte alta de una puerta cerrada y toma un extremo con cada mano.", "Con los codos pegados al cuerpo y doblados, estira los brazos hacia abajo.", "Vuelve lento hasta que los antebrazos queden horizontales."], "care": "Solo se mueven los antebrazos: codos y hombros quietos. Revisa que la banda esté bien fijada antes de tirar.", "contra": "Tendinopatía del tríceps o dolor de codo.", "prog": {"sets": 3, "lo": 10, "hi": 15, "unit": "banda", "levels": ["Amarilla (suave)", "Roja", "Verde", "Azul", "Negra (fuerte)"]}, "desc": "Fortalece los tríceps, que usas para empujar, levantarte de una silla y apoyarte en muletas o andador."}, "fz_elev_laterales": {"n": "Elevaciones laterales con mancuernas", "cat": "mmss", "t": ["sup", "fuerza", "sin_carga"], "dose": "3×12–15, 2 veces por semana", "how": ["De pie, con una mancuerna liviana en cada mano a los costados y los codos apenas doblados.", "Sube los brazos hacia el lado hasta la altura de los hombros.", "Baja lento."], "care": "No pases la altura de los hombros. Usa poco peso: aquí manda la técnica.", "contra": "Pinzamiento subacromial o dolor de hombro al elevar el brazo.", "prog": {"sets": 3, "lo": 12, "hi": 15, "unit": "kg"}, "desc": "Fortalece la parte lateral del hombro y le da forma al tren superior."}, "fz_plancha_lateral": {"n": "Plancha lateral", "cat": "lum", "t": ["lumbar", "fuerza", "core", "acond"], "dose": "3×20–40 s por lado, 3 veces por semana", "how": ["Acuéstate : "Girar con muletas en pasos cortos", "cat": "res", "t": ["muletas", "postop"], "dose": "4 giros por lado, en cada práctica", "how": ["Con una muleta a cada lado, decide hacia dónde vas a girar.", "Gira de a poco con 4 a 6 pasos cortos, moviendo primero las muletas y luego los pies.", "Mantén la carga autorizada en el pie operado y termina quieto antes de seguir caminando."], "care": "Nunca pivotees ni gires de golpe sobre el pie operado. Practica en un espacio despejado y con alguien cerca.", "load": true, "contra": "Sin autorización para caminar con carga o con mareo sin evaluar.", "desc": "Te enseña a darte vuelta con muletas sin torcer ni cargar de más la pierna operada."}, "fz_elev_piernas": {"n": "Elevación de piernas acostado (abdominales)", "cat": "lum", "t": ["fuerza", "comp", "core", "acond"], "dose": "3×8–12, 2 o 3 veces por semana", "how": ["Acuéstate de espalda en una colchoneta, con los brazos a los lados y la espalda baja apoyada en el suelo.", "Con las rodillas dobladas, sube las piernas hasta que los muslos queden verticales, botando el aire.", "Bájalas lento sin despegar la espalda baja. Cuando sea fácil, estira una pierna y luego las dos."], "care": "Si la espalda baja se despega o duele, vuelve a rodillas dobladas o baja menos las piernas.", "contra": "Dolor lumbar agudo, hernia abdominal o inguinal, diástasis abdominal, cirugía abdominal reciente o embarazo.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "nivel", "levels": ["Rodillas dobladas", "Una pierna estirada", "Piernas estiradas"]}, "desc": "Fortalece la parte baja del abdomen controlando el movimiento de las piernas, con niveles de dificultad."}, "fz_plancha": {"n": "Plancha frontal con progresión", "cat": "lum", "t": ["fuerza", "lumbar", "core", "acond"], "dose": "3×20–40 s, 3 veces por semana", "how": ["Apóyate en los antebrazos y las rodillas, con los codos justo bajo los hombros.", "Aprieta el abdomen y los glúteos para dejar el cuerpo recto desde la cabeza hasta las rodillas.", "
