 const end=pdate(t),startCol=new Date(end);startCol.setDate(end.getDate()-end.getDay()-7*11);let cal="";

async function doAuth(){const email=$("#auEmail").value.trim(),password=($("#auPass")||{}).value;authMsg="";const btn=document.querySelector("#authForm button[type=submit]");btn.disabled=true;
 try{if(authMode==="reset"){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});authMsg=error?"!"+(/rate|limit/i.test(error.message)?"Se enviaron demasiados correos en poco tiempo. Intenta de nuevo en una hora.":"No se pudo enviar el enlace. Revisa el correo e intenta otra vez."):"Si existe una cuenta con ese correo, te llegará un enlace para elegir una contraseña nueva. Revisa también la carpeta de spam."}
  else if(authMode==="up"){const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)authMsg="!"+(/registered|already/i.test(error.message)?"Ya existe una cuenta con ese correo. Entra con tu contraseña.":/password/i.test(error.message)?"La contraseña debe tener al menos 8 caracteres.":/rate|limit/i.test(error.message)?"Se enviaron demasiados correos en poco tiempo. Intenta de nuevo en una hora.":"No se pudo crear la cuenta. Revisa el correo e intenta otra vez.");else if(!data.session){authMode="in";authMsg="Te enviamos un correo para confirmar tu cuenta. Abre el enlace y luego entra aquí con tu contraseña."}}
  else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)authMsg="!"+(/confirm/i.test(error.message)?"Falta confirmar tu correo. Abre el enlace que te enviamos.":/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":"No se pudo entrar. Revisa tu conexión.")}}
 catch(e){authMsg="!No se pudo conectar. Revisa tu conexión."}
 if(!session||authMode==="reset")render()}
async function afterAuth(){if(!session){S=blank();M=null;ADM=null;tab="dia";view={};render();return}
 LS="ascenso."+session.user.id;S=blank();loadLocal();render();await refreshMember();await pull(false);render()}
sb.auth.onAuthStateChange((_e,s2)=>{if(_e==="PASSWORD_RECOVERY"){recovering=true;session=s2;authMsg="";render();return}const was=session&&session.user.id,now=s2&&s2.user.id;session=s2;if(was!==now)setTimeout(afterAuth,0)});
sb.auth.getSession().then(({data})=>{session=data.session;afterAuth()});
setInterval(()=>{if(session&&document.visibilityState==="visible")refreshMember()},300000);
window.addEventListener("online",()=>{if(dirty)flush()});

 o.innerHTML='<div style="max-width:420px;text-align:center"><img src="icon-192.png" alt="" width="96" height="96" style="border-radius:22px"><h1 style="margin:18px 0 8px;font-size:28px">Instala Ascenso</h1><p style="opacity:.8;line-height:1.5;margin:0 0 20px">Ascenso funciona como aplicación en tu teléfono. Instálala y ábrela desde tu pantalla de inicio.</p><div id="igSteps" style="text-align:left;background:#141a26;border:1px solid #232b3b;border-radius:14px;padding:16px;line-height:1.6;font-size:16px"></div><button id="igBtn" style="display:none;margin-top:18px;width:100%;padding:16px;border:0;border-radius:12px;background:#ff9a3c;color:#16110a;font-size:18px;font-weight:700">Instalar aplicación</button><p style="margin-top:22px"><a href="#" id="igSkip" style="color:#9aa6bd;font-size:14px">Continuar sin instalar</a></p></div>';
 function mount(){document.body.appendChild(o);

  if(dp)bt.style.display="block";
