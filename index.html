img{max-width:100%}[hidden]{display:none!important}body{margin:0}

function scheduled(m,day){if(m.archived&&m.archived<=day)return false;if(m.created>day)return false;return m.days.includes(pdate(day).getDay())}
function dayMissions(day){return S.missions.filter(m=>scheduled(m,day)).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"))}
function streak(){let n=0,g=0,d=today();const has=x=>S.done[x]&&Object.keys(S.done[x]).length>0,first=S.created||today();if(!has(d))d=addDays(d,-1);for(let k=0;k<1500&&d>=first;k++){if(has(d))n++;else if(dayMissions(d).length===0){}else if(g<1+Math.floor(n/7))g++;else break;d=addDays(d,-1)}return n}

function parqValid(){const t=S.train;return Array.isArray(t.parq)&&t.parq.length===PARQ.length&&(!t.parqAt||t.parqAt>=addDays(today(),-365))}
function parqFlags(){return parqValid()?S.train.parq.map((v,i)=>v?i:-1).filter(i=>i>=0):[]}
function trainReady(){const t=S.train;if(!S.onboard?.health)return"consent";if(!parqValid())return"parq";if(parqFlags().length&&!t.cleared)return"paused";if(t.hold)return"hold";if(!t.plan)return"plan";return"ok"}
function strengthAt(stage){const t=S.train;return t.sessions.filter(s=>s.type==="fuerza"&&s.stage===stage&&(s.at||0)>=(t.stageAt||0))}
function sessionToday(){return S.train.sessions.find(s=>s.date===today())}
function walkUp(){const t=S.train;if(!t.plan||t.plan.walk>=30)return 0;const w=t.sessions.filter(s=>s.type==="caminata"&&(s.at||0)>=(t.walkAt||0)),days=[...new Set(w.map(s=>s.date))];return days.length>=NEED&&w.slice(0,NEED).every(s=>s.result==="completa"&&s.borg<=6&&s.pain<=2&&!s.alert)?t.plan.walk+5:0}

function progression(){const t=S.train,last=t.sessions[0],cur=strengthAt(t.stage),days=[...new Set(cur.map(s=>s.date))],n=days.length;

 ${ms.length?ms.map(m=>missionRow(m,d,true)).join(""):`<div class="card"><h3>Tu próxima misión empieza aquí</h3><p class="mute">Crea una misión o elige entre los 24 hábitos sugeridos en Misiones.</p></div>`}`}

function calUrl(m){let d=today();for(let i=0;i<7&&!m.days.includes(pdate(d).getDay());i++)d=addDays(d,1);const[h,mi]=m.time.split(":").map(Number),s=d.replace(/-/g,"")+"T"+pad(h)+pad(mi)+"00",e=new Date(pdate(d).getTime()+(h*60+mi+15)*6e4),es=dstr(e).replace(/-/g,"")+"T"+pad(e.getHours())+pad(e.getMinutes())+"00";
 let tz="America/Santiago";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
 return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(m.name)+"&dates="+s+"/"+es+"&ctz="+encodeURIComponent(tz)+"&recur="+encodeURIComponent("RRULE:FREQ=WEEKLY;BYDAY="+m.days.map(x=>BYDAY[x]).join(","))}

function vTimer(){const t=S.timer;if(!t)return"";const m=S.missions.find(x=>x.id===t.mid);return`<div class="card"><div class="row sp"><h3>${esc(m?m.name:"Temporizador")}</h3><span class="pill">${t.dur} min</span></div><div class="timer" id="tClock">--:--</div><div class="row"><button class="btn pri" data-act="timerToggle">${t.run?"Pausar":"Continuar"}</button><button class="btn" data-act="timerStop">Cerrar</button></div><p class="mute small" id="tNote">Al terminar suena un aviso. La misión no se marca sola: confírmala tú.</p></div>`}
function timerElapsed(){const t=S.timer;return t?t.acc+(t.run?Date.now()-t.since:0):0}
function tickTimer(){const el=$("#tClock");if(!el||!S.timer)return;const left=Math.max(0,S.timer.dur*6e4-timerElapsed()),s=Math.ceil(left/1e3);el.textContent=pad(Math.floor(s/60))+":"+pad(s%60);
 if(left<=0&&!S.timer.rang){S.timer.rang=true;S.timer.run=false;S.timer.acc=S.timer.dur*6e4;save();beep();$("#tNote").textContent="Tiempo cumplido. Marca la misión si la hiciste.";toast("Tiempo cumplido")}}

let AL={on:true,fired:{},snooze:{}},alCtx=null,alRing=null,alCur=null;
try{Object.assign(AL,JSON.parse(localStorage.getItem("ascenso.alarm")||"{}"))}catch(e){}
function alSave(){try{localStorage.setItem("ascenso.alarm",JSON.stringify(AL))}catch(e){}}
function alUnlock(){try{if(!alCtx)alCtx=new(window.AudioContext||window.webkitAudioContext)();if(alCtx.state==="suspended")alCtx.resume()}catch(e){}}
document.addEventListener("pointerdown",alUnlock,{passive:true});
function alTone(){try{alUnlock();const a=alCtx,t=a.currentTime;[0,.25,.5].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=i===2?1175:880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);o.start(t+d);o.stop(t+d+.22)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function alQuiet(){clearInterval(alRing);alRing=null}
function alStop(){alQuiet();alCur=null;const el=$("#alarmBox");if(el)el.hidden=true}
function alNotify(title,body,tag){try{if(!("Notification" in window)||Notification.permission!=="granted")return;const o={body,tag,icon:"icon-192.png",badge:"icon-192.png",renotify:true,requireInteraction:true};if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}});else new Notification(title,o)}catch(e){}}
function alShow(title,sub,id){const el=$("#alarmBox");if(!el)return;el.innerHTML=`<div class="eyebrow">Es la hora</div><h3 style="margin:4px 0">${esc(title)}</h3><p class="mute small" style="margin:0 0 10px">${esc(sub)}</p><div class="row">${id?`<button class="btn pri" data-act="alDone" data-id="${id}">Hecho</button><button class="btn" data-act="alSnooze" data-id="${id}">Posponer 10 min</button>`:""}<button class="btn" data-act="alClose">${id?"Cerrar":"Detener"}</button></div>`;el.hidden=false;let n=0;alTone();alQuiet();alRing=setInterval(()=>{if(++n>=20)return alQuiet();alTone()},1500);clearTimeout(alShow.t);alShow.t=setTimeout(alStop,300000)}
function alFire(m){alCur=m.id;const d=today();AL.fired[d]=AL.fired[d]||{};AL.fired[d][m.id]=Date.now();for(const k in AL.fired)if(k!==d)delete AL.fired[k];delete AL.snooze[m.id];alSave();alShow(m.name,(m.time||"")+" · "+m.cat+" · "+m.xp+" XP",m.id);alNotify("Ascenso · es la hora",m.name,"m-"+m.id)}
function alCheck(){try{if(!AL.on||!S.onboard||alCur)return;const d=today(),now=new Date(),nm=now.getHours()*60+now.getMinutes(),done=S.done[d]||{},fired=AL.fired[d]||{};for(const m of dayMissions(d)){if(!m.time||done[m.id]||m.archived)continue;const sn=AL.snooze[m.id];if(sn){if(sn.d!==d){delete AL.snooze[m.id];alSave()}else{if(Date.now()>=sn.at)return alFire(m);continue}}if(fired[m.id])continue;const[h,mi]=m.time.split(":").map(Number),t=h*60+mi;if(nm>=t&&nm-t<=15)return alFire(m)}}catch(e){}}
setInterval(alCheck,15000);let dayNow=today();setInterval(()=>{if(today()!==dayNow){dayNow=today();if(!view.form&&!view.log)render()}},30000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")alCheck()});

function ptReport(p){const k=ptStats(p);return["Informe de seguimiento · "+CFG.name,"Datos registrados por la propia persona. No es una ficha clínica ni un diagnóstico.","Paciente: "+(p.name||"Sin nombre")+" ("+p.email+")","Fecha: "+fmtDate(today()),"Período: últimos 14 días","Días con hábitos cumplidos: "+k.act+" de 14","Sesiones registradas: "+k.ss.length+" ("+k.ss.filter(x=>x.type==="fuerza").length+" de fuerza, "+k.ss.filter(x=>x.result==="completa").length+" completas)","Esfuerzo percibido promedio (0 a 10): "+k.avgB,"Dolor promedio (0 a 10): "+k.avgP+(k.maxP!==null?" · máximo: "+k.maxP:""),"Sesiones con síntomas de alerta: "+k.alerts,"Etapa del plan de fuerza: "+(p.stage??"—")+" de 6"+(p.hold?" · PLAN EN PAUSA desde "+fmtDate(p.hold.at)+" por "+(p.hold.kind==="sintomas"?"síntomas de alerta":"dolor alto o nuevo"):""),...(p.senior?["Versión adaptada: sí · "+(p.seniorOk&&p.seniorOk.by?"avance más allá de la etapa "+SCAP+" autorizado por "+p.seniorOk.by+" el "+fmtDate(p.seniorOk.at):"avance limitado a la etapa "+SCAP+" (sin autorización registrada)")]:[]),"Cuestionario previo: "+(k.flags===null?"sin responder":k.flags===0?"todas No":"Sí en: "+p.parq.map((v,i)=>v?PARQ[i]:"").filter(Boolean).join(" | ")+(p.cleared?" · autorizado el "+fmtDate(p.cleared)+(p.clearedBy?" por "+p.clearedBy:""):" · sin autorización registrada")),"Notas del paciente:",...k.ss.filter(x=>x.note).map(x=>"  - "+fmtDate(x.date)+": "+x.note)].join("\n")}

 if(view.fb7)return`<form class="card" id="fb7Form"><h3>Cuéntanos cómo te fue</h3><p class="mute small">Cinco preguntas, dos minutos. Responde las que quieras. No escribas datos de salud ni de otras personas.</p>${FB7.map((q,i)=>`<label>${q}<textarea class="fb7q" data-i="${i}" id="fb7q${i}" rows="2" maxlength="500">${esc(FBD.q[i])}</textarea></label>`).join("")}<div class="row"><button class="btn pri" type="submit">Enviar respuestas</button><button class="btn" type="button" data-act="fb7Skip">Ahora no</button></div></form>`;
 return`<div class="banner">Llevas una semana con ${CFG.name}. ¿Nos cuentas cómo te fue? <button class="link tap" data-act="fb7Open">Responder 5 preguntas</button> · <button class="link tap" data-act="fb7Skip">Ahora no</button></div>`}

document.addEventListener("input",e=>{const t=e.target;if(t.id==="fbTxt")FBD.txt=t.value;else if(t.classList&&t.classList.contains("fb7q"))FBD.q[+t.dataset.i]=t.value});

 if(id==="fbForm"){const t=$("#fbTxt").value.trim();if(t.length<5)return toast("Escribe tu comentario antes de enviarlo.");btn.disabled=true;const r=await fbSend("libre",{text:t});btn.disabled=false;if(r.ok===false)return toast(r.msg);FBD.txt="";const x=$("#fbTxt");if(x)x.value="";toast("Gracias. Tu comentario llegó.")}
 else{const a=FB7.map((q,i)=>(($("#fb7q"+i)||{}).value||"").trim());if(!a.some(x=>x.length))return toast("Responde al menos una pregunta.");btn.disabled=true;const r=await fbSend("d7",{q:FB7,a});btn.disabled=false;if(r.ok===false)return toast(r.msg);FBD.q=["","","","",""];S.fb7=today();view.fb7=false;save();render();toast("Gracias por responder.")}});

 return`<div style="border-top:1px dashed var(--line2);margin-top:10px;padding-top:10px"><div class="eyebrow">Solo administrador</div>${ok?`<div class="row" style="margin-top:6px"><button class="btn" data-act="rvSet" data-id="${id}" data-ok="0">Quitar validación</button></div>`:`<label style="margin-top:6px">Nombre y registro que verá el usuario<input id="rvBy" maxlength="80" value="${esc(by)}" placeholder="Klgo. Nombre Apellido, Reg. N.º"></label><div class="row" style="margin-top:8px"><button class="btn pri" data-act="rvSet" data-id="${id}" data-ok="1">Validar ilustración y técnica</button></div>`}</div>`}

/* ===== Avisos con la app cerrada (Web Push) ===== */
let PUSH={state:"off",busy:false};
function b64u(x){const p="=".repeat((4-x.length%4)%4),b=atob((x+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function swReady(){return Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error("sw")),1500))])}
function pushSupported(){return"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window}
function isIOS(){return/iPhone|iPad|iPod/i.test(navigator.userAgent)}
function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true}
async function pushRegister(){const r=await swReady();const{data:key,error}=await sb.rpc("push_public_key");if(error||!key)throw new Error("key");
 let sub=await r.pushManager.getSubscription();
 if(sub){const cur=sub.options&&sub.options.applicationServerKey?btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""):null;if(cur&&cur!==key){await sub.unsubscribe();sub=null}}
 if(!sub){const opt={userVisibleOnly:true,applicationServerKey:b64u(key)};try{sub=await r.pushManager.subscribe(opt)}catch(e1){await new Promise(z=>setTimeout(z,1500));try{const old=await r.pushManager.getSubscription();if(old)await old.unsubscribe()}catch(e3){}sub=await r.pushManager.subscribe(opt)}}
 const j=sub.toJSON();let tz="America/Santiago";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
 const{error:e2}=await sb.rpc("push_subscribe",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_tz:tz});if(e2)throw new Error("save")}
async function pushEnable(){if(PUSH.busy)return;if(!pushSupported())return toast("Este navegador no admite avisos con la app cerrada.");PUSH.busy=true;render();
 try{const perm=await Notification.requestPermission();if(perm!=="granted"){PUSH.state=perm==="denied"?"denied":"off";toast("Sin permiso de notificaciones no puedo avisarte con la app cerrada.")}
  else{await pushRegister();AL.push=true;alSave();PUSH.state="on";PUSH.err="";toast("Listo: te avisaré aunque la app esté cerrada")}}
 catch(e){PUSH.state="off";PUSH.err=((e&&e.name)||"Error")+": "+String((e&&e.message)||e).slice(0,160);toast("No se pudo activar los avisos. El detalle quedó en pantalla.")}
 PUSH.busy=false;render()}
async function pushDisable(){if(!pushSupported())return;try{const r=await swReady(),sub=await r.pushManager.getSubscription();if(sub){if(session)await sb.rpc("push_set_enabled",{p_endpoint:sub.endpoint,p_value:false});await sub.unsubscribe()}}catch(e){}AL.push=false;alSave();PUSH.state="off"}
async function pushSync(){try{if(!pushSupported()){PUSH.state="nosup"}else if(Notification.permission==="denied"){PUSH.state="denied"}else if(AL.push&&session&&Notification.permission==="granted"){await pushRegister();PUSH.state="on"}else PUSH.state="off"}catch(e){PUSH.state="off"}if((tab==="ajustes"||tab==="dia"||tab==="misiones")&&session&&S.onboard&&!view.form)render()}
function vPush(){const st=PUSH.state,needInstall=isIOS()&&!isStandalone();
 return`<div class="card"><h3>Avisos con la app cerrada</h3><p class="mute">Te llega una notificación a la hora de cada misión aunque no tengas Ascenso abierta, con la opción de posponer 10 minutos.</p>
 <p>Estado en este dispositivo: <b>${st==="on"?"activados":st==="denied"?"bloqueados por el teléfono":st==="nosup"?"no disponibles en este navegador":"desactivados"}</b></p>
 ${needInstall?`<div class="banner warn">En iPhone primero instala Ascenso en tu pantalla de inicio (Compartir → Agregar a inicio) y ábrela desde el ícono. Recién ahí se pueden activar.</div>`:st==="nosup"?"":st==="denied"?`<p class="mute small">Para desbloquearlos, abre los ajustes del teléfono → Notificaciones → Ascenso y permítelas.</p>`:`<div class="row">${st==="on"?`<button class="btn" data-act="pushOff">Desactivar en este dispositivo</button>`:`<button class="btn pri" data-act="pushOn" ${PUSH.busy?"disabled":""}>${PUSH.busy?"Activando…":"Activar avisos"}</button>`}</div>`}
 ${PUSH.err?`<p class="small" style="color:var(--bad)">Último intento falló. Prueba apagando el wifi y usando datos móviles. Detalle técnico: ${esc(PUSH.err)}</p>`:""}<p class="mute small">El aviso usa el sonido de notificaciones de tu teléfono; el tono de alarma propio solo suena con la app abierta. Se activa por dispositivo: repítelo en cada teléfono que uses. Si el teléfono está en silencio o en modo «No molestar», no sonará.</p></div>`}
setTimeout(()=>{A.pushOn=()=>pushEnable();A.pushOff=async()=>{await pushDisable();render();toast("Avisos desactivados en este dispositivo")}},0);
</script>
<script>
(function(){
 if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
 var standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
 var mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
 var fromMail=/access_token|type=|error=|code=/.test(location.hash+location.search);
 var skip=false;try{skip=Date.now()-(+localStorage.getItem("ascenso.web")||0)<6048e5}catch(e){}
 if(standalone||!mobile||fromMail||skip)return;
 var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent),dp=null;
 var o=document.createElement("div");o.id="installGate";
 o.style.cssText="position:fixed;inset:0;z-index:99999;background:#0b0f17;color:#e8ecf4;display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit";
 o.innerHTML='<div style="max-width:420px;text-align:center"><img src="icon-192.png" alt="" width="96" height="96" style="border-radius:22px"><h1 style="margin:18px 0 8px;font-size:28px">Instala Ascenso</h1><p style="opacity:.8;line-height:1.5;margin:0 0 20px">Ascenso funciona como aplicación en tu teléfono. Instálala y ábrela desde tu pantalla de inicio.</p><div id="igSteps" style="text-align:left;background:#141a26;border:1px solid #232b3b;border-radius:14px;padding:16px;line-height:1.6;font-size:16px"></div><button id="igBtn" style="display:none;margin-top:18px;width:100%;padding:16px;border:0;border-radius:12px;background:#ff9a3c;color:#16110a;font-size:18px;font-weight:700">Instalar aplicación</button><button id="igSkip" style="margin-top:14px;width:100%;min-height:48px;padding:12px;border:1px solid #6b7896;border-radius:12px;background:none;color:#e8ecf4;font-size:16px">Continuar sin instalar</button></div>';
 function mount(){document.body.appendChild(o);
  var st=o.querySelector("#igSteps"),bt=o.querySelector("#igBtn");
  st.innerHTML=ios?'<b>En iPhone (Safari):</b><br>1. Toca el botón Compartir (cuadrado con flecha).<br>2. Elige «Agregar a inicio».<br>3. Abre Ascenso desde el ícono nuevo.':'<b>En Android (Chrome):</b><br>1. Toca «Instalar aplicación» aquí abajo.<br>2. Si no aparece, abre el menú ⋮ y elige «Instalar aplicación» o «Agregar a pantalla principal».<br>3. Abre Ascenso desde el ícono nuevo.';
  if(dp)bt.style.display="block";
  bt.onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;bt.style.display="none"})};
  o.querySelector("#igSkip").onclick=function(e){e.preventDefault();try{localStorage.setItem("ascenso.web",String(Date.now()))}catch(x){}o.remove()};}
 window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;var b=document.getElementById("igBtn");if(b)b.style.display="block"});
 window.addEventListener("appinstalled",function(){var s=document.getElementById("igSteps");if(s)s.innerHTML="<b>Listo.</b> Abre Ascenso desde el ícono en tu pantalla de inicio."});
 if(document.body)mount();else document.addEventListener("DOMContentLoaded",mount);
})();
</script></body>
