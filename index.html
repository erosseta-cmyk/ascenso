la pierna buena y luego sube la otra.", "Para bajar, parte con la pierna débil o adolorida y luego baja la buena. Si las dos están bien, alterna la pierna que parte."], "care": "Usa siempre la baranda. Si te duele la rodilla, avísale a tu kinesiólogo."}, "tob_abecedario": {"n": "Abecedario con el tobillo", "cat": "tob", "t": ["tobillo"], "dose": "1 abecedario completo, 2 veces al día", "how": ["Siéntate con la pierna estirada y el talón apoyado, o con la pierna colgando.", "Dibuja en el aire las letras del abecedario con la punta del pie.", "Mueve solo el tobillo, no la rodilla."], "care": "Puede tirar un poco; no debería doler. Si aumenta la hinchazón, avísale a tu kinesiólogo."}, "tob_bombeo": {"n": "Bombeo de tobillo", "cat": "tob", "t": ["tobillo", "postop", "sin_carga"], "dose": "3×15, 3 veces al día", "how": ["Acuéstate o siéntate con la pierna estirada y el pie en alto si está hinchado.", "Lleva la punta del pie hacia ti lo más que puedas.", "Luego estírala hacia abajo, como apretando un acelerador."], "care": "Muévelo hasta donde no duela. Sirve también para bajar la hinchazón."}, "tob_toalla": {"n": "Recoger la toalla con los dedos", "cat": "tob", "t": ["tobillo"], "dose": "3×10, 1 vez al día", "how": ["Siéntate con el pie descalzo sobre una toalla extendida en el suelo.", "Arruga la toalla hacia ti usando solo los dedos del pie.", "Estírala de nuevo y repite."], "care": "Mantén el talón apoyado. Detente si se acalambra la planta del pie."}, "tob_banda": {"n": "Banda elástica en cuatro direcciones", "cat": "tob", "t": ["tobillo"], "dose": "2×15 por dirección, día por medio", "how": ["Siéntate con la pierna estirada y pasa una banda elástica por la planta del pie, con un extremo en cada mano.", "Empuja el pie hacia abajo contra la banda, como apretando un acelerador, y vuelve lento.", "Para las otras direcciones, amarra la banda a la pata de un mueble firme y lleva el pie hacia ti, hacia adentro y hacia afuera, siempre contra la banda."], "care": "Mueve solo el tobillo y de forma lenta. Usa la banda que te indicó tu kinesiólogo."}, "tob_puntas_una": {"n": "Pararse en puntas en una pierna", "cat": "tob", "t": ["tobillo", "aquiles"], "dose": "3×10, día por medio", "how": ["Párate frente a un mesón firme, con las manos apoyadas.", "Levanta un pie y sube en puntas con el otro lo más alto que puedas.", "Baja lento hasta apoyar el talón. Cambia de pierna."], "care": "Usa el mesón solo para el equilibrio. Si no logras subir bien, vuelve a hacerlo con las dos piernas."}, "tob_un_pie_cojin": {"n": "Equilibrio en un pie sobre un cojín", "cat": "tob", "t": ["tobillo"], "dose": "3×30 s por lado, 1 vez al día", "how": ["Pon un cojín firme en el suelo junto a un mesón.", "Párate con un pie sobre el cojín y la rodilla levemente doblada.", "Mantén la posición con las manos cerca del mesón. Cambia de pierna."], "care": "Ten siempre el mesón al alcance. Si no logras 10 segundos, hazlo en el suelo firme."}, "tob_rodilla_pared": {"n": "Rodilla a la pared", "cat": "tob", "t": ["tobillo", "aquiles"], "dose": "3×10, 2 veces al día", "how": ["Párate frente a una pared con un pie adelante, a unos 10 cm de ella.", "Lleva la rodilla de adelante hacia la pared sin despegar el talón del suelo.", "Vuelve atrás. Si tocas fácil, aleja un poco el pie."], "care": "El talón no se levanta. Debe sentirse un estiramiento, no un dolor punzante adelante del tobillo."}, "tob_estrella": {"n": "Alcances en estrella", "cat": "tob", "t": ["tobillo"], "dose": "2×5 por dirección, 1 vez al día", "how": ["Párate en una pierna junto a un mesón, con la rodilla levemente doblada.", "Con la punta del otro pie toca el suelo lo más lejos que puedas: adelante, al lado y atrás.", "Vuelve al centro entre cada toque. Cambia de pierna."], "care": "Es un ejercicio avanzado. Hazlo solo cuando tu kinesiólogo lo indique y con el mesón al alcance."}, "atx_dedo_nariz": {"n": "Dedo a la nariz", "cat": "coord", "t": ["ataxia"], "dose": "2×10 por brazo, 1 vez al día", "how": ["Siéntate con la espalda apoyada y estira un brazo hacia el lado.", "Lleva lentamente la punta del dedo índice a tu nariz.", "Vuelve a estirar el brazo. Hazlo despacio y con precisión, no rápido."], "care": "Si te cuesta, hazlo primero con los ojos abiertos y mirando tu dedo."}, "atx_talon_rodilla": {"n": "Talón a la rodilla", "cat": "coord", "t": ["ataxia"], "dose": "2×10 por pierna, 1 vez al día", "how": ["Acuéstate de espalda con las piernas estiradas.", "Lleva lentamente el talón de una pierna hasta la rodilla de la otra.", "Deslízalo por la canilla hasta el tobillo y vuelve a estirar la pierna."], "care": "Hazlo lento, mirando el movimiento. Para descansar, deja ambas piernas apoyadas."}, "atx_frenkel": {"n": "Pie a las marcas del suelo", "cat": "coord", "t": ["ataxia"], "dose": "2×10 por pierna, 1 vez al día", "how": ["Siéntate en una silla firme y pega en el suelo tres marcas con cinta: adelante, al lado y atrás de cada pie.", "Lleva un pie hasta una marca, apóyalo justo encima y vuelve al centro.", "Sigue con las otras marcas y luego cambia de pierna."], "care": "Hazlo lento y mirando las marcas. La precisión importa más que la velocidad."}, "atx_alcances_sentado": {"n": "Alcances sentado sin respaldo", "cat": "coord", "t": ["ataxia"], "dose": "2×10, 1 vez al día", "how": ["Siéntate en el borde de una cama o silla firme, sin apoyar la espalda y con los pies apoyados.", "Estira un brazo hacia adelante o hacia el lado para tocar un objeto o la mano de alguien.", "Vuelve al centro con la espalda recta y repite hacia otro lado."], "care": "Ten alguien cerca o una superficie a los lados. Alcanza solo hasta donde no pierdas el equilibrio."}, "atx_cuadrupedia": {"n": "Cuadrupedia con brazo y pierna", "cat": "lum", "t": ["ataxia", "lumbar"], "dose": "2×8 por lado, 1 vez al día", "how": ["Ponte en cuatro apoyos sobre una colchoneta, manos bajo los hombros y rodillas bajo las caderas.", "Estira lentamente un brazo hacia adelante y la pierna contraria hacia atrás.", "Mantén 3 segundos sin que la cadera se ladee y vuelve. Cambia de lado."], "care": "Si te desequilibras, estira solo el brazo o solo la pierna. Detente si te duele la espalda."}, "atx_marcha_marcas": {"n": "Caminar pisando marcas", "cat": "coord", "t": ["ataxia"], "dose": "4 pasadas, 1 vez al día", "how": ["Pega en el suelo de un pasillo marcas con cinta, separadas a la distancia de un paso.", "Camina pisando cada marca, despacio y mirando dónde pones el pie.", "Al terminar, date vuelta despacio y repite."], "care": "Hazlo junto a una pared o con alguien al lado. Usa zapatos firmes."}, "atx_marcha_lugar": {"n": "Marcha en el lugar afirmado", "cat": "coord", "t": ["ataxia"], "dose": "3×30 s, 1 vez al día", "how": ["Párate frente a un mesón firme, con las manos apoyadas.", "Levanta una rodilla y después la otra, como marchando en el lugar.", "Lleva un ritmo parejo y apoya bien cada pie."], "care": "Usa el mesón todo lo que necesites. Si te mareas o te cansas, siéntate."}, "aq_isometrico": {"n": "Sostener en puntas", "cat": "tob", "t": ["aquiles"], "dose": "5×45 s, 1 o 2 veces al día", "how": ["Párate frente a un mesón, con las manos apoyadas solo para el equilibrio.", "Sube en puntas de pies hasta la mitad de la altura que alcanzas.", "Mantén la posición sin moverte el tiempo indicado y baja lento."], "care": "Puede molestar un poco mientras lo haces. Si a la mañana siguiente el tendón está más adolorido o rígido que de costumbre, avísale a tu kinesiólogo antes de seguir."}, "aq_excentrico_recto": {"n": "Bajar el talón desde un escalón, rodilla estirada", "cat": "tob", "t": ["aquiles"], "dose": "3×15, 2 veces al día", "how": ["Párate en el borde de un escalón con la parte delantera de los pies, afirmado de la baranda.", "Sube en puntas con las dos piernas.", "Pasa el peso a la pierna afectada y baja el talón lentamente, en 3 segundos, con la rodilla estirada. Vuelve a subir con las dos."], "care": "Puede molestar un poco mientras lo haces. Si el dolor es en el talón, donde se inserta el tendón, no bajes más allá del nivel del escalón. Si a la mañana siguiente estás peor, avísale a tu kinesiólogo."}, "aq_excentrico_flexo": {"n": "Bajar el talón desde un escalón, rodilla doblada", "cat": "tob", "t": ["aquiles"], "dose": "3×15, 2 veces al día", "how": ["Párate en el borde de un escalón con la parte delantera de los pies, afirmado de la baranda.", "Sube en puntas con las dos piernas y dobla un poco las rodillas.", "Pasa el peso a la pierna afectada y baja el talón lentamente, en 3 segundos, manteniendo la rodilla doblada. Vuelve a subir con las dos."], "care": "Puede molestar un poco mientras lo haces. Si el dolor es en el talón, no bajes más allá del nivel del escalón. Si a la mañana siguiente estás peor, avísale a tu kinesiólogo."}, "aq_sentado": {"n": "Pararse en puntas sentado", "cat": "tob", "t": ["aquiles"], "dose": "3×15, día por medio", "how": ["Siéntate en una silla con los pies apoyados y las rodillas dobladas en ángulo recto.", "Pon un peso sobre los muslos, cerca de las rodillas: una mochila o bolsas con agua.", "Levanta los talones lo más alto que puedas y bájalos lento."], "care": "Usa el peso que te indicó tu kinesiólogo. Detente si aparece un dolor punzante."}, "aq_elongacion": {"n": "Elongación de pantorrilla en la pared", "cat": "tob", "t": ["aquiles"], "dose": "3×30 s por lado, 2 veces al día", "how": ["Párate frente a una pared con las manos apoyadas y un pie atrás.", "Con el talón de atrás apoyado y la rodilla estirada, lleva la cadera hacia la pared hasta sentir que tira la pantorrilla.", "Mantén sin rebotes. Repite con la rodilla de atrás un poco doblada."], "care": "Debe sentirse un estiramiento suave, no dolor. Si el dolor es en el talón, consúltalo antes con tu kinesiólogo."}, "aq_saltitos": {"n": "Saltitos en el lugar", "cat": "tob", "t": ["aquiles"], "dose": "3×20, 2 o 3 veces por semana", "how": ["Párate con los pies al ancho de las caderas, cerca de un mesón.", "Da saltitos cortos y rápidos en puntas de pies, apenas despegando del suelo.", "Aterriza suave, en puntas, sin apoyar los talones de golpe."], "care": "Es una etapa avanzada. Hazlo solo cuando tu kinesiólogo lo indique, y nunca si el tendón duele al caminar."}, "otr_respiracion": {"n": "Respiración diafragmática", "cat": "tor", "t": ["postop", "lumbar", "sin_carga"], "dose": "3×10 respiraciones, 3 veces al día", "how": ["Acuéstate o siéntate cómodo, con una mano en el pecho y otra en el abdomen.", "Toma aire por la nariz, lento, inflando el abdomen sin mover casi el pecho.", "Bota el aire por la boca, despacio, como apagando una vela lejana."], "care": "Si te mareas, respira más lento y descansa entre series."}, "otr_retraccion_cervical": {"n": "Retracción del mentón", "cat": "cerv", "t": ["cervical"], "dose": "2×10, 3 veces al día", "how": ["Siéntate derecho, mirando al frente.", "Lleva el mentón hacia atrás, como haciendo papada, sin bajar ni subir la cabeza.", "Mantén 3 segundos y relaja."], "care": "Es un movimiento corto. Si aparece dolor u hormigueo que baja al brazo, detente y avísale a tu kinesiólogo."}, "otr_pendular": {"n": "Péndulo de hombro", "cat": "mmss", "t": ["hombro", "postop"], "dose": "3×30 s, 3 veces al día", "how": ["Apoya la mano sana en una mesa e inclina el tronco hacia adelante.", "Deja colgar relajado el brazo afectado.", "Balancea el cuerpo suavemente para que el brazo se mueva en pequeños círculos, sin usar la fuerza del hombro."], "care": "El brazo cuelga suelto; el movimiento viene del cuerpo. No debería doler."}, "otr_cuadriceps": {"n": "Apretar el muslo con toalla bajo la rodilla", "cat": "mmii", "t": ["postop", "muletas", "sin_carga"], "dose": "3×10 de 5 s, 3 veces al día", "how": ["Siéntate o acuéstate con la pierna estirada y una toalla enrollada bajo la rodilla.", "Aprieta la rodilla contra la toalla, tensando el muslo y llevando la punta del pie hacia ti.", "Mantén 5 segundos y relaja."], "care": "Debe sentirse trabajar el muslo, sin dolor en la rodilla."}, "otr_pierna_estirada": {"n": "Levantar la pierna estirada", "cat": "mmii", "t": ["postop", "muletas", "sin_carga"], "dose": "3×10, 2 veces al día", "how": ["Acuéstate de espalda con una rodilla doblada y la otra pierna estirada.", "Aprieta el muslo de la pierna estirada y levántala hasta la altura de la otra rodilla.", "Baja lento sin dejarla caer."], "care": "La rodilla de la pierna que levantas no se dobla. Si te duele la espalda, levanta menos."}, "eq_transfer_peso": {"n": "Pasar el peso de un pie al otro", "cat": "eq", "t": ["caidas"], "dose": "2×10, 2 veces al día", "how": ["Párate de lado junto a un mesón firme, con los pies separados al ancho de las caderas y las manos apoyadas en él.", "Lleva lentamente el peso del cuerpo hacia el pie derecho, sin levantar el izquierdo, y mantén 2 segundos.", "Vuelve al centro y repite hacia el otro lado. Eso cuenta como una repetición."], "care": "Mueve la cadera, no el tronco: los hombros quedan sobre los pies. Si te mareas o pierdes el equilibrio, apóyate y descansa."}, "eq_giros": {"n": "Girar dando varios pasos", "cat": "eq", "t": ["caidas"], "dose": "4–6 giros por lado, 1 vez al día", "how": ["Párate en un espacio despejado, cerca de una pared o de otra persona.", "Para darte vuelta, da 4 o 5 pasos cortos describiendo un semicírculo, sin pivotear sobre un pie.", "Detente, respira y gira hacia el otro lado de la misma forma."], "care": "Nunca gires de golpe sobre un solo pie: es una causa frecuente de caídas. Si te mareas, espera de pie con apoyo hasta que pase."}, "eq_doble_tarea": {"n": "Caminar nombrando objetos", "cat": "eq", "t": ["caidas", "vert"], "dose": "2 min, 1 vez al día", "how": ["Camina dentro de tu casa, por un pasillo despejado y a ritmo cómodo.", "Mientras caminas, nombra en voz alta los objetos que ves, o di palabras que empiecen con una letra.", "Si te cuesta, camina más lento; no te detengas a pensar en mitad del pasillo."], "care": "Hazlo solo donde no haya alfombras sueltas ni cables. Si pierdes el equilibrio o te detienes seguido, vuelve a caminar sin la tarea y avísale a tu kinesiólogo."}, "ves_pelota_pared": {"n": "Pelota contra la pared siguiéndola con la vista", "cat": "ves", "t": ["vert"], "dose": "3×10 lanzamientos, 1 vez al día", "how": ["Párate frente a una pared, a un metro de distancia, con una pelota liviana.", "Lánzala contra la pared y atrápala, siguiéndola siempre con la mirada.", "Alterna: 10 con la mano derecha, 10 con la izquierda y 10 con ambas manos."], "care": "Si aparece mareo, haz los lanzamientos más lentos o sentado. Si el mareo dura más de 15 minutos, detente y avísale a tu kinesiólogo."}, "mmii_ext_rodilla": {"n": "Extensión de rodilla sentado", "cat": "mmii", "t": ["caidas", "postop", "muletas", "sin_carga"], "dose": "2×10 por lado, 1 vez al día", "how": ["Siéntate derecho en una silla firme, con los pies apoyados.", "Estira una rodilla hasta dejar la pierna recta, con la punta del pie hacia ti.", "Mantén 2 segundos y baja lento. Haz todas las repeticiones y cambia de pierna."], "care": "No balancees la pierna. Si duele la rodilla, sube solo hasta donde no duela."}, "mmii_abd_cadera": {"n": "Abducción de cadera de pie con apoyo", "cat": "mmii", "t": ["caidas"], "dose": "2×10 por lado, 1 vez al día", "how": ["Párate de lado a un mesón firme y apóyate con una mano.", "Lleva la pierna de afuera hacia el costado, recta y con la punta del pie mirando al frente.", "Vuelve lento al centro. Haz todas las repeticiones y cambia de lado."], "care": "No inclines el tronco hacia el otro lado: el movimiento es corto. Si tienes prótesis de cadera, hazlo solo si tu kinesiólogo lo autorizó."}, "mmii_ext_cadera": {"n": "Extensión de cadera de pie con apoyo", "cat": "mmii", "t": ["caidas"], "dose": "2×10 por lado, 1 vez al día", "how": ["Párate frente a un mesón firme, con las dos manos apoyadas.", "Lleva una pierna recta hacia atrás, sin arquear la espalda.", "Mantén 1 segundo y vuelve lento. Haz todas las repeticiones y cambia de pierna."], "care": "El movimiento es pequeño; si la espalda se arquea, estás subiendo demasiado. Detente si duele la espalda baja."}, "mmii_almeja": {"n": "Almeja acostado de lado", "cat": "mmii", "t": ["lumbar", "muletas"], "dose": "3×12 por lado, día por medio", "how": ["Acuéstate de lado, con las caderas y rodillas dobladas y los pies juntos.", "Sin separar los pies, abre la rodilla de arriba como una almeja.", "Baja lento. Haz todas las repeticiones y cambia de lado."], "care": "La pelvis no se va hacia atrás: abre solo hasta donde la mantengas quieta. Si te operaron la cadera, consulta antes de hacerlo."}, "mmii_talon_cama": {"n": "Deslizar el talón en la cama", "cat": "mmii", "t": ["postop", "sin_carga"], "dose": "2×10 por lado, 2 veces al día", "how": ["Acuéstate de espalda en la cama, con las piernas estiradas.", "Desliza un talón hacia los glúteos, doblando cadera y rodilla, sin despegarlo del colchón.", "Vuelve a estirar la pierna lentamente y repite. Luego cambia de pierna."], "care": "Hazlo despacio y sin forzar el final del movimiento. Si tienes calambres, detente, estira la pierna y descansa."}, "mmii_basculacion": {"n": "Basculación pélvica sentado", "cat": "lum", "t": ["lumbar"], "dose": "2×10, 1 vez al día", "how": ["Siéntate en el borde de una silla firme, con los pies apoyados y las manos en los muslos.", "Arquea suavemente la espalda baja, llevando la pelvis hacia adelante.", "Luego redondea la espalda baja, llevando la pelvis hacia atrás. Eso es una repetición."], "care": "Es un movimiento pequeño y sin rebotes. Si aparece dolor que baja por la pierna, detente y avísale a tu kinesiólogo."}, "mmss_remo": {"n": "Remo con banda elástica", "cat": "mmss", "t": ["hombro", "muletas", "sin_carga"], "dose": "2×10, día por medio", "how": ["Siéntate derecho y fija la banda a una manilla firme frente a ti, a la altura del pecho.", "Toma un extremo con cada mano y tira hacia atrás, juntando los omóplatos y con los codos pegados al cuerpo.", "Mantén 2 segundos y vuelve lento."], "care": "Los hombros no suben hacia las orejas. Revisa que la banda esté bien fijada antes de tirar."}, "mmss_elev_escapular": {"n": "Elevar los brazos en diagonal sin carga", "cat": "mmss", "t": ["hombro", "sin_carga"], "dose": "2×10, 1 vez al día", "how": ["Siéntate o párate derecho, con los brazos a los costados y los pulgares hacia arriba.", "Sube los brazos hacia adelante y un poco hacia afuera, en diagonal, hasta la altura de los hombros.", "Baja lentamente."], "care": "No pases la altura de los hombros. Si duele más de 3 en una escala de 0 a 10, sube menos."}, "mmss_rot_externa": {"n": "Rotación externa de hombro con banda", "cat": "mmss", "t": ["hombro", "muletas", "sin_carga"], "dose": "2×15, día por medio", "how": ["Siéntate o párate con el codo pegado al cuerpo y doblado en ángulo recto.", "Toma la banda con ambas manos, frente al abdomen.", "Abre los antebrazos hacia afuera sin despegar los codos, y vuelve lento."], "care": "Usa una banda suave. El movimiento sale del hombro, no del tronco: no te gires."}, "mmss_brazos": {"n": "Bíceps y tríceps sentado con botellas", "cat": "mmss", "t": ["hombro", "muletas", "fuerza", "sin_carga"], "dose": "3×12, día por medio", "how": ["Siéntate derecho con una botella con agua en cada mano.", "Bíceps: con los codos pegados al cuerpo, sube las botellas hacia los hombros y baja lento.", "Tríceps: inclina el tronco hacia adelante con la espalda recta, deja el codo pegado al costado y doblado, y estira el codo llevando la botella hacia atrás. Vuelve lento."], "care": "Usa poco peso al comienzo (medio litro). Respira durante el movimiento y no balancees el tronco. No subas los brazos por sobre la cabeza."}, "res_caminata_bloques": {"n": "Caminata por bloques", "cat": "res", "t": ["caidas", "acond"], "dose": "Bloques 4–5 min + 2 min pausa, diario", "how": ["Camina a ritmo cómodo durante el tiempo indicado por tu kinesiólogo.", "Descansa 2 minutos, sentado o de pie con apoyo.", "Repite los bloques. Debes poder hablar mientras caminas."], "care": "Si el cansancio llega a 6 de 10, te falta el aire o te sientes mareado, detente y descansa. No alargues los bloques por tu cuenta."}, "res_bicicleta": {"n": "Bicicleta estática", "cat": "res", "t": ["postop", "acond"], "dose": "5–15 min suave, 1 vez al día", "how": ["Ajusta el asiento para que la rodilla quede apenas doblada con el pedal abajo.", "Pedalea a ritmo suave durante el tiempo indicado, con la resistencia en lo más bajo.", "Aumenta el tiempo o la resistencia solo cuando tu kinesiólogo lo indique."], "care": "Si no completas la vuelta del pedal sin dolor, haz balanceos cortos adelante y atrás. Detente si aumenta la hinchazón o el dolor."}, "res_baston": {"n": "Marcha con bastón", "cat": "res", "t": ["postop", "caidas"], "dose": "5–10 min, 2 veces al día", "how": ["Lleva el bastón en la mano del lado contrario a la pierna afectada.", "Avanza el bastón y la pierna afectada al mismo tiempo.", "Luego avanza la pierna sana. Mira al frente, no a tus pies."], "care": "Apoya la pierna afectada solo con la carga que te autorizaron. Camina por lugares despejados y con calzado cerrado.", "load": true}, "res_muletas": {"n": "Marcha en 3 puntos con muletas", "cat": "res", "t": ["postop", "muletas"], "dose": "Según indicación", "how": ["Adelanta las dos muletas a la vez, a un paso de distancia.", "Adelanta la pierna operada hasta la altura de las muletas, apoyando solo lo autorizado.", "Pasa la pierna sana, cargando el peso en las manos y no en las axilas."], "care": "Respeta siempre la carga autorizada por tu traumatólogo. Si sientes dolor nuevo, hormigueo o inestabilidad, detente y avisa.", "load": true}, "ves_x2h": {"n": "Mirada fija moviendo tarjeta y cabeza (VOR x2)", "cat": "ves", "t": ["vert"], "dose": "3×30 s, 3 veces al día", "how": ["Siéntate y sostén una tarjeta con una letra a la distancia de tu brazo, frente a tus ojos.", "Mueve la tarjeta hacia un lado y, al mismo tiempo, gira la cabeza hacia el lado contrario, sin dejar de ver la letra nítida.", "Vuelve igual hacia el otro lado. Parte lento: si la letra se pone borrosa, baja la velocidad."], "care": "Es más exigente que la mirada fija simple: hazlo solo cuando tu kinesiólogo lo indique. Es normal sentir un mareo leve que pasa en pocos minutos. Si dura más de 15 minutos, si vomitas o si aparece un síntoma nuevo, detente y avísale a tu kinesiólogo."}, "ves_x1_semitandem": {"n": "Mirada fija de pie, un pie medio adelante", "cat": "ves", "t": ["vert", "caidas"], "dose": "3×30 s, 2 veces al día", "how": ["Párate de lado junto a un mesón, con un pie medio adelantado: el talón de adelante junto al arco del otro pie.", "Mira una letra pegada en la pared frente a ti, a la altura de los ojos y a un metro.", "Gira la cabeza de lado a lado sin dejar de ver la letra nítida. Cambia el pie de adelante en cada serie."], "care": "Siempre con el mesón al alcance o una persona al lado. Si pierdes el equilibrio, vuelve a la versión sentada. Es normal sentir un mareo leve que pasa en pocos minutos. Si dura más de 15 minutos, si vomitas o si aparece un síntoma nuevo, detente y avísale a tu kinesiólogo."}, "ves_ojos_cerrados": {"n": "Equilibrio con ojos cerrados, un pie medio adelante", "cat": "ves", "t": ["vert", "caidas"], "dose": "3×20 s, 1 vez al día", "how": ["Párate en una esquina de la casa o frente a un mesón, con un pie medio adelantado.", "Busca el equilibrio con los ojos abiertos y luego ciérralos.", "Mantén la posición el tiempo indicado. Abre los ojos si te tambaleas."], "care": "Hazlo solo con una pared, un mesón o una persona al alcance de la mano. Si te tambaleas mucho, hazlo con los pies juntos."}, "ves_recoger": {"n": "Agacharse a recoger un objeto sentado", "cat": "ves", "t": ["vert"], "dose": "2×5, 2 veces al día", "how": ["Siéntate en una silla firme con un objeto liviano en el suelo, delante de tus pies.", "Inclínate, recógelo y vuelve a sentarte derecho, siguiendo el objeto con la mirada.", "Déjalo de nuevo en el suelo de la misma forma. Hazlo a ritmo lento."], "care": "Sirve para que el cerebro se acostumbre a los cambios de posición. Es normal sentir un mareo leve que pasa en pocos minutos. Si dura más de 15 minutos, si vomitas o si aparece un síntoma nuevo, detente y avísale a tu kinesiólogo."}, "aq_talones_lentos": {"n": "Pararse en puntas lento (3 s arriba, 3 s abajo)", "cat": "tob", "t": ["aquiles"], "dose": "3×15, día por medio", "how": ["Párate frente a un mesón, con las manos apoyadas solo para el equilibrio.", "Sube en puntas con las dos piernas, contando 3 segundos.", "Baja contando 3 segundos hasta apoyar los talones."], "care": "Es la base del fortalecimiento del tendón. Puede molestar un poco; si a la mañana siguiente estás peor, avísale a tu kinesiólogo."}, "aq_talones_rapidos": {"n": "Pararse en puntas rápido en una pierna", "cat": "tob", "t": ["aquiles"], "dose": "3×15, día por medio", "how": ["Párate en una pierna frente a un mesón, con las manos apoyadas.", "Sube en puntas rápido, en un segundo.", "Baja controlado y repite sin pausa. Cambia de pierna."], "care": "Es una etapa avanzada, previa a los saltos. Hazlo solo cuando tu kinesiólogo lo indique y nunca si el tendón duele al caminar."}, "aq_elong_toalla": {"n": "Elongación de pantorrilla sentado con toalla", "cat": "tob", "t": ["aquiles"], "dose": "3×30 s, 2 veces al día", "how": ["Siéntate en el suelo o en la cama con la pierna estirada.", "Pasa una toalla por la planta del pie y toma un extremo con cada mano.", "Tira suavemente de la toalla hacia ti hasta sentir que se estira la pantorrilla. Mantén sin rebotes."], "care": "Debe sentirse un estiramiento suave, no dolor. Si el dolor es en el talón, consúltalo antes con tu kinesiólogo."}, "cerv_asentir": {"n": "Asentir acostado (flexión de cuello profunda)", "cat": "cerv", "t": ["cervical"], "dose": "10 de 10 s, 1 vez al día", "how": ["Acuéstate de espalda con las rodillas dobladas y la cabeza apoyada.", "Haz un 'sí' muy pequeño: lleva el mentón hacia el pecho sin despegar la cabeza.", "Mantén 10 segundos respirando normal y relaja."], "care": "El movimiento es pequeño y lento. No debería doler. Si aparece hormigueo en los brazos o mareo, detente y avísale a tu kinesiólogo."}, "cerv_isometricos": {"n": "Isométricos de cuello con la mano", "cat": "cerv", "t": ["cervical"], "dose": "5 de 5 s por dirección, 2 veces al día", "how": ["Siéntate derecho y apoya la palma en un costado de la cabeza, sobre la sien.", "Empuja la cabeza contra la mano sin moverla, con poca fuerza, durante 5 segundos. La cabeza se queda derecha.", "Repite al otro lado, luego con la mano en la frente y con la mano en la nuca."], "care": "Usa poca fuerza, como un tercio de lo que podrías. No contengas la respiración. Detente si aumenta el dolor."}, "tor_libro": {"n": "Apertura de tórax acostado de lado (libro abierto)", "cat": "tor", "t": ["lumbar", "cervical"], "dose": "2×10 por lado, 1 vez al día", "how": ["Acuéstate de lado con las rodillas dobladas y los brazos estirados al frente, una mano sobre la otra.", "Abre el brazo de arriba hacia el otro lado, siguiendo la mano con la mirada, como un libro que se abre.", "Vuelve lento a juntar las manos. Las rodillas se quedan juntas."], "care": "Abre solo hasta donde no duela. Si se duerme o se hormiguea el brazo, detente."}, "tor_extension_silla": {"n": "Extensión de espalda alta en la silla", "cat": "tor", "t": ["cervical", "sin_carga"], "dose": "2×10, 2 veces al día", "how": ["Siéntate en una silla de respaldo bajo y firme, con las manos detrás de la nuca.", "Apoya la parte alta de la espalda en el borde del respaldo.", "Lleva el pecho hacia el techo arqueando suavemente la espalda alta y vuelve."], "care": "El movimiento sale de la espalda alta, no del cuello ni de la espalda baja. Sin rebotes."}, "lum_gato_perro": {"n": "Gato y perro en cuatro apoyos", "cat": "lum", "t": ["lumbar"], "dose": "2×10, 1 o 2 veces al día", "how": ["Ponte en cuatro apoyos sobre una colchoneta: manos bajo los hombros y rodillas bajo las caderas.", "Redondea la espalda hacia el techo, llevando el mentón al pecho.", "Luego húndela suavemente, mirando al frente. Alterna lento, siguiendo la respiración."], "care": "Mueve dentro de un rango cómodo. Si te duelen las muñecas o las rodillas, ponles una toalla doblada debajo."}, "lum_bicho_muerto": {"n": "Bicho muerto", "cat": "lum", "t": ["lumbar", "fuerza"], "dose": "2×8 por lado, día por medio", "how": ["Acuéstate de espalda con las caderas y rodillas dobladas en ángulo recto y los brazos estirados hacia el techo.", "Aprieta suavemente el abdomen para que la espalda baja no se despegue del suelo.", "Baja un brazo hacia atrás y la pierna contraria hacia adelante, lento. Vuelve y cambia de lado."], "care": "Si la espalda baja se arquea, baja menos el brazo y la pierna. Respira durante todo el ejercicio."}, "lum_activacion": {"n": "Activación abdominal profunda acostado", "cat": "lum", "t": ["lumbar", "postop", "muletas", "sin_carga"], "dose": "10 de 10 s, 1 vez al día", "how": ["Acuéstate de espalda con las rodillas dobladas y los dedos sobre los huesos de la cadera, hacia adentro.", "Bota el aire y mete suavemente el ombligo hacia la espalda, sin mover la pelvis.", "Mantén 10 segundos respirando normal y relaja."], "care": "Es una contracción suave, no un apriete fuerte. Si contienes la respiración, estás apretando demasiado."}, "lum_extension_prono": {"n": "Extensión de espalda boca abajo", "cat": "lum", "t": ["lumbar"], "dose": "2×10, 2 veces al día", "how": ["Acuéstate boca abajo con las manos apoyadas al lado de los hombros.", "Estira los brazos para levantar el pecho, dejando la cadera apoyada en el suelo y la espalda baja relajada.", "Mantén 1 segundo arriba y baja lento."], "care": "Sube solo hasta donde no duela. Si el dolor baja por la pierna o aumenta, detente y avísale a tu kinesiólogo."}, "tob_ojos_cerrados": {"n": "En un pie con ojos cerrados", "cat": "tob", "t": ["tobillo"], "dose": "3×20 s por lado, 1 vez al día", "how": ["Párate en un pie frente a un mesón, con la rodilla levemente doblada.", "Cuando tengas el equilibrio, cierra los ojos.", "Mantén la posición. Abre los ojos si te tambaleas. Cambia de pierna."], "care": "Ten siempre el mesón al alcance de la mano. Si no logras 10 segundos, vuelve a hacerlo con los ojos abiertos."}, "tob_un_pie_pelota": {"n": "En un pie lanzando una pelota", "cat": "tob", "t": ["tobillo"], "dose": "3×10 por pierna, 1 vez al día", "how": ["Párate en un pie a un metro de una pared, con la rodilla levemente doblada.", "Lanza una pelota liviana contra la pared y atrápala sin apoyar el otro pie.", "Varía la altura y el lado de los lanzamientos. Cambia de pierna."], "care": "Entrena los reflejos del tobillo. Hazlo en un lugar despejado y con calzado. Si apoyas seguido el otro pie, vuelve al equilibrio sin pelota."}, "tob_saltos_laterales": {"n": "Saltos laterales sobre una línea", "cat": "tob", "t": ["tobillo"], "dose": "3×10, 2 o 3 veces por semana", "how": ["Pon una cinta en el suelo y párate al lado, con los pies juntos.", "Salta hacia el otro lado de la línea y vuelve, con saltos cortos.", "Aterriza suave en la parte delantera de los pies, con las rodillas un poco dobladas."], "care": "Es una etapa avanzada. Hazlo solo cuando tu kinesiólogo lo indique y detente si el tobillo duele o se siente inestable."}, "tob_aterrizaje": {"n": "Saltar y caer en un pie", "cat": "tob", "t": ["tobillo"], "dose": "2×6 por pierna, 2 o 3 veces por semana", "how": ["Párate en dos pies sobre una superficie firme.", "Da un salto corto hacia adelante y cae sobre un solo pie, con la rodilla levemente doblada.", "Mantén el equilibrio 3 segundos antes de apoyar el otro pie."], "care": "Es el último paso antes de volver al deporte. Hazlo solo cuando tu kinesiólogo lo indique. La rodilla no debe irse hacia adentro al caer."}, "tob_puntas_talones": {"n": "Caminar en puntas", "cat": "tob", "t": ["tobillo", "caidas"], "dose": "2 pasadas de 5 metros, 1 vez al día", "how": ["Camina por un pasillo en puntas de pies, con los talones elevados.", "Mantén el cuerpo derecho y da pasos cortos.", "Hazlo junto a una pared o un mesón."], "care": "Si pierdes el equilibrio, apóyate en la pared. Detente si duele el tobillo o el tendón de Aquiles."}, "tob_caminar_talones": {"n": "Caminar en talones", "cat": "tob", "t": ["tobillo", "caidas"], "dose": "2 pasadas de 5 metros, 1 vez al día", "how": ["Camina por un pasillo solo sobre los talones, con la punta de los pies levantada.", "Mantén el cuerpo derecho, sin echar la cadera hacia atrás.", "Hazlo junto a una pared o un mesón."], "care": "Si pierdes el equilibrio, apóyate en la pared. Detente si duele el tobillo o la parte de adelante de la pierna."}, "fz_hip_thrust": {"n": "Hip thrust con mancuerna o mochila", "cat": "mmii", "t": ["glut", "comp", "fuerza"], "dose": "3×8–12, 2 o 3 veces por semana", "how": ["Apoya la parte alta de la espalda en el borde de un sofá o una cama firme, con las rodillas dobladas y los pies al ancho de las caderas.", "Pon una mancuerna o una mochila con peso sobre la cadera y sujétala con las manos.", "Empuja con los talones y sube la cadera hasta alinear hombros, cadera y rodillas. Aprieta los glúteos 1 segundo y baja lento."], "care": "Mentón recogido y costillas abajo: el movimiento sale de la cadera, no de arquear la espalda. Pon una toalla doblada bajo el peso.", "contra": "Dolor lumbar agudo o que baja por la pierna; cirugía reciente de cadera, columna o abdomen; embarazo avanzado.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}}, "fz_rdl": {"n": "Peso muerto rumano con mancuernas", "cat": "mmii", "t": ["glut", "comp", "fuerza"], "dose": "3×8–12, 2 o 3 veces por semana", "how": ["De pie, con los pies al ancho de las caderas y una mancuerna en cada mano frente a los muslos.", "Con las rodillas apenas dobladas, lleva la cadera hacia atrás y baja las mancuernas pegadas a las piernas, con la espalda recta.", "Baja hasta sentir tensión detrás de los muslos, más o menos bajo las rodillas, y sube apretando los glúteos."], "care": "La espalda no se redondea; si se redondea, baja menos. Las mancuernas van rozando las piernas todo el recorrido.", "contra": "Dolor lumbar con irradiación activa; osteoporosis con fracturas vertebrales; vértigo posicional (al bajar la cabeza).", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}}, "fz_zancada_inversa": {"n": "Zancada hacia atrás", "cat": "mmii", "t": ["glut", "comp", "fuerza"], "dose": "3×8–12 por pierna, 2 veces por semana", "how": ["De pie cerca de un apoyo, sin peso al comienzo o con una mancuerna en cada mano.", "Da un paso largo hacia atrás y baja hasta que la rodilla de atrás quede cerca del suelo, con el tronco levemente inclinado.", "Empuja con el talón de adelante para volver. Haz todas las repeticiones y cambia de pierna."], "care": "La rodilla de adelante sigue la línea del pie, sin irse hacia adentro.", "contra": "Artrosis o dolor de rodilla que aumenta al doblarla; tobillo inestable sin rehabilitar; mal equilibrio sin supervisión.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}}, "fz_bulgara": {"n": "Sentadilla búlgara", "cat": "mmii", "t": ["glut", "fuerza"], "dose": "3×8–12 por pierna, 2 veces por semana", "how": ["Párate a un paso largo delante de una silla firme y apoya el empeine del pie de atrás en el asiento.", "Baja doblando la rodilla de adelante hasta que el muslo quede casi horizontal, con el tronco algo inclinado.", "Sube empujando con el pie de adelante. Agrega mancuernas solo cuando domines el movimiento."], "care": "Ten una pared o un mesón al lado. Si duele la rodilla de adelante, baja menos o vuelve a la zancada hacia atrás.", "contra": "Dolor de rodilla en la parte delantera o artrosis sintomática; mal equilibrio; cirugía de rodilla o cadera sin alta para carga.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}}, "fz_step_alto": {"n": "Subir a un escalón alto", "cat": "mmii", "t": ["glut", "fuerza"], "dose": "3×8–12 por pierna, 2 veces por semana", "how": ["Ponte frente a un cajón o escalón firme de 30 a 40 cm, con una mano en la baranda si la hay.", "Apoya todo el pie en el escalón y sube empujando solo con esa pierna, sin impulsarte con la de abajo.", "Baja lento y controlado. Haz todas las repeticiones con la misma pierna y cambia."], "care": "El cajón no debe moverse. Más alto trabaja más el glúteo, pero solo si la rodilla queda alineada con el pie.", "contra": "Dolor de rodilla al subir escaleras; mal equilibrio sin baranda; vértigo activo.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}}, "fz_goblet": {"n": "Sentadilla goblet", "cat": "mmii", "t": ["glut", "comp", "fuerza"], "dose": "3×8–12, 2 o 3 veces por semana", "how": ["Sostén una mancuerna vertical frente al pecho, con los codos hacia abajo.", "Con los pies un poco más separados que las caderas, baja llevando la cadera atrás y abajo, con el pecho erguido.", "Baja hasta donde mantengas los talones apoyados y la espalda recta, y sube empujando el suelo."], "care": "Las rodillas siguen la dirección de los pies. Si te cuesta el equilibrio, hazla delante de una silla.", "contra": "Dolor de rodilla o cadera que aumenta al doblar mucho; prótesis de cadera con restricción de flexión.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}}, "fz_patada_banda": {"n": "Patada de glúteo con banda en cuatro apoyos", "cat": "mmii", "t": ["glut", "fuerza"], "dose": "3×12–20 por lado, 2 o 3 veces/semana", "how": ["Ponte en cuatro apoyos, con una banda elástica pasada por la planta de un pie y sujeta bajo las manos.", "Estira esa pierna hacia atrás y arriba hasta la altura de la cadera, apretando el glúteo, sin arquear la espalda.", "Vuelve lento y completa las repeticiones antes de cambiar de lado."], "care": "La cadera no se gira hacia el lado. Si te duelen las muñecas o las rodillas, usa una toalla doblada debajo.", "contra": "Dolor lumbar que aumenta al llevar la pierna atrás; dolor de muñeca que impide apoyarse.", "prog": {"sets": 3, "lo": 12, "hi": 20, "unit": "banda", "levels": ["Amarilla (suave)", "Roja", "Verde", "Azul", "Negra (fuerte)"]}}, "fz_lateral_banda": {"n": "Caminata lateral con banda", "cat": "mmii", "t": ["glut", "fuerza"], "dose": "3×10–15 pasos por lado, 3 veces/semana", "how": ["Pon una banda elástica corta alrededor de las piernas, sobre las rodillas o en los tobillos.", "Dobla un poco las rodillas y la cadera, y da pasos hacia el lado manteniendo la banda tensa.", "Haz los pasos hacia un lado y vuelve hacia el otro, sin que los pies se junten."], "care": "Las rodillas no se van hacia adentro. Con la banda en los tobillos es más difícil que sobre las rodillas.", "contra": "Dolor en el costado de la cadera (bursitis o tendinopatía glútea) que aumenta con el ejercicio; mal equilibrio.", "prog": {"sets": 3, "lo": 10, "hi": 15, "unit": "banda", "levels": ["Amarilla (suave)", "Roja", "Verde", "Azul", "Negra (fuerte)"]}}, "fz_remo_una": {"n": "Remo a una mano con mancuerna", "cat": "mmss", "t": ["sup", "comp", "fuerza"], "dose": "3×8–12 por lado, 2 o 3 veces/semana", "how": ["Apoya una mano y la rodilla del mismo lado en una silla o banco firme, con la espalda recta.", "Con la otra mano toma la mancuerna y tira hacia la cadera, llevando el codo pegado al cuerpo.", "Baja lento hasta estirar el brazo. Completa las repeticiones y cambia de lado."], "care": "El tronco no gira para subir el peso. Los hombros quedan lejos de las orejas.", "contra": "Dolor agudo de hombro o reparación del manguito sin alta; dolor lumbar agudo.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "kg"}}, "fz_press_hombro": {"n": "Press de hombro sentado con mancuernas", "cat": "mmss", "t": ["sup", "fuerza", "sin_carga"], "dose": "3×8–12, 2 veces por semana", "how": ["Siéntate con la espalda apoyada y una mancuerna en cada mano, a la altura de los hombros.", "Empuja las mancuernas hacia arriba hasta casi estirar los codos, un poco por delante de la cabeza.", "Baja lento hasta la altura de los hombros."], "care": "No arquees la espalda baja ni subas los hombros hacia las orejas.", "c ísica y ayuda a bajar grasa junto con la alimentación. Si tomas medicamentos para la presión o el corazón, guíate por la prueba del habla y no por el pulso.", "contra": "Dolor de pecho, desmayos o palpitaciones sin evaluación médica; insuficiencia cardíaca o respiratoria no controlada."}, "mmss_push_silla": {"n": "Empujar hacia abajo los apoyabrazos", "cat": "mmss", "t": ["muletas", "postop", "sin_carga"], "dose": "3×8 de 5 s, 3 veces por semana", "how": ["Siéntate en una silla firme con apoyabrazos y apoya las manos en ellos.", "Empuja hacia abajo como si fueras a levantarte, pero sin despegarte del asiento.", "Mantén 5 segundos botando el aire y suelta."], "care": "Los hombros van lejos de las orejas. No aguantes la respiración. Si duele el hombro, el codo o la muñeca, detente.", "contra": "Lesión aguda o cirugía reciente de hombro, codo o muñeca sin autorización; presión arterial no controlada."}, "mmss_agarre": {"n": "Apretar una pelota o una toalla", "cat": "mmss", "t": ["muletas", "postop", "sin_carga"], "dose": "3×15 por mano, 3 veces por semana", "how": ["Toma una pelota blanda o una toalla enrollada con una mano.", "Aprieta firme durante 2 segundos.", "Suelta del todo y repite. Mantén la muñeca recta."], "care": "Si aparece hormigueo en los dedos o dolor en la muñeca, detente.", "contra": "Fractura o cirugía reciente de mano o muñeca sin autorización."}, "mmii_abd_cama": {"n": "Abrir la pierna deslizándola en la cama", "cat": "mmii", "t": ["muletas", "postop", "sin_carga"], "dose": "2×10 por lado, 1 vez al día", "how": ["Acuéstate de espalda con las piernas estiradas y los dedos de los pies mirando al techo.", "Desliza una pierna hacia el lado sin levantarla de la cama.", "Vuelve lento al centro, sin cruzar la línea media."], "care": "El pie no gira hacia afuera. Si usas bota, debe quedar bien ajustada. Si tira en la herida o duele, detente.", "contra": "Indicación médica de no mover esa cadera o restricciones de cadera operada distintas a las de esta pauta a no cae ni sube. No aguantes la respiración.", "contra": "Presión arterial no controlada, dolor de hombro al apoyarse, cirugía abdominal reciente o embarazo avanzado.", "prog": {"sets": 3, "lo": 20, "hi": 40, "unit": "nivel", "rl": "s", "levels": ["Antebrazos y rodillas", "Antebrazos y pies"]}}, "fz_fondos_silla": {"n": "Fondos de tríceps en una silla", "cat": "mmss", "t": ["fuerza", "sup"], "dose": "3×8–12, 2 veces por semana", "how": ["Siéntate en el borde de una silla firme apoyada contra la pared, con las manos al lado de la cadera y los dedos hacia adelante.", "Desliza la cadera hacia adelante, fuera del asiento, con las rodillas dobladas.", "Dobla los codos hacia atrás para bajar un poco y empuja para subir, sin encoger los hombros."], "care": "Baja solo hasta que los codos queden en ángulo recto. Si duele la parte delantera del hombro, detente.", "contra": "Dolor, lesión o inestabilidad de hombro, o dolor de muñeca.", "prog": {"sets": 3, "lo": 8, "hi": 12, "unit": "nivel", "levels": ["Rodillas dobladas", "Piernas estiradas"]}}, "fz_silla": {"n": "Sentarse y pararse de una silla, con progresión", "cat": "mmii", "t": ["fuerza", "caidas", "comp"], "dose": "3×8–15, 2 o 3 veces por semana", "how": ["Siéntate en la mitad delantera de una silla firme apoyada contra la pared, con los pies al ancho de las caderas.", "Inclina el tronco hacia adelante y párate empujando con las piernas, sin impulso.", "Siéntate lento, en 3 segundos, rozando la silla antes de volver a subir."], "care": "Las rodillas siguen la dirección de los pies. Si te mareas al pararte, espera de pie con apoyo.", "contra": "Mareo al ponerse de pie sin evaluar, o cirugía reciente de cadera o rodilla con restricciones.", "prog": {"sets": 3, "lo": 8, "hi": 15, "unit": "nivel", "levels": ["Con apoyo de manos", "Sin manos", "Con mochila o peso al pecho"]}}, "fz_puente": {"n": "Puente de glúteos en el suelo, con progresión", "cat": "mmii", "t": ["fuerza", "glut", "lumbar"], "dose": "3×10–15, 3 veces por se function totalXP(){let x=0;for(const d in S.done)for(const m in S.done[d])x+=S.done[d][m];for(const s of S.train.sessions)x+=s.xp||0;return x}
function stageIdx(xp){let i=0;XP_STEPS.forEach((v,k)=>{if(xp>=v)i=k});return i}
function scheduled(m,day){if(m.archived&&m.archived<=day)return false;if(m.created>day)return false;return m.days.includes(pdate(day).getDay())}
function dayMissions(day){return S.missions.filter(m=>scheduled(m,day)).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"))}
function streak(){let n=0,g=0,d=today();const has=x=>S.done[x]&&Object.keys(S.done[x]).length>0,first=S.created||today();if(!has(d))d=addDays(d,-1);for(let k=0;k<1500&&d>=first;k++){if(has(d))n++;else if(dayMissions(d).length===0){}else if(g<1+Math.floor(n/7))g++;else break;d=addDays(d,-1)}return n}
function memberState(){const m=M||{status:"SIN MEMBRESÍA",active:false},exp=m.expires_at?Date.parse(m.expires_at):0,now=Date.now()+skew,active=!!m.active&&exp>now;let status=m.status;if(status==="ACTIVO"&&!active)status="VENCIDO";return{status,active,exp,kind:m.kind||"",days:active?Math.ceil((exp-now)/DAY):0}}

function parqFlags(){return parqValid()?S.train.parq.map((v,i)=>v?i:-1).filter(i=>i>=0):[]}
function trainReady(){const t=S.train;if(!S.onboard?.health)return"consent";if(!parqValid())return"parq";if(parqFlags().length&&!t.cleared)return"paused";if(t.hold)return"hold";if(!t.plan)return"plan";return"ok"}
function strengthAt(stage){const t=S.train;return t.sessions.filter(s=>s.type==="fuerza"&&s.stage===stage&&(s.at||0)>=(t.stageAt||0))}
function sessionToday(){return S.train.sessions.find(s=>s.date===today())}
function walkUp(){const t=S.train;if(!t.plan||t.plan.walk>=30)return 0;const w=t.sessions.filter(s=>s.type==="caminata"&&(s.at||0)>=(t.walkAt||0)),days=[...new Set(w.map(s=>s.date))];return days.length>=NEED&&w.slice(0,NEED).every(s=>s.result==="completa"&&s.borg<=6&&s.pain<=2&&!s.alert)?t.plan.walk+5:0}
const LVMAX=3;
function doseAt(d,l){if(!l)return d;const m=String(d).match(/^(\d+)×(\d+)( s)?(.*)$/);if(!m)return d;return m[1]+"×"+(+m[2]+(m[3]?5:2)*l)+(m[3]||"")+m[4]}
function stepReady(){const t=S.train;if((t.lvl||0)>=LVMAX)return false;const last=t.sessions[0];if(last&&last.pain>=3)return false;const ss=strengthAt(t.stage).filter(s=>(s.at||0)>=(t.lvlAt||0)),days=[...new Set(ss.map(s=>s.date))];return days.length>=2&&ss.slice(0,2).every(s=>s.result==="completa"&&s.borg<=6&&s.pain<=2&&!s.alert)}
function seniorCap(){const t=S.train;return !!t.senior&&!t.seniorOk&&t.stage>=SCAP}
function progression(){const t=S.train,last=t.sessions[0],cur=strengthAt(t.stage),days=[...new Set(cur.map(s=>s.date))],n=days.length;
  if(last&&last.pain>=3)return{state:"hold",n};
  if(t.stage<6&&n>=NEED&&cur.slice(0,NEED).every(s=>s.result==="completa"&&s.borg<=6&&s.pain<=2&&!s.alert))return{state:seniorCap()?"cap":"advance",n};
  return{state:"keep",n}}

 return`<div class="mission ${dn?"done":""}"><span class="t">${esc(m.time||"—")}</span><div class="n"><b>${esc(m.name)}</b><span class="mute small">+${+m.xp||0} XP${m.dur?" · "+m.dur+" min":""}${act?"":` · ${esc(m.cat)} · ${m.days.length===7?"todos los días":m.days.map(x=>DOW[x]).join(", ")}`}</span>${!act||op?`<div class="row small" style="margin-top:4px">${links}</div>`:m.dur?`<div class="row small" style="margin-top:4px"><button class="link" data-act="startTimer" data-id="${m.id}">Temporizador</button></div>`:""}</div>${act?`<button class="more" data-act="mMore" data-id="${m.id}" aria-expanded="${op}" aria-label="Opciones de ${esc(m.name)}">⋯</button><button class="check" aria-label="${dn?"Desmarcar":"Marcar como cumplida"}" data-act="toggle" data-id="${m.id}">${dn?"✓":""}</button>`:""}</div>`}

function calUrl(m){let d=today();for(let i=0;i<7&&!m.days.includes(pdate(d).getDay());i++)d=addDays(d,1);const[h,mi]=m.time.split(":").map(Number),s=d.replace(/-/g,"")+"T"+pad(h)+pad(mi)+"00",e=new Date(pdate(d).getTime()+(h*60+mi+15)*6e4),es=dstr(e).replace(/-/g,"")+"T"+pad(e.getHours())+pad(e.getMinutes())+"00";
 let tz="America/Santiago";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
 return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(m.name)+"&dates="+s+"/"+es+"&ctz="+encodeURIComponent(tz)+"&recur="+encodeURIComponent("RRULE:FREQ=WEEKLY;BYDAY="+m.days.map(x=>BYDAY[x]).join(","))}
function vMissionForm(){const f=view.form;return`<form class="card" id="mForm"><h3>${f.id?"Editar misión":"Nueva misión"}</h3><label>Nombre<input id="mName" maxlength="60" required value="${esc(f.name||"")}"></label>
 <div class="grid2"><label>Categoría<select id="mCat">${(f.cat&&!CATS.includes(f.cat)?[...CATS,f.cat]:CATS).map(c=>`<option ${f.cat===c?"selected":""}>${c}</option>`).join("")}</select></label><label>Esfuerzo<select id="mXp">${[[20,"Liviano · 20 XP"],[40,"Medio · 40 XP"],[60,"Exigente · 60 XP"]].map(([v,l])=>`<option value="${v}" ${f.xp==v?"selected":""}>${l}</option>`).join("")}</select></label>
 <label>Hora (opcional)<input id="mTime" type="time" value="${f.time||""}"></label><label>Duración en minutos (opcional)<input id="mDur" type="number" min="1" max="240" value="${f.dur||""}"></label></div>
 <div><div class="mute small" style="margin-bottom:6px">Días</div><div class="row">${DOW.map((l,i)=>`<label class="chk"><input type="checkbox" class="mDay" value="${i}" ${(f.days||[0,1,2,3,4,5,6]).includes(i)?"checked":""}> ${l}</label>`).join("")}</div></div>

function vTimer(){const t=S.timer;if(!t)return"";const m=S.missions.find(x=>x.id===t.mid);return`<div class="card"><div class="row sp"><h3>${esc(m?m.name:"Temporizador")}</h3><span class="pill">${t.dur} min</span></div><div class="timer" id="tClock">--:--</div><div class="row"><button class="btn pri" data-act="timerToggle">${t.run?"Pausar":"Continuar"}</button><button class="btn" data-act="timerStop">Cerrar</button></div><p class="mute small" id="tNote">Al terminar suena un aviso. La misión no se marca sola: confírmala tú.</p></div>`}
function timerElapsed(){const t=S.timer;return t?t.acc+(t.run?Date.now()-t.since:0):0}
function tickTimer(){const el=$("#tClock");if(!el||!S.timer)return;const left=Math.max(0,S.timer.dur*6e4-timerElapsed()),s=Math.ceil(left/1e3);el.textContent=pad(Math.floor(s/60))+":"+pad(s%60);
 if(left<=0&&!S.timer.rang){S.timer.rang=true;S.timer.run=false;S.timer.acc=S.timer.dur*6e4;save();beep();$("#tNote").textContent="Tiempo cumplido. Marca la misión si la hiciste.";toast("Tiempo cumplido")}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(a.currentTime+.6)}catch(e){}}
function vMisiones(){const f=view.cat||"Todas",list=S.missions.filter(m=>!m.archived&&(f==="Todas"||m.cat===f)).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
 return`${memberBanner()}<div class="row sp"><div><div class="eyebrow">Tu plan, a tu ritmo</div><h1>Misiones.</h1><p class="mute">Ordenadas por hora. Las que no tienen horario quedan al final.</p></div><div class="row"><button class="btn" data-act="toggleCatalog">Explorar 24 hábitos</button><button class="btn pri" data-act="newMission">+ Nueva misión</button></div></div>

 ${view.catalog?`<div class="card"><h3>Hábitos sugeridos${f==="Todas"?"":" · "+f}</h3>${(f==="Todas"?CATS:[f]).map(g=>{const its=CATALOG.map((c,i)=>[c,i]).filter(([c])=>c[1]===g);if(!its.length)return f==="Todas"?"":`<p class="mute">No hay hábitos sugeridos en esta categoría. Crea el tuyo con «Nueva misión».</p>`;return`<div class="stack" style="gap:8px;margin-top:10px">${f==="Todas"?`<div class="eyebrow" style="border-bottom:1px solid var(--line);padding-bottom:4px">${g} · ${its.length}</div>`:""}${its.map(([c,i])=>{const has=S.missions.some(m=>!m.archived&&m.name===c[0]);return`<div class="row sp"><span>${esc(c[0])} <span class="mute small">· ${c[2]} XP${c[3]?" · "+c[3]:""}</span></span><button class="btn" data-act="addCat" data-i="${i}" ${has?"disabled":""}>${has?"Agregado":"Agregar"}</button></div>`}).join("")}</div>`}).join("")}</div>`:""}
 ${list.length?list.map(m=>missionRow(m,today(),false)).join(""):`<div class="card"><h3>Sin misiones en esta categoría</h3><p class="mute">Agrega una o elige entre los hábitos sugeridos.</p></div>`}`}

 else if(r==="paused"){const fl=parqFlags(),hard=fl.some(i=>PARQ_HARD.includes(i));body=`<form class="card" id="clearForm"><div class="banner ${hard?"bad":"warn"}"><b>${hard?"Necesitas una evaluación profesional antes de usar este plan.":"Consulta con tu médico o kinesiólogo antes de empezar."}</b> Respondiste Sí en:<ul style="margin:6px 0 0;padding-left:20px">${fl.map(i=>`<li>${PARQ[i]}</li>`).join("")}</ul></div>${hard?`<p>Estas respuestas pueden indicar un riesgo al hacer ejercicio. No actives el plan de fuerza hasta que un profesional de salud te haya evaluado. Tus hábitos siguen funcionando igual.</p>`:""}<label>Nombre del profesional que te evaluó${hard?"":" (opcional)"}<input id="clearBy" maxlength="60" ${hard?"required minlength=\"3\"":""} autocomplete="off"></label><label class="chk tap"><input type="checkbox" id="clearChk"> <span>Un profesional de salud revisó mi caso y me autorizó a hacer este tipo de ejercicio.</span></label><div class="row"><button class="btn pri" type="submit">Confirmar autorización</button><button class="btn" type="button" data-act="redoParq">Me equivoqué, responder de nuevo</button></div><p class="mute small">Esta autorización queda registrada con fecha y aparece en tu resumen de salud.</p></form>`}
 else if(r==="plan")body=`<form class="card" id="planForm"><h3>Crear mi plan de tres días</h3><label>3 días de fuerza por semana<select id="pDays">${Object.entries(DAYSETS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("")}</select></label><label>Duración inicial de la caminata<select id="pWalk">${[5,10,15,20,30].map(n=>`<option value="${n}" ${n===10?"selected":""}>${n} minutos</option>`).join("")}</select></label><label class="chk tap"><input type="checkbox" id="pSenior" ${t.senior?"checked":""}> <span>Tengo 60 años o más, o prefiero la versión adaptada (ilustraciones con una persona mayor y consejos de seguridad extra).</span></label><p class="mute small">Si estás retomando, elige 5 o 10 minutos y un ritmo cómodo. Puedes hacer menos y registrar lo que realmente hiciste.</p><div class="row"><button class="btn pri" type="submit">Activar mi plan</button></div></form>`;
 else if(r==="hold"){const h=t.hold,sx=h.kind==="sintomas";body=`<div class="card"><div class="banner bad"><b>Tu plan está en pausa.</b> El ${fmtDate(h.at)} registraste ${sx?"síntomas de alerta":"dolor alto o un dolor nuevo"}.</div><p>${sx?"Si los síntomas siguen, fueron intensos o se repiten, consulta a un profesional antes de volver a entrenar. Si hay dolor en el pecho o falta de aire que no ceden, llama al SAMU 131.":"Descansa de la fuerza hasta que el dolor vuelva a tu nivel habitual. Si no mejora en unos días, o empeora, consulta a un profesional."}</p><label class="chk tap"><input type="checkbox" id="holdChk"> <span>${sx?"Los síntomas pasaron y, si fue necesario, consulté a un profesional.":"El dolor volvió a mi nivel habitual."}</span></label><div class="row"><button class="btn pri" data-act="holdOff" data-m="same">Reanudar mi plan</button>${t.stage>1?`<button class="btn" data-act="holdOff" data-m="down">Reanudar una etapa más abajo</button>`:""}</div><p class="mute small">Al reanudar, el avance de etapa parte de cero${sx?" y te pediremos responder de nuevo el cuestionario previo":""}.</p></div>`}
 else{const tt=todayTrain(),st=STAGES[t.stage-1],pr=progression(),sd=sessionToday(),wu=walkUp();
  body=`${pr.state==="hold"?`<div class="banner warn"><b>Dolor 3 o 4 en tu último registro:</b> mantén la etapa actual y no subas la carga.</div>`:pr.state==="cap"?`<form class="banner warn" id="sokForm"><b>Cumpliste las sesiones para avanzar, pero en la versión adaptada el plan se queda en la etapa ${t.stage}.</b> Desde la etapa 3 aparecen ejercicios más exigentes, como la plancha completa y el puente a una pierna. Para seguir avanzando, pide a tu médico o kinesiólogo que revise cómo los haces. Mientras tanto puedes seguir entrenando en esta etapa todo el tiempo que quieras.<label style="margin-top:10px">Nombre del profesional que te autorizó a avanzar<input id="sokBy" maxlength="60" autocomplete="off"></label><div class="row" style="margin-top:8px"><button class="btn" type="submit">Un profesional me autorizó a avanzar</button></div></form>`:pr.state==="advance"?`<div class="banner ok">Completaste ${NEED} sesiones de fuerza en días distintos, con esfuerzo de 6 o menos y dolor de 2 o menos. <button class="link tap" data-act="stageUp">Avanzar a la etapa ${t.stage+1}</button></div>`:t.stage<6?`${seniorCap()?`<p class="mute small">Versión adaptada: el plan se mantiene en la etapa ${t.stage} hasta que un profesional de salud autorice avanzar.</p>`:""}<p class="mute small">Avance de etapa: ${Math.min(pr.n,NEED)} de ${NEED} sesiones de fuerza en días distintos. Para avanzar deben ser completas, con esfuerzo de 6 o menos y dolor de 2 o menos.</p>`:""}${pr.state!=="advance"&&pr.state!=="hold"&&stepReady()?`<div class="banner ok">Dos sesiones de fuerza seguidas completas, con esfuerzo de 6 o menos y dolor de 2 o menos. <button class="link tap" data-act="stepUp">Subir un paso: 2 repeticiones más (o 5 segundos más) por serie</button></div>`:""}${wu&&tt!=="fuerza"?`<div class="banner ok">Llevas ${NEED} caminatas cómodas. <button class="link tap" data-act="walkUp">Subir la caminata a ${wu} minutos</button></div>`:""}

al.</div>`:""}`:`<p>Camina ${t.plan.walk} minutos a un ritmo en que puedas conversar sin quedar sin aire. Usa calzado cómodo y un recorrido plano y conocido.</p>`}<p class="mute small">Días de fuerza: ${DAYSETS[t.plan.days].label}. <button class="link tap" data-act="resetPlan">Cambiar plan</button> · <button class="link tap" data-act="seniorToggle">${t.senior?"Volver a la versión estándar":"Usar versión adaptada para adulto mayor"}</button> · <button class="link tap" data-act="stageDown" ${t.stage>1?"":"hidden"}>Bajar una etapa</button>${t.lvl?` · <button class="link tap" data-act="stepDown">Bajar un paso</button>`:""}</p>
  ${sd?`<div class="banner ok">Ya registraste tu sesión de hoy (${sd.type}, ${sd.result}). Una sesión por día es suficiente: el descanso también es parte del plan. <button class="link tap" data-act="delToday">Corregir el registro de hoy</button></div>`:view.log?vLogForm(tt):`<div class="row"><button class="btn pri" data-act="openLog">Registrar sesión de hoy</button></div>`}</div>`}

 <div class="card"><h3>Resumen de salud y entrenamiento</h3><p class="small"><b>Contiene datos de salud, compártelo solo con el personal de salud que te atienda.</b> Es un registro que llenaste tú, no una ficha clínica.</p><label>Período del resumen<select id="sumDays">${[[14,"Últimos 14 días"],[30,"Últimos 30 días"],[90,"Últimos 90 días"]].map(([v,l])=>`<option value="${v}" ${(view.sumDays||14)===v?"selected":""}>${l}</option>`).join("")}</select></label><textarea id="kineTxt" readonly>${esc(kineSummary())}</textarea><div class="row"><button class="btn" data-act="copyKine">Copiar resumen</button><button class="btn" data-act="printMine">Imprimir o guardar como PDF</button></div><h3 style="margin-top:16px">Tu evolución por semana</h3>${weekCharts(t.sessions,doneCount(S.done))}</div>`:""}`}

function weekData(sessions,doneCnt,n=8){const out=[],dow=(pdate(today()).getDay()+6)%7;
 for(let w=n-1;w>=0;w--){const start=addDays(today(),-dow-7*w),end=addDays(start,6),ss=(sessions||[]).filter(x=>x&&x.date>=start&&x.date<=end),ps=ss.map(x=>x.pain).filter(v=>typeof v==="number");let hd=0;for(let i=0;i<7;i++)if(((doneCnt||{})[addDays(start,i)]||0)>0)hd++;
  out.push({start,label:fmtDate(start).slice(0,5),sess:ss.length,pain:ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null,habit:hd})}
 return out}
function doneCount(done){const o={};for(const k in done||{})o[k]=Object.keys(done[k]||{}).length;return o}
function miniChart(title,note,wd,key,max,kind){const W=320,H=132,L=26,R=8,T=14,B=24,pw=W-L-R,ph=H-T-B,n=wd.length,step=pw/n,y=v=>T+ph-(Math.min(v,max)/max)*ph,fm=v=>kind==="line"?v.toFixed(1).replace(".",","):String(v);
 const grid=(max%2?[0,max]:[0,max/2,max]).map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--mute)">${v}</text>`).join("");
 const xl=wd.map((d,i)=>i%2===(n-1)%2?`<text x="${L+step*i+step/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--mute)">${d.label}</text>`:"").join("");
 let marks="";
 if(kind==="line"){const pts=wd.map((d,i)=>d[key]===null?null:[L+step*i+step/2,y(d[key]),d]);let seg=[],path="";pts.forEach(p=>{if(p)seg.push(p);else{if(seg.length>1)path+="M"+seg.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join("L");seg=[]}});if(seg.length>1)path+="M"+seg.map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join("L");
  marks=(path?`<path d="${path}" fill="none" stroke="var(--cool)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:"")+pts.map(p=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--cool)" stroke="var(--panel)" stroke-width="2"><title>Semana del ${p[2].label}: ${fm(p[2][key])}</title></circle><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="10" fill="var(--fg)">${fm(p[2][key])}</text>`:"").join("")}
 else marks=wd.map((d,i)=>{const v=d[key],bw=Math.min(22,step-6),x=L+step*i+(step-bw)/2,h=T+ph-y(v);return v>0?`<path d="M${x} ${T+ph}V${y(v)+3}q0 -3 3 -3h${bw-6}q3 0 3 3V${T+ph}z" fill="var(--cool)"><title>Semana del ${d.label}: ${v}</title></path><text x="${x+bw/2}" y="${y(v)-4}" text-anchor="middle" font-size="10" fill="var(--fg)">${v}</text>`:""}).join("");
 const has=wd.some(d=>d[key]!==null&&d[key]>0||(kind==="line"&&d[key]!==null));
 return`<figure class="wk"><figcaption><b>${title}</b><span class="mute small"> · ${note}</span></figcaption>${has?`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}, últimas ${n} semanas">${grid}${marks}${xl}</svg>`:`<p class="mute small" style="margin:6px 0 0">Sin registros en las últimas ${n} semanas.</p>`}</figure>`}
function weekCharts(sessions,doneCnt){const wd=weekData(sessions,doneCnt);return`<div class="wkgrid">${miniChart("Dolor promedio","escala 0 a 10, por semana",wd,"pain",10,"line")}${miniChart("Sesiones registradas","por semana",wd,"sess",Math.max(4,...wd.map(d=>d.sess)),"bar")}${miniChart("Días con hábitos cumplidos","de 7, por semana",wd,"habit",7,"bar")}</div>`}

 const end=pdate(t),startCol=new Date(end);startCol.setDate(end.getDate()-end.getDay()-7*11);let cal="";

function b64u(x){const p="=".repeat((4-x.length%4)%4),b=atob((x+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}

<script>
/* Ojo para mostrar u ocultar la contraseña en todos los campos de clave */
(function(){
  var OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var SHUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 5.4-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function set(b,inp,show){inp.type=show?'text':'password';b.setAttribute('aria-pressed',show?'true':'false');b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.title=show?'Ocultar contraseña':'Mostrar contraseña';b.innerHTML=show?SHUT:OPEN}
  function enhance(root){
    (root.querySelectorAll?root:document).querySelectorAll('input[type=password]:not([data-pw])').forEach(function(inp){
      inp.setAttribute('data-pw','1');
      inp.setAttribute('autocapitalize','off');inp.setAttribute('spellcheck','false');
      var w=document.createElement('span');w.className='pw-wrap';
      inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
      var b=document.createElement('button');b.type='button';b.className='pw-eye';
      set(b,inp,false);
      b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var pos=inp.selectionStart;set(b,inp,inp.type==='password');inp.focus();try{inp.setSelectionRange(pos,pos)}catch(_){}});
      w.appendChild(b);
    });
  }
  // al enviar un formulario, la clave vuelve a ocultarse
  document.addEventListener('submit',function(e){e.target.querySelectorAll&&e.target.querySelectorAll('.pw-eye[aria-pressed="true"]').forEach(function(b){var i=b.parentNode.querySelector('input');if(i)set(b,i,false)})},true);
  new MutationObserver(function(){enhance(document)}).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState!=='loading')enhance(document);else document.addEventListener('DOMContentLoaded',function(){enhance(document)});
})();
</script>

  else toast("Pago recibido. Estamos activando tu acceso…");
  var antes=(M&&M.expires_at)||"",n=0;

    if(M&&M.expires_at&&M.expires_at!==antes&&M.active){render();toast("Listo: tu plan quedó activo por "+CFG.periodDays+" días más.");return}
